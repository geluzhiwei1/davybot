# 产品调研模板（内置示例主题）
# 设计: project/docs/PRD-gelu-diaoyan/prd-产品调研.md §6.3
# 契约: ProductSurveyTemplate (slug/name/category/estimated_products/estimated_dimensions/
#       estimated_minutes/tags/description/is_builtin/default_dao_path)
# 消费: dawei/workspace/product_survey_service.py
#
# 每个模板提供:
#   - 模板市场卡片数据（名称/分类/预估规模/耗时/标签）
#   - 向导 Step 3 的维度清单（D1..Dn，含一句话边界描述）
#   - 向导 Step 1/2 的默认值（主题、范围）
#   - dao.md 生成素材（调研重点 goals_hints，供 GATE-0 预览）

templates:
  # 空白调研：不预设任何方向（default_topic 留空），主题由用户输入；
  # 维度给 4 个通用分析维度（适用任意主题），GATE-0 需求确认阶段可增删调整。
  - slug: blank
    name: "空白调研"
    category: "自定义"
    icon: "🧭"
    description: |
      不预设任何调研方向：输入你关心的主题（任何 AI 产品赛道均可），
      在 GATE-0 需求确认阶段与智能体一起细化范围、维度与成功标准。
    estimated_products: 60
    estimated_dimensions: 4
    estimated_minutes: 120
    tags: ["自定义", "自由主题"]
    is_builtin: true
    default_topic: ""
    audience: ""
    default_scope:
      regions: ["中国大陆", "海外"]
      industries: ["全部"]
      time_window: "不限"
      product_forms: ["不限"]
    dimensions:
      - { key: D1, name: "产品与功能", description: "产品形态、核心功能与差异化能力" }
      - { key: D2, name: "技术路线", description: "AI 技术栈、实现路线与工程化程度" }
      - { key: D3, name: "商业模式", description: "定价层级、计费模式与目标客群" }
      - { key: D4, name: "市场格局", description: "头部玩家、区域分布与竞品对比" }
    goals_hints:
      - "按 4 个通用维度建立产品索引，GATE-0 阶段可增删维度"

  - slug: ai-short-video
    name: "AI 短视频生成"
    category: "内容创作"
    icon: "📊"
    description: |
      调研全球范围内 AI 短视频生成赛道：文本/图片生成视频、智能剪辑、
      数字人播报、AI 配音配乐、营销分发与数据看板等维度，
      覆盖海内外已上线的商业产品。
    estimated_products: 80
    estimated_dimensions: 8
    estimated_minutes: 180
    tags: ["AIGC", "视频", "营销", "出海"]
    is_builtin: true
    default_topic: "AI 短视频生成"
    audience: "内容营销负责人 / MCN / 出海团队"
    default_scope:
      regions: ["中国大陆", "海外"]
      industries: ["内容创作", "营销"]
      time_window: "近 1 年新发布的产品优先"
      product_forms: ["Web", "移动端", "API/SDK"]
    dimensions:
      - { key: D1, name: "内容生成", description: "文生视频、图生视频、脚本到成片的一站式生成" }
      - { key: D2, name: "视频编辑", description: "AI 剪辑、自动字幕、智能转场与素材推荐" }
      - { key: D3, name: "数字人", description: "数字人播报、口型同步、形象克隆" }
      - { key: D4, name: "配音配乐", description: "AI 语音合成、声音克隆、智能配乐" }
      - { key: D5, name: "营销分发", description: "多平台一键分发、批量混剪、投放素材工厂" }
      - { key: D6, name: "数据分析", description: "播放数据回流、爆款拆解、内容优化建议" }
      - { key: D7, name: "协作工具", description: "团队审片、品牌资产管理、工作流自动化" }
      - { key: D8, name: "硬件/外设", description: "AI 拍摄硬件、云直播一体机、辅助外设" }
    goals_hints:
      - "摸清头部玩家与差异化机会（工具 vs 平台 vs Agent）"
      - "对比国内（剪映/即创系）与海外（Runway/Pika 系）的产品路线"
      - "识别广告主与 MCN 的真实采购决策因素（价格/版权/合规）"

  - slug: ai-translation
