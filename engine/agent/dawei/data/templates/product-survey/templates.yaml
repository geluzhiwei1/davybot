    category: "效率工具"
    icon: "🌐"
    description: |
      调研 AI 翻译与本地化赛道：通用机器翻译、专业领域翻译、
      软件本地化工程、同传/口译、字幕翻译与企业术语管理，
      覆盖海内外商业产品与 API 服务。
    estimated_products: 60
    estimated_dimensions: 6
    estimated_minutes: 120
    tags: ["翻译", "本地化", "出海", "API"]
    is_builtin: true
    default_topic: "AI 翻译工具"
    audience: "出海团队 / 本地化经理 / 采购决策者"
    default_scope:
      regions: ["中国大陆", "海外"]
      industries: ["全部"]
      time_window: "不限（成熟产品为主）"
      product_forms: ["Web", "API/SDK", "桌面端"]
    dimensions:
      - { key: D1, name: "通用机器翻译", description: "多语种文本/文档翻译，主打质量与价格" }
      - { key: D2, name: "专业领域翻译", description: "法律/医学/金融等垂直领域翻译" }
      - { key: D3, name: "本地化工程", description: "软件/i18n 资源文件、网站本地化流水线" }
      - { key: D4, name: "实时口译", description: "会议同传、通话翻译、同声传译硬件" }
      - { key: D5, name: "字幕翻译", description: "视频字幕自动生成、翻译与压制" }
      - { key: D6, name: "企业术语管理", description: "术语库、翻译记忆库、多人协作审校" }
    goals_hints:
      - "对比 LLM 翻译与专用 NMT 引擎的质量/成本差异"
      - "梳理企业级功能（术语库/记忆库/权限/审计）的覆盖情况"
      - "识别 API 计费模式与单价区间"

