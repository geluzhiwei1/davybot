template:
  slug: patent-draft-electronics
  name: "电子/通信专利草案"
  version: "1.0"
  module: ip-draft
  team_slug: ip-draft

  description: |
    针对电子电路、通信系统、半导体器件等领域的管辖中立专利草案撰写。
    重点关注电路结构限定、信号处理步骤、方法+装置+系统权利要求布局。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "如：一种低功耗5G终端接收机及信号处理方法"
        store: "input/task_params.json"
      - key: tech_field
        label: "技术领域"
        type: select
        options:
          - { value: "", label: "请选择" }
          - { value: "集成电路", label: "集成电路/芯片设计" }
          - { value: "无线通信", label: "无线通信 (5G/6G/WiFi)" }
          - { value: "光通信", label: "光通信/光纤" }
          - { value: "信号处理", label: "数字/模拟信号处理 (DSP)" }
          - { value: "电源管理", label: "电源管理/功率电子" }
          - { value: "传感器", label: "传感器/物联网" }
          - { value: "消费电子", label: "消费电子/可穿戴设备" }
        default: ""
        store: "input/task_params.json"
      - key: draft_strategy
        label: "撰写策略"
        type: select
        options:
          - { value: "balanced", label: "均衡策略" }
          - { value: "broad", label: "宽泛策略" }
          - { value: "narrow", label: "保守策略" }
        default: "balanced"
        store: "input/task_params.json"
    optional:
      - key: circuit_detail
        label: "电路/系统结构"
        type: string
        placeholder: "关键电路模块、连接关系、信号链路"
        store: "input/task_params.json"
      - key: applicant_name
        label: "申请人名称"
        type: string
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/patent-examination-guidelines

  checklists:
    - ref: "checklist/draft-completeness"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游交底书继承的文件"
    - dir: input/checklists
      description: "草案完整性清单"
    - dir: output
      description: "Agent 产出"
    - dir: output/claims
      description: "权利要求层次结构"
    - dir: output/description
      description: "技术方案阐述各部分"
    - dir: drafts
      description: "完整草案文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入电子/通信专利草案撰写工作区，请按照 PDCA 工作流执行。

    ## 领域重点：电子/通信专利草案
    电子通信类专利草案需特别关注以下方面：
    1. **电路结构限定**：用"包括…连接到…""经由…耦合至…"描述模块间的物理连接
    2. **信号处理步骤**：方法权利要求按信号流向逐步描述（接收→滤波→变换→解调→输出）
    3. **参数范围**：关键参数（频率/带宽/信噪比/增益）用范围限定（如"频率范围为X至Y"）
    4. **标准必要专利**：涉及通信标准时，标注标准条款号和规范版本
    5. **权利要求布局**：方法→装置（电路模块）→系统→芯片→计算机可读存储介质

    ## 核心原则：管辖中立
    本草案产出的所有内容不限定任何国家的专利法格式。

    ## 输入数据
    1. `input/task_params.json` — 发明名称、技术领域、撰写策略、电路结构
    2. `input/inherited/` — 技术交底书（从上游继承）

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取输入，列出电路/信号特征清单，规划权利要求层次
    ### Do: 撰写权利要求（方法→装置→系统→芯片）+ 技术方案阐述
    ### Check: 核对清单
    ### Act: 生成完整草案

  deliverables:
    - file: "drafts/patent_draft_full.md"
      name: "电子/通信专利草案全文"
      format: markdown
    - file: "output/claims/claims_hierarchy.md"
      name: "权利要求层次结构"

  phases:
    - name: plan
      label: "分析规划"
      progress: 15
    - name: do_claims
      label: "撰写权利要求"
      progress: 25
    - name: do_description
      label: "撰写技术方案"
      progress: 30
    - name: check
      label: "质量审查"
      progress: 20
    - name: act
      label: "生成草案文件"
      progress: 10
