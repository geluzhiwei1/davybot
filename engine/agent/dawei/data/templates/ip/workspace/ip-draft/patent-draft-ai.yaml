template:
  slug: patent-draft-ai
  name: "AI/软件专利草案"
  version: "1.0"
  module: ip-draft
  team_slug: ip-draft

  description: |
    针对人工智能、算法、软件方法类创新的管辖中立专利草案撰写。
    重点关注客体适格性、算法步骤限定、方法+装置+介质权利要求布局。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "如：一种基于注意力机制的多模态数据融合方法及装置"
        store: "input/task_params.json"
      - key: tech_field
        label: "技术领域"
        type: select
        options:
          - { value: "", label: "请选择" }
          - { value: "机器学习", label: "机器学习/深度学习" }
          - { value: "自然语言处理", label: "自然语言处理 (NLP)" }
          - { value: "计算机视觉", label: "计算机视觉" }
          - { value: "推荐系统", label: "推荐系统/搜索算法" }
          - { value: "系统软件", label: "操作系统/数据库/中间件" }
          - { value: "软件架构", label: "软件架构/微服务/分布式" }
        default: ""
        store: "input/task_params.json"
      - key: draft_strategy
        label: "撰写策略"
        type: select
        options:
          - { value: "balanced", label: "均衡策略" }
          - { value: "broad", label: "宽泛策略" }
          - { value: "narrow", label: "保守策略" }
        default: "balanced"
        store: "input/task_params.json"
    optional:
      - key: algorithm_detail
        label: "算法核心步骤"
        type: string
        placeholder: "算法各步骤、公式、数据变换过程"
        store: "input/task_params.json"
      - key: applicant_name
        label: "申请人名称"
        type: string
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/patent-examination-guidelines

  checklists:
    - ref: "checklist/draft-completeness"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游交底书继承的文件"
    - dir: input/checklists
      description: "草案完整性清单"
    - dir: output
      description: "Agent 产出"
    - dir: output/claims
      description: "权利要求层次结构"
    - dir: output/description
      description: "技术方案阐述各部分"
    - dir: drafts
      description: "完整草案文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入 AI/软件专利草案撰写工作区，请按照 PDCA 工作流执行。

    ## 领域重点：AI/软件专利草案
    AI/软件类专利草案需特别关注以下方面：
    1. **客体适格性**：权利要求必须体现"技术手段—技术问题—技术效果"三要素，避免被认定为智力活动规则
    2. **算法步骤限定**：每个权利要求步骤必须包含具体的技术操作（数据采集→预处理→特征提取→模型推理→结果输出）
    3. **功能模块化**：装置权利要求用"模块化"描述（获取模块→处理模块→输出模块），与方法权利要求对应
    4. **技术效果关联**：每项限定都应与技术效果产生关联，避免纯粹的业务逻辑
    5. **权利要求布局**：方法→装置（功能模块）→电子设备（处理器+存储器）→计算机可读存储介质

    ## 核心原则：管辖中立
    本草案产出的所有内容不限定任何国家的专利法格式。

    ## 输入数据
    1. `input/task_params.json` — 发明名称、技术领域、撰写策略、算法步骤
    2. `input/inherited/` — 技术交底书（从上游继承）

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取输入，列出技术特征清单，规划权利要求层次
    ### Do: 撰写权利要求（方法→装置→设备→介质）+ 技术方案阐述
    ### Check: 核对清单（重点检查客体适格性）
    ### Act: 生成完整草案

  deliverables:
    - file: "drafts/patent_draft_full.md"
      name: "AI/软件专利草案全文"
      format: markdown
    - file: "output/claims/claims_hierarchy.md"
      name: "权利要求层次结构"

  phases:
    - name: plan
      label: "分析规划"
      progress: 15
    - name: do_claims
      label: "撰写权利要求"
      progress: 25
    - name: do_description
      label: "撰写技术方案"
      progress: 30
    - name: check
      label: "质量审查"
      progress: 20
    - name: act
      label: "生成草案文件"
      progress: 10
