template:
  slug: patent-draft-mechanical
  name: "机械/制造专利草案"
  version: "1.0"
  module: ip-draft
  team_slug: ip-draft

  description: |
    针对机械结构、制造工艺、自动化设备等领域的管辖中立专利草案撰写。
    重点关注结构特征限定、工序步骤、产品+方法+设备权利要求布局。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "如：一种精密齿轮传动机构及加工方法"
        store: "input/task_params.json"
      - key: tech_field
        label: "技术领域"
        type: select
        options:
          - { value: "", label: "请选择" }
          - { value: "精密机械", label: "精密机械/传动机构" }
          - { value: "制造工艺", label: "制造工艺/加工方法" }
          - { value: "自动化设备", label: "自动化设备/工业机器人" }
          - { value: "汽车工程", label: "汽车/轨道交通" }
          - { value: "航空航天", label: "航空航天/船舶" }
          - { value: "模具/夹具", label: "模具/夹具/检具" }
          - { value: "流体机械", label: "流体机械/液压/气动" }
        default: ""
        store: "input/task_params.json"
      - key: draft_strategy
        label: "撰写策略"
        type: select
        options:
          - { value: "balanced", label: "均衡策略" }
          - { value: "broad", label: "宽泛策略" }
          - { value: "narrow", label: "保守策略" }
        default: "balanced"
        store: "input/task_params.json"
    optional:
      - key: structure_detail
        label: "结构/工艺细节"
        type: string
        placeholder: "部件组成、连接关系、工艺参数"
        store: "input/task_params.json"
      - key: applicant_name
        label: "申请人名称"
        type: string
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/patent-examination-guidelines

  checklists:
    - ref: "checklist/draft-completeness"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游交底书继承的文件"
    - dir: input/checklists
      description: "草案完整性清单"
    - dir: output
      description: "Agent 产出"
    - dir: output/claims
      description: "权利要求层次结构"
    - dir: output/description
      description: "技术方案阐述各部分"
    - dir: drafts
      description: "完整草案文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入机械/制造专利草案撰写工作区，请按照 PDCA 工作流执行。

    ## 领域重点：机械/制造专利草案
    机械制造类专利草案需特别关注以下方面：
    1. **结构特征精确限定**：每个部件的名称、形状（如"圆柱形""U形槽""齿轮齿条"）、数量、位置、连接方式
    2. **方法步骤有序描述**：工序步骤用"S1、S2、S3…"编号，每步包含具体操作和工艺参数
    3. **配合关系描述**：部件间的配合方式（"螺纹连接""键连接""间隙配合""焊接""铰接"）
    4. **参数范围限定**：角度、尺寸、温度、压力等关键参数用范围表达
    5. **权利要求布局**：产品（结构）→方法（加工/装配/使用）→设备→系统

    ## 核心原则：管辖中立
    本草案产出的所有内容不限定任何国家的专利法格式。

    ## 输入数据
    1. `input/task_params.json` — 发明名称、技术领域、撰写策略、结构细节
    2. `input/inherited/` — 技术交底书（从上游继承）

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取输入，列出结构/工艺特征清单，规划权利要求层次
    ### Do: 撰写权利要求（产品→方法→设备）+ 技术方案阐述
    ### Check: 核对清单
    ### Act: 生成完整草案

  deliverables:
    - file: "drafts/patent_draft_full.md"
      name: "机械/制造专利草案全文"
      format: markdown
    - file: "output/claims/claims_hierarchy.md"
      name: "权利要求层次结构"

  phases:
    - name: plan
      label: "分析规划"
      progress: 15
    - name: do_claims
      label: "撰写权利要求"
      progress: 25
    - name: do_description
      label: "撰写技术方案"
      progress: 30
    - name: check
      label: "质量审查"
      progress: 20
    - name: act
      label: "生成草案文件"
      progress: 10
