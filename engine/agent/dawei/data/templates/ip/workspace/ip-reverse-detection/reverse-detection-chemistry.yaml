template:
  slug: reverse-detection-chemistry
  name: "化学/材料反向侵权探测"
  version: "1.0"
  module: ip-reverse-detection
  team_slug: ip-reverse-detection

  description: |
    针对化学/材料类专利的反向侵权探测。
    检测市场上化学产品、材料、配方、涂料、催化剂、电池材料、高分子材料、农药/化肥、化妆品/日化、
    食品/饲料添加剂、半导体材料等是否侵犯我方专利权。
    针对化学/材料专利的特殊属性，结合成分分析（HPLC/GC-MS/ICP-MS/NMR/FTIR）、晶型/XRD 分析、
    粒度/形貌分析、配方逆向工程、性能参数对比、SDS/TDS 文件对比等多路径取证，
    逐项对比权利要求与疑似侵权化学产品/材料特征，生成侵权分析报告、权利要求对比表、证据链和警告函草稿。
    特别处理数值范围侵权判定、Markush 结构覆盖分析、产品by方法权利要求、选择发明、
    制造工艺举证困难等化学/材料专利特有问题。

  data_requirements:
    required:
      - key: patent_numbers
        label: "我方专利号"
        type: string
        placeholder: "如：CN1234567A, US9876543B2（逗号分隔，支持多件）"
        store: "input/task_params.json"
      - key: suspected_product
        label: "疑似侵权产品"
        type: string
        placeholder: "描述疑似侵权的化学产品、材料、配方、涂料、催化剂、电池材料等"
        store: "input/task_params.json"
    optional:
      - key: product_category
        label: "产品类别"
        type: select
        default: ""
        options:
          - { value: "", label: "不限/不确定" }
          - { value: "涂料/涂层", label: "涂料/涂层" }
          - { value: "催化剂", label: "催化剂" }
          - { value: "高分子材料", label: "高分子材料" }
          - { value: "电池/储能材料", label: "电池/储能材料" }
          - { value: "农药/化肥", label: "农药/化肥" }
          - { value: "化妆品/日化", label: "化妆品/日化" }
          - { value: "食品/饲料添加剂", label: "食品/饲料添加剂" }
          - { value: "半导体材料", label: "半导体材料" }
          - { value: "其他", label: "其他" }
        store: "input/task_params.json"
      - key: detection_method
        label: "首选探测方法"
        type: select
        default: ""
        options:
          - { value: "", label: "全部方法综合" }
          - { value: "成分分析/色谱质谱", label: "成分分析/色谱质谱" }
          - { value: "晶型/XRD分析", label: "晶型/XRD分析" }
          - { value: "粒度/形貌分析", label: "粒度/形貌分析" }
          - { value: "配方逆向", label: "配方逆向" }
          - { value: "性能参数对比", label: "性能参数对比" }
          - { value: "混合方法", label: "混合方法" }
        store: "input/task_params.json"
      - key: jurisdiction
        label: "侵权判定管辖地"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国（全面覆盖+等同原则）" }
          - { value: "US", label: "美国（Literal+Doctrine of Equivalents）" }
          - { value: "EP", label: "欧洲（Article 69 + Protocol）" }
          - { value: "JP", label: "日本（均等论）" }
        store: "input/task_params.json"
      - key: evidence_available
        label: "已有证据"
        type: select
        default: ""
        options:
          - { value: "", label: "暂无" }
          - { value: "product", label: "已购买对方产品" }
          - { value: "marketing", label: "对方宣传资料/网站" }
          - { value: "patents", label: "对方专利/论文" }
          - { value: "mixed", label: "多种来源" }
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/infringement-analysis"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案/专利文件继承的文件"
    - dir: input/checklists
      description: "侵权分析检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "探测报告"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入化学/材料反向侵权探测工作区，请按照 PDCA 工作流执行。
    本工作区专门针对涂料/涂层、催化剂、高分子材料、电池/储能材料、农药/化肥、化妆品/日化、
    食品/饲料添加剂、半导体材料等化学/材料类产品的专利反向侵权探测，
    需特别处理数值范围侵权判定（"约 5-15%" vs "10%"）、Markush 结构覆盖分析、
    产品by方法权利要求（Product-by-Process）的特殊比对、选择发明与子组合分析、
    制造工艺难以从最终产品反推等化学/材料专利特有问题。

    ## 化学/材料专利侵权判定核心原则

    ### 1. 全面覆盖原则（Literal Infringement / 字面侵权）
    - 被控侵权产品**包含**权利要求中记载的**所有**技术特征
    - 缺少任何一个技术特征 → 不构成字面侵权
    - 多于权利要求的技术特征 → 仍可能构成字面侵权
    - 对化学/材料专利而言：化学组成、配方比例、化合物结构、晶型、粒径、性能参数、制备步骤均需逐一比对
    - **数值范围特征**：被控产品的数值落入权利要求限定的范围 → 字面侵权；落在范围之外 → 需评估等同

    ### 2. 等同原则（Doctrine of Equivalents / 等同侵权）
    - 被控产品的技术特征与权利要求特征**实质相同**
    - 判断维度：方式（Way）-功能（Function）-效果（Result）
    - 化学/材料等同常见情形：
      - **组分替换**：不同化合物实现相同功能（如：不同溶剂、不同交联剂、不同填料）
      - **数值范围边缘**：被控值略超范围但实质相同（如：5-15% vs 15.5%）
      - **晶型/多晶型变体**：不同晶型是否构成等同（关注已知晶型可互换性）
      - **盐型/酯/溶剂合物替换**：是否构成等同（关注功能与稳定性）
      - **等效工艺参数**：温度、压力、时间、pH 等工艺参数的等同替换
    - 美国限缩：检举禁止（Prosecution History Estoppel）、贡献原则
    - **数值范围限缩**：申请过程中将范围从宽缩窄到窄可能触发检举禁止，影响等同主张

    ### 3. 各管辖地判定方法
    | 管辖地 | 主要原则 | 化学/材料专利特别注意 |
    |--------|---------|----------------|
    | 中国 | 全面覆盖+等同 | 《专利法》第 66 条方法专利举证责任倒置（新产品要件）；数值范围侵权采用"端点+等同"判定 |
    | 美国 | Literal + DOE | 35 U.S.C. §295 方法专利推定；Warner-Jenkinson 数值范围等同；Festo 检举禁止对范围限定的影响 |
    | 欧洲 | Article 69 + Protocol | 保护范围由权利要求内容确定；EPO 上诉委员会对 Markush 范围的清楚性严格要求 |
    | 日本 | 均等论+目的论 | 特许法第 102 条举证责任减轻；制造方法专利的举证困难应对 |

    ## 化学/材料专利权利要求类型与拆解

    ### Step 1: 识别化学/材料专利权利要求类型
    化学/材料专利通常包含以下权利要求类型，需分别拆解和比对：

    #### A. 组成/配方权利要求（Composition / Formulation Claims）
    - **化学组成**：包含特定组分及含量（重量百分比、摩尔比、体积比、原子比等）
      - 拆解：组分清单 + 各组分的含量范围（如"5-15 wt%"）+ 优选子范围（从属权利要求）
      - 注意：开放式（"包含/comprising"）vs 封闭式（"由...组成/consisting of"）表达对保护范围的影响
      - 注意："基本上由...组成（consisting essentially of）"的中间范围表达
    - **配方/制剂**：活性成分 + 载体/辅料/添加剂 + 配比 + 功能性组分
      - 拆解：核心组分 + 可选组分 + 各组分比例 + 功能性限定
    - 比对要点：被控产品的成分组成、各组分含量是否落入权利要求范围
    - **关键问题**：开放表达下"未列出组分"的存在不必然排除侵权；封闭表达下"额外组分"的存在可能排除字面侵权

    #### B. 化合物权利要求（Compound Claims / Markush 结构）
    - **通式（Markush）权利要求**：覆盖一类化合物（核心结构 + 可选取代基 R1-Rn）
      - 拆解：核心骨架 + 取代基定义范围 + 优选子集（从属权利要求）
      - 注意：Markush 范围的"清楚性"要求；说明书支持范围（不能过宽）
      - 注意：优先权链中 Markush 范围的对应性问题
    - **具体化合物权利要求**：单一定义一个化合物
      - 拆解：化学名、CAS 号、SMILES/InChI、立体化学、多晶型、盐型
    - **Markush 覆盖分析**：
      - 被控化合物结构是否落入 Markush 通式定义的范围
      - 取代基定义的层次：第一层级（如"卤素"）、第二层级（如"Cl、Br"）、第三层级（具体优选）
      - 等同替换：被控化合物虽不在字面范围内，但取代基等同（如 Cl 替换 Br 实现相同功能）
    - 比对要点：被控化合物的化学结构与权利要求定义的范围是否落入

    #### C. 制备方法权利要求（Method of Preparation / Synthesis）
    - 拆解：合成路线 + 关键中间体 + 反应条件（温度、压力、催化剂、溶剂、时间、pH）+ 纯化步骤
    - **特殊规则：举证责任倒置**（中国《专利法》第 66 条；美国 35 U.S.C. §295）
      - 当涉及新产品制造方法时，举证责任转移至被告，需证明其制造方法不同于专利方法
      - 适用条件：所涉产品为"新产品"（在专利申请日前国内未公开/未销售）
      - 原告仍需尽到初步证明义务（合理努力后仍无法证明）
    - **执行难点**：化学/材料制造工艺通常难以从最终产品直接反推
      - 多种合成路线可能得到相同产品
      - 工艺参数（温度、压力、催化剂）无法从产品外观检测
      - 应对策略：依赖对方公开的技术资料、专利、论文、专家证人、举证责任倒置

    #### D. 用途/应用权利要求（Use / Application Claims）
    - 拆解：化合物/组合物的特定用途（如"催化剂 X 用于反应 Y"、"涂层用于基材 Z"）
    - **目的限定型产品权利要求**：
      - "化合物 X 作为催化剂的用途"
      - "组合物 Y 在制备涂料中的应用"
    - 比对要点：被控产品的**实际应用场景**是否落入权利要求限定的用途范围
    - 注意：用途权利要求保护强度较弱，被告可能通过"不同用途"抗辩

    #### E. 产品by方法权利要求（Product-by-Process Claims）
    - 表达形式："通过方法 M 制备的产品 P" 或 "由方法 M 制得的产品 P"
    - 拆解：方法步骤限定 + 产品特征
    - **核心法律问题**：保护范围是**产品本身**（不是方法）
      - 美国：Warner-Lambert v. Teva — 方法限定仅用于定义产品，需证明产品本身落入
      - 中国：《专利审查指南》— 方法特征需对产品本身具有限定作用
      - 欧洲：方法特征必须使产品具有可区分的特征
    - 比对要点：被控产品（不论用什么方法制得）是否具有权利要求限定的产品特征
    - **常见陷阱**：原告主张"产品by方法"，但被控产品用不同方法制得且产品特征相同 → 仍可能侵权
    - **常见抗辩**：被控产品用不同方法制得，且产品特征（如晶型、纯度、杂质谱）不同 → 不侵权

    ### Step 2: 标注技术特征类型
    对每个拆解出的特征，标注：
    - **组成特征**：化学成分、配方、组分清单
    - **结构特征**：化学结构（Markush、SMILES、立体构象）、晶体结构、分子量分布
    - **比例特征**：重量百分比、摩尔比、体积比、原子比（含量范围）
    - **方法步骤特征**：合成步骤、反应条件、工艺参数
    - **功能特征**：催化活性、电导率、机械强度、热稳定性
    - **参数特征**：粒径、比表面积（BET）、孔隙率、熔点、玻璃化转变温度、XRD 衍射峰
    - **用途/应用特征**：使用场景、应用领域

    ## 化学/材料特定探测方法

    ### 方法 1: 成分分析（色谱质谱）
    通过化学分析手段识别被控产品的化学组成和各组分含量：

    | 分析技术 | 适用对象 | 关键信息 |
    |---------|---------|---------|
    | **高效液相色谱（HPLC）** | 有机化合物、混合物 | 组分定量、纯度、有关物质、含量百分比 |
    | **气相色谱-质谱（GC-MS）** | 挥发性有机物、溶剂、添加剂 | 组分识别、定量、挥发性成分 |
    | **电感耦合等离子体质谱（ICP-MS）** | 金属元素、无机物 | 金属/元素含量、痕量杂质、催化剂金属 |
    | **核磁共振（NMR）** | 有机化合物结构 | 结构确证（1H、13C、2D NMR）、官能团、定量 NMR |
    | **傅里叶变换红外光谱（FTIR）** | 官能团、聚合物、涂层 | 官能团识别、聚合物类型、快速指纹 |
    | **拉曼光谱** | 晶型、碳材料、无机物 | 晶型鉴别、碳纳米管石墨化度、应力分析 |
    | **元素分析（CHN/O/S）** | 有机物、聚合物 | C/H/N/O/S 元素含量 |
    | **X 射线光电子能谱（XPS）** | 表面元素、价态 | 表面元素组成、化学价态、深度分布 |
    | **热重分析（TGA）** | 热稳定性、组成 | 热分解行为、填料含量、挥发物 |
    | **凝胶渗透色谱（GPC）** | 高分子材料 | 分子量分布（Mn、Mw、PDI） |

    - 关注点：
      - 各组分的**定量结果**是否落入权利要求限定的含量范围（数值范围侵权判定核心）
      - **配方逆向**：从分析结果反推完整配方（活性成分 + 载体 + 添加剂 + 比例）
      - **杂质谱分析**：可推断制造工艺的线索（特定杂质提示特定合成路线）
      - **表面 vs 体相**：涂层/薄膜类产品需结合 XPS（表面）和体相分析

    ### 方法 2: 晶型/XRD 分析
    针对晶型专利、多晶型专利的核心分析方法：

    #### X 射线粉末衍射（XRD）
    - **粉末 XRD（PXRD）**：晶型鉴别的"金标准"
      - 特征衍射峰位置（2θ 角）+ 相对强度 → 晶型指纹
      - 与专利权利要求中限定的特征峰比对（如"在 2θ = 10.5°±0.2° 处有特征峰"）
    - **单晶 XRD**：单晶结构解析（实验室级别，通常不用于商业产品分析）
    - **同步辐射 XRD**：高分辨率、微量样品分析（特殊场景）

    #### 差示扫描量热（DSC）
    - 熔点、玻璃化转变温度（Tg）、晶型转变温度
    - 与专利权利要求限定的热参数比对
    - 多晶型鉴别：不同晶型熔点不同

    #### 偏光显微镜（PLM）
    - 晶型形貌观察、双折射特性
    - 与 SEM/TEM 配合分析粒子形貌

    - 关注点：
      - 被控产品的 XRD 图谱是否包含权利要求限定的**所有特征峰**
      - 特征峰位置偏差在容许范围内（±0.1° 至 ±0.2° 2θ）→ 字面侵权
      - 特征峰位置偏差较大但图谱整体相似 → 等同侵权评估
      - **晶型纯度**：是否存在混合晶型（被控产品可能包含专利晶型 + 其他晶型）

    ### 方法 3: 粒度/形貌分析
    针对粉体材料、纳米材料、催化剂、电池材料等：

    | 分析技术 | 关键信息 |
    |---------|---------|
    | **扫描电子显微镜（SEM）** | 粒子形貌、表面形貌、粒径分布、涂层截面 |
    | **透射电子显微镜（TEM）** | 内部结构、晶格条纹、纳米级形貌、HRTEM 结构 |
    | **激光粒度分析** | 粒径分布（D10、D50、D90）、平均粒径 |
    | **BET 比表面积分析** | 比表面积、孔径分布、孔隙率 |
    | **原子力显微镜（AFM）** | 表面粗糙度、薄膜厚度、纳米结构 |
    | **动态光散射（DLS）** | 纳米颗粒、胶体、乳液的粒径分布（流体相） |

    - 关注点：
      - 被控材料的粒径范围、比表面积、孔隙率是否落入权利要求限定的参数范围
      - 形貌特征（球状、片状、棒状、核壳结构）是否对应权利要求限定
      - 涂层/薄膜类：涂层厚度、层数、界面结构（截面 SEM）

    ### 方法 4: 配方逆向工程
    综合多种分析手段，还原被控产品的完整配方：

    - **步骤 1**：分离/萃取（如需要）
      - 溶剂萃取、离心、过滤、蒸馏分离各组分
    - **步骤 2**：组分识别
      - HPLC/GC-MS/NMR/FTIR 识别各组分化学结构
    - **步骤 3**：定量分析
      - HPLC/GC/ICP-MS/NMR 定量各组分的含量/比例
    - **步骤 4**：配方重构
      - 与专利权利要求限定的配方逐项对比
    - 适用产品：
      - 涂料/涂层：基料 + 颜料 + 溶剂 + 助剂
      - 催化剂：活性组分 + 载体 + 助催化剂 + 比例
      - 电池材料：正极/负极活性物质 + 导电剂 + 粘结剂 + 电解液
      - 化妆品/日化：活性成分 + 基质 + 防腐剂 + 香精
      - 农药/化肥：有效成分 + 助剂 + 载体
    - 关注点：
      - **组分识别完整性**：是否识别出权利要求限定的所有必需组分
      - **比例准确性**：定量结果的误差范围 vs 权利要求限定的比例范围
      - **未识别组分**：可能影响开放/封闭表达下的侵权判定

    ### 方法 5: 性能参数对比
    针对功能性化学/材料专利（如高性能合金、特种涂料、催化剂活性、电池循环寿命）：

    - **测试方法标准化**：按专利权利要求引用的标准（如 GB、ASTM、ISO）测试
    - **性能参数类型**：
      - 机械性能：拉伸强度、硬度、耐磨性
      - 热性能：导热系数、热稳定性、阻燃等级
      - 电化学性能：电导率、容量、循环寿命、首次库伦效率（电池材料）
      - 催化性能：转化率、选择性、TON/TOF、寿命
      - 光学性能：透光率、反射率、折射率
      - 化学性能：耐腐蚀性、稳定性、反应活性
    - 关注点：
      - 被控产品的性能参数是否落入权利要求限定的范围
      - **功能性限定**：权利要求以功能/效果限定时，需评估被控产品是否实现相同功能
      - **参数与组成的对应**：参数特征可能间接证明组成侵权（如特定 XRD 峰 ↔ 特定晶型）

    ### 方法 6: 混合方法（多路径交叉验证）
    - 综合使用上述多种方法，形成证据链
    - 优先级建议：
      - 组成/配方专利：成分分析（HPLC/GC-MS/ICP-MS/NMR）+ 配方逆向 + 性能参数
      - 化合物/晶型专利：NMR/FTIR 结构确证 + XRD 晶型分析 + DSC 热分析
      - 方法专利：举证责任倒置 + 公开技术资料 + 专家证人分析 + 杂质谱线索
      - 产品by方法专利：产品特征分析（晶型、纯度、杂质谱、形貌）+ 推断制造方法
      - 性能/参数专利：性能参数测试 + 参数与组成/结构的对应关系

    ## 化学/材料专利特殊侵权判定问题

    ### 1. 数值范围侵权判定
    化学/材料专利大量使用数值范围限定（如"5-15 wt%"、"粒径 10-100 nm"、"温度 80-120°C"）

    - **被控值落入范围**：构成字面侵权（如 10% 落入 5-15%）
    - **被控值略超范围**：需评估等同侵权（如 15.5% vs 5-15%）
      - 等同判定：方式-功能-效果三维度
      - 中国司法实践：数值范围端点的等同通常较严格（避免过度扩张）
      - 美国 Warner-Jenkinson 案：等同原则可适用于数值范围，但需谨慎
    - **端点限缩**：申请过程中将范围从宽（如 1-50%）缩窄到窄（如 5-15%）可能触发 Festo 检举禁止
    - **"约（about）"限定**：权利要求使用"约 5-15%"时，"约"的范围通常由说明书定义或本领域常规误差
    - **优选范围 vs 宽范围**：从属权利要求限定的优选范围（如 8-12%）vs 独立权利要求的宽范围（5-15%）
    - **策略**：
      - 优先比对独立权利要求的宽范围
      - 被控值落入从属权利要求的优选范围 → 强证据
      - 被控值略超范围 → 评估等同侵权可能性，关注检举禁止风险

    ### 2. Markush 结构覆盖分析
    - **被控化合物落入字面范围**：核心骨架 + 取代基均在 Markush 定义内 → 字面侵权
    - **被控化合物落入等同范围**：取代基等同替换（如 Cl 替换 Br、甲基替换乙基）
      - 等同判定：化学性质相似性、功能相同性、合成容易性
    - **Markush 范围外的化合物**：不在权利要求保护范围内
    - **选择发明**：
      - 权利要求限定的特定子集（如从大族 Markush 中选出的特定化合物）
      - 被控化合物落入选择发明的子集 → 侵权
      - 选择发明的"意想不到的技术效果"是支持其专利性的关键，但不影响侵权判定
    - **子组合分析**：
      - 权利要求限定的组分子集是否被被控产品全面覆盖
      - 被控产品是否包含"额外组分"（开放/封闭表达的影响）

    ### 3. 产品by方法权利要求（Product-by-Process）
    - **核心法律原则**：保护的是**产品**，不是方法
    - 比对方法：
      - 不论被控产品用什么方法制得，关注其**产品特征**是否与权利要求限定的产品特征相同
      - 产品特征：晶型、纯度、杂质谱、分子量分布、密度、形貌等可观测特征
    - **被告抗辩**：
      - 用不同方法制得，且产品特征不同 → 不侵权
      - 用不同方法制得，但产品特征相同 → 仍可能侵权（产品by方法的陷阱）
    - **关键证据**：
      - 被控产品的产品特征分析（XRD、NMR、SEM、GPC、纯度、杂质谱）
      - 对比专利权利要求限定的产品特征
    - **策略**：同时分析"方法是否相同"和"产品特征是否相同"，评估侵权与举证难度

    ### 4. 选择发明与子组合分析
    - **选择发明**：
      - 从已知大范围中选择特定子集/特定化合物，具有意想不到的技术效果
      - 侵权判定：被控产品是否落入选择发明的特定子集
      - 注意：选择发明保护范围较窄，但侵权证据较强
    - **子组合分析**：
      - 权利要求限定的多个组分中，被控产品是否包含所有必需组分
      - 被控产品的额外组分不必然排除侵权（开放表达下）
      - 被控产品缺少任一必需组分 → 不构成字面侵权（需评估等同）

    ### 5. 制造工艺举证困难
    化学/材料方法专利的执行难点：

    - **问题**：制造工艺（反应条件、催化剂、溶剂、温度）难以从最终产品直接观测
    - **应对策略**：
      - **举证责任倒置**（中国《专利法》第 66 条；美国 35 U.S.C. §295）：
        - 适用条件：所涉产品为"新产品"（申请日前国内未公开/未销售）
        - 原告需先证明"合理努力后仍无法证明被告方法"
        - 被告需证明其使用的方法不同于专利方法
      - **公开技术资料**：
        - 对方专利、论文、技术白皮书、会议报告中披露的工艺信息
        - SDS/MSDS 中可能披露的成分线索（但通常不包含工艺细节）
      - **杂质谱/晶型线索**：
        - 特定杂质提示特定合成路线（如特定手性杂质提示手性催化剂使用）
        - 特定晶型提示特定结晶条件
      - **专家证人**：
        - 化学/材料领域专家出具的"被控产品可能使用专利方法"的辅助意见
        - 基于公开信息 + 产品特征的推论
      - **证据保全**：
        - 法院调查令、证据保全申请
        - 第三方检测机构出具的工艺推断报告

    ## 逐项特征对比矩阵
    对每个技术特征构建对比矩阵：

    | 权利要求特征 | 特征类型 | 被控产品对应特征 | 探测方法 | 字面侵权？ | 等同侵权？ | 证据强度 | 备注 |
    |-------------|---------|----------------|---------|-----------|-----------|---------|------|

    评分标准：
    - **确认匹配**：检测报告/技术资料直接显示该特征存在且落入范围
    - **高度可能**：分析结果可合理推断该特征存在
    - **可能匹配**：部分信息支持，需进一步实验分析/取证
    - **信息不足**：制造工艺无法直接观测，需依赖举证责任倒置或法院调查
    - **不匹配**：检测结果显示该特征不存在或落在范围外

    ## 侵权概率评级
    | 等级 | 标准 | 建议行动 |
    |------|------|---------|
    | 高（>70%） | 所有特征确认匹配或高度可能 | 准备警告函/公证购买/第三方检测报告/取证 |
    | 中（40-70%） | 部分特征可能匹配，存在等同可能 | 补充实验分析（如 XRD/HPLC/SEM）/调查公开资料 |
    | 低（<40%） | 关键特征不匹配或信息不足 | 持续监控/放弃/评估无效风险 |

    ## 证据链构建

    ### 直接证据
    - **检测报告**：HPLC/GC-MS/ICP-MS/NMR/FTIR/XRD/SEM/TEM/DSC 分析报告（第三方 CNAS/CMA 资质机构）
    - **购买样品**：通过合法渠道购买的被控产品样品（保留购买凭证、chain of custody）
    - **SDS/MSDS**：被控方的安全数据表（披露成分线索）
    - **TDS（Technical Data Sheets）**：被控方的技术数据表（披露性能参数、组成信息）

    ### 间接证据
    - **技术白皮书/产品手册**：宣传资料中披露的组成、性能、工艺信息
    - **学术论文/会议报告**：制造工艺、组成、性能的披露
    - **对方专利**：合成路线、配方、工艺参数的披露
    - **公司公开资料**：年报、招股说明书、技术演讲
    - **海关进出口数据**：原料/产品的进出口信息（可推断供应链）

    ### 时间线
    - 我方专利申请日 → 公开日 → 授权日
    - 对方产品上市时间 / 公开销售时间 / 展会展示时间
    - **先用权抗辩评估**：对方是否在我方专利申请日前已独立研发并制造
    - **现有技术抗辩评估**：对方使用的技术是否属于现有技术

    ### 证据保全建议
    - **公证购买**：通过公证员见证购买被控产品样品，保留完整购买凭证
    - **chain of custody**：从购买到检测的样品流转链完整可追溯
    - **第三方检测报告**：CNAS/CMA 资质机构出具（HPLC、GC-MS、ICP-MS、NMR、FTIR、XRD、SEM、TEM、DSC、BET）
    - **区块链存证**：网页、SDS/TDS、技术资料的固化
    - **专家辅助意见**：化学/材料领域专家出具的等同性、组成对应性、工艺推断意见

