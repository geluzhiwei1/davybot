template:
  slug: reverse-detection-mechanical
  name: "机械/制造反向侵权探测"
  version: "1.0"
  module: ip-reverse-detection
  team_slug: ip-reverse-detection

  description: |
    针对机械/制造领域专利的反向侵权探测。
    聚焦机械结构特征、制造工艺特征、材料特征的逐项对比，
    通过实物拆解测量、CAD/三维建模对比、规格书/图纸对比、制造工艺分析、
    材料成分分析等方法，评估疑似侵权机械产品的侵权概率，
    生成侵权分析报告、权利要求对比表、证据链和警告函草稿。

  data_requirements:
    required:
      - key: patent_numbers
        label: "我方专利号"
        type: string
        placeholder: "如：CN1234567A, US9876543B2（逗号分隔，支持多件）"
        store: "input/task_params.json"
      - key: claim_focus
        label: "重点分析的权利要求"
        type: string
        placeholder: "如：权1-3（结构），权10-15（方法）。留空表示分析全部独立权利要求"
        store: "input/task_params.json"
      - key: suspected_product
        label: "疑似侵权机械产品"
        type: string
        placeholder: "描述疑似侵权的机械产品、设备、制造工艺"
        store: "input/task_params.json"
    optional:
      - key: product_category
        label: "产品类别"
        type: select
        default: ""
        options:
          - { value: "", label: "不限" }
          - { value: "automotive", label: "汽车/车辆" }
          - { value: "industrial_machinery", label: "工业机械" }
          - { value: "consumer_appliance", label: "消费品/家电" }
          - { value: "precision_instruments", label: "精密仪器" }
          - { value: "building_materials", label: "建筑材料" }
          - { value: "packaging", label: "包装/容器" }
          - { value: "other", label: "其他" }
        store: "input/task_params.json"
      - key: detection_method
        label: "探测方法"
        type: select
        default: ""
        options:
          - { value: "", label: "由 Agent 根据特征类型自动选择" }
          - { value: "teardown_measurement", label: "实物拆解测量" }
          - { value: "cad_comparison", label: "CAD/三维建模对比" }
          - { value: "spec_drawing", label: "规格书/图纸对比" }
          - { value: "process_analysis", label: "制造工艺分析" }
          - { value: "mixed", label: "混合方法" }
        store: "input/task_params.json"
      - key: jurisdiction
        label: "侵权判定管辖地"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国（全面覆盖+等同原则）" }
          - { value: "US", label: "美国（Literal+Doctrine of Equivalents）" }
          - { value: "EP", label: "欧洲（Article 69 + Protocol）" }
          - { value: "JP", label: "日本（均等论）" }
        store: "input/task_params.json"
      - key: evidence_available
        label: "已有证据"
        type: select
        default: ""
        options:
          - { value: "", label: "暂无" }
          - { value: "product", label: "已购买对方产品" }
          - { value: "marketing", label: "对方宣传资料/网站" }
          - { value: "patents", label: "对方专利/论文" }
          - { value: "mixed", label: "多种来源" }
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/infringement-analysis"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案/专利文件继承的文件"
    - dir: input/checklists
      description: "侵权分析清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "探测报告"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入机械/制造反向侵权探测工作区，请按照 PDCA 工作流执行。
    本工作区专注于机械结构、制造工艺、材料特征类的专利侵权判定。

    ## 侵权判定核心原则

    ### 1. 全面覆盖原则（Literal Infringement / 字面侵权）
    - 被控侵权机械产品**包含**权利要求中记载的**所有**技术特征
    - 缺少任何一个技术特征 → 不构成字面侵权
    - 多于权利要求的技术特征 → 仍可能构成字面侵权
    - 机械专利中，结构特征和位置关系特征必须逐一验证

    ### 2. 等同原则（Doctrine of Equivalents / 等同侵权）
    - 被控产品的机械特征与权利要求特征**实质相同**
    - 判断维度：方式（Way）-功能（Function）-效果（Result）
    - 中国司法解释：以基本相同的手段，实现相同的功能，达到相同的效果
    - 机械领域等同常见情形：
      - 螺栓连接 ≈ 铆接 ≈ 卡扣连接（相同功能：紧固）
      - 齿轮传动 ≈ 链传动 ≈ 带传动（相同功能：动力传递）
      - 等同需谨慎：若替换需要重新设计整体结构，可能不构成等同

    ### 3. 各管辖地判定方法
    | 管辖地 | 主要原则 | 特别注意 |
    |--------|---------|---------|
    | 中国 | 全面覆盖+等同 | 专利权人可选主张保护范围；司法解释明确等同判定标准 |
    | 美国 | Literal + DOE | File Wrapper Estoppel；Means-plus-function（112(f)）特殊解释；数字范围严格 |
    | 欧洲 | Article 69 + Protocol | 保护范围由权利要求内容确定，说明书和附图解释；均衡原则 |
    | 日本 | 均等论+目的论 | 第5要件（替换容易性）；专利权人在申请中可预测的范围 |

    ## 机械专利权利要求解析

    ### Step 1: 权利要求类型识别与拆解
    1. 识别独立权利要求和从属权利要求
    2. 区分权利要求类型：
       - **产品权利要求**（装置、设备、机构、部件）
       - **方法权利要求**（制造方法、加工工艺、装配方法）
       - **用途权利要求**（特定应用场景）
    3. 将每项独立权利要求拆解为技术特征列表

    ### Step 2: 机械特征分类标注
    对每个技术特征标注类型：

    #### 2.1 结构特征（Structural Features）
    - **部件特征**：构成产品的零件、组件（如：壳体、轴、齿轮、弹簧、轴承）
    - **连接关系特征**：部件间的连接方式（如：焊接、螺栓连接、铰接、卡扣、过盈配合）
    - **尺寸特征**：长度、直径、角度、厚度、间距等数值及范围
    - **位置关系特征**：部件间的空间相对位置（如：上方、内部、同轴、平行、垂直）
    - **形状特征**：几何形状（如：圆柱形、L形、齿状、锥形）

    #### 2.2 工艺特征（Process Features）
    - **步骤特征**：加工/制造的工序步骤及顺序
    - **参数特征**：温度、压力、速度、时间、进给量等工艺参数
    - **条件特征**：气氛、湿度、冷却方式等环境条件
    - **工装特征**：使用的模具、夹具、刀具

    #### 2.3 材料特征（Material Features）
    - **成分特征**：化学组成、合金配比、复合材料组分
    - **性能特征**：硬度、强度、密度、导电性、耐腐蚀性
    - **微观结构特征**：晶粒度、金相组织、热处理状态

    #### 2.4 功能特征（Functional Features）
    - **功能性限定**："配置为"、"适用于"、"用于"（Means-plus-function）
    - 美国法下 35 U.S.C. § 112(f) 解释规则
    - 中国法下：以说明书描述的具体实施方式及其等同的实施方式确定保护范围

    ## 机械侵权探测方法

    ### 方法 1: 实物拆解测量（Physical Product Teardown & Measurement）
    - **适用场景**：已购买或可获得对方实物产品
    - **工具与手段**：
      - 游标卡尺、千分尺、高度尺（基础尺寸测量）
      - 3D 扫描仪（复杂曲面、整体结构数字化）
      - 三坐标测量机 CMM（Coordinate Measuring Machine，高精度尺寸与位置度）
      - 工业 CT（内部结构无损检测）
    - **测量重点**：
      - 关键尺寸（与权利要求数值范围对应）
      - 部件间相对位置（与位置关系特征对应）
      - 连接方式识别（焊接痕、螺栓孔、卡扣结构）
      - 装配关系（拆卸顺序、配合方式）
    - **输出**：拆解照片、测量数据表、3D 扫描点云/网格文件

    ### 方法 2: CAD/三维建模对比（CAD Model Comparison / Reverse Engineering）
    - **适用场景**：对方公开 CAD 模型，或通过 3D 扫描重构模型
    - **流程**：
      1. 获取对方 CAD 模型（公开渠道、3D 扫描重建）
      2. 与我方专利附图、实施例建模对比
      3. 提取关键几何参数进行对比分析
    - **工具**：SolidWorks、CATIA、UG/NX、AutoCAD、FreeCAD、MeshLab（点云处理）
    - **输出**：对比分析图、差异报告、关键参数对照表

    ### 方法 3: 规格书与工程图纸对比（Spec Sheet & Engineering Drawing Comparison）
    - **适用场景**：对方产品手册、规格书、安装图、专利文件等公开资料
    - **资料来源**：
      - 产品说明书、用户手册
      - 销售规格书、技术规格表
      - 对方专利文件（说明书及附图）
      - 行业展会资料、技术白皮书
      - 宣传视频、产品图片
    - **分析重点**：
      - 规格/尺寸是否落入权利要求范围
      - 公开结构图是否显示对应技术特征
      - 宣传卖点是否对应专利功能/效果

    ### 方法 4: 制造工艺分析（Manufacturing Process Analysis）
    - **适用场景**：方法专利侵权、工艺特征比对
    - **可观测的工艺痕迹**：
      - **焊接痕迹**：焊缝形态（点焊、缝焊、激光焊、摩擦焊）
      - **铸造痕迹**：分型线、浇口、冒口残留、铸造表面
      - **机加工痕迹**：刀具进给纹路、表面粗糙度、加工刀痕方向
      - **塑性加工痕迹**：冲压拉伸痕、锻造分模线、轧制方向
      - **热处理痕迹**：氧化色、硬度梯度、表面处理层
      - **装配痕迹**：扭矩标记、装配顺序标识
    - **推断路径**：痕迹 → 推断工艺步骤 → 对比权利要求工艺特征

    ### 方法 5: 材料成分分析（Material Composition Analysis）
    - **适用场景**：材料特征是专利关键要素
    - **分析手段**：
      - **光谱分析**：直读光谱仪（OES）、X 射线荧光光谱（XRF）— 元素定性定量
      - **金相分析**：金相显微镜 — 微观组织、晶粒度、相组成
      - **硬度测试**：洛氏/布氏/维氏硬度计
      - **拉伸/冲击试验**：力学性能测试
      - **扫描电镜 SEM/EDS**：微观形貌与微区成分
      - **X 射线衍射 XRD**：物相分析
    - **输出**：成分分析报告、金相照片、性能测试报告

    ## 机械专利权利要求解释的特殊挑战

    ### 挑战 1: 数值范围与"大约"（"About" / "Approximately"）
    - 权利要求中的"约"、"大约"、"approximately"扩展了数值范围
    - 中国：通常允许 ±5%~±10%，具体视技术领域和说明书
    - 美国：视说明书是否支持；无"about"的严格数值通常作严格解释
    - 欧洲：依据 EPO 实践，"about" 给予技术人员可预期的少量偏差余地
    - **对策**：精确测量对方产品对应参数；评估是否落入扩展后的范围；考虑测量误差

    ### 挑战 2: 功能性语言（"Configured to" / "Adapted for"）
    - "配置为"、"设置为"、"适用于"在机械权利要求中普遍存在
    - 解释为：能够实现该功能的具体结构（非泛泛的功能性限定）
    - **对策**：
      - 识别实现该功能的具体结构特征
      - 验证对方产品对应结构能否实现该功能
      - 在说明书披露的实施方式及其等同范围内判断

    ### 挑战 3: Means-Plus-Function（装置加功能）
    - 美国 35 U.S.C. § 112(f)：means for... 形式的特征
    - 解释为：说明书中披露的对应结构及其等同
    - 中国：以说明书描述的具体实施方式及其等同的实施方式确定保护范围
    - **对策**：
      - 在说明书中找到对应的"means"具体结构
      - 对比对方产品对应结构是否为该结构或其等同
      - 注意：纯粹的的功能性限定（无对应结构）可能导致权利要求不清楚

    ### 挑战 4: 装配/子装配分析（Assembly / Subassembly Analysis）
    - 机械产品常以模块/子装配形式呈现
    - 权利要求可能涉及多个层级的部件关系
    - **对策**：
      - 拆解时记录完整的装配层级（BOM 树）
      - 区分"销售时已装配"vs"用户自行装配"
      - 注意：销售散件 + 简单组装说明可能构成间接侵权（诱导/帮助）

    ## 证据链构建（机械领域专属）

    ### 直接证据
    - **公证购买记录**：购买时间、地点、销售方、票据（建议公证购买）
    - **实物产品**：封存的被控产品（保留原包装、防拆标签）
    - **拆解报告**：详细的拆解步骤、照片、视频
    - **测量报告**：CMM、3D 扫描、卡尺测量数据及第三方检测报告
    - **3D 扫描文件**：点云、STL、STEP 文件
    - **材料分析报告**：光谱、金相、力学性能检测报告
    - **专家证人报告**：机械领域专家出具的技术鉴定意见

    ### 间接证据
    - 对方产品宣传资料、网站信息
    - 对方专利文件（说明书中可能自认工艺/结构）
    - 对方技术论文、行业演讲
    - 行业展会信息、用户评测
    - 对方的供应链信息（材料来源、外协加工）

    ### 时间线
    - 对方产品上市/销售时间 vs 我方专利申请/公开时间
    - 对方模具开发、工艺定型的时间节点
    - 对方相关专利的申请时间（用于推断其研发时间线）

    ### 保全建议
    - **公证购买**：在公证员见证下购买，封存原件
    - **时间戳固化**：对网站信息、视频等电子证据进行时间戳固化
    - **第三方检测**：委托具有资质的检测机构出具报告
    - **现场公证**：展会现场、对方工厂（如可进入）的公证取证
    - **海关记录**：进出口记录、海关备案

    ## 特别注意事项

    ### 外观设计专利 vs 实用新型/发明专利
    - 机械产品可能同时涉及多种专利类型：
      - **发明专利**：新颖的机械结构、制造方法、材料配方
      - **实用新型**：产品的形状、构造或其结合（中国实用新型保护范围有限）
      - **外观设计专利**：产品的外观形状、图案、色彩
    - **判定方法差异**：
      - 外观设计：一般消费者视角、整体观察综合判断
      - 实用新型/发明：技术特征逐一比对（全面覆盖原则）
    - **对策**：明确区分专利类型，适用不同的判定方法

    ### 结构特征证明的优先级
    - 机械专利侵权判定的核心往往是**结构特征**的证明
    - 优先证明易于观测、测量的结构特征：
      1. 外部结构（直接拍照、测量即可）
      2. 内部结构（拆解后观测）
      3. 部件间的连接关系（拆解过程记录）
      4. 关键尺寸（精确测量）
      5. 工艺特征（痕迹分析 + 推断）
      6. 材料特征（实验室分析）
    - 对难以直接观测的特征（如内部配合关系），优先采用无损检测（工业 CT）

    ## 分析方法论

    ### Step 3: 逐项特征对比
    对每个技术特征构建机械对比矩阵：

    | 权利要求特征 | 特征类型 | 被控产品对应特征 | 探测方法 | 字面侵权？ | 等同侵权？ | 证据强度 | 备注 |
    |-------------|---------|----------------|---------|-----------|-----------|---------|------|
    | （结构/工艺/材料/功能） |  |  | 拆解/CAD/规格/工艺/材料 |  |  |  |  |

    评分标准：
    - **确认匹配**：直接测量/观测/检测显示该特征存在
    - **高度可能**：可合理推断该特征存在（如：外观形态强烈支持）
    - **可能匹配**：部分信息支持，需进一步测量/取证
    - **信息不足**：公开信息无法确认，需购买产品/3D 扫描/材料检测
    - **不匹配**：测量/检测显示该特征不存在

    ### Step 4: 侵权概率评级
    | 等级 | 标准 | 建议行动 |
    |------|------|---------|
    | 高（>70%） | 所有结构/工艺/材料特征确认匹配或高度可能 | 公证购买、第三方检测、准备警告函 |
    | 中（40-70%） | 部分特征可能匹配，存在等同可能 | 补充测量/检测、技术专家评估 |
    | 低（<40%） | 关键特征不匹配或信息不足 | 持续监控/放弃 |

    ## 输入数据
    1. `input/task_params.json` — 专利号、权利要求重点、疑似产品、产品类别、探测方法、管辖地
    2. `input/inherited/` — 专利全文/权利要求/附图（如有）
    3. `input/checklists/` — 侵权分析检查清单

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 解析机械权利要求，拆解结构/工艺/材料/功能特征，确认管辖地判定标准与适用探测方法
    ### Do:
    - 根据特征类型选择探测方法（拆解测量/CAD 对比/规格对比/工艺分析/材料分析）
    - 收集被控机械产品公开信息（产品手册、规格书、专利、宣传资料）
    - 如有实物：拆解、测量、3D 扫描、材料检测
    - 构建机械特征对比矩阵（结构/工艺/材料/功能 逐项分析）
    - 评估字面侵权和等同侵权可能性（注意功能性限定与 means-plus-function 解释）
    - 构建证据链（含公证购买、检测报告、专家意见）
    ### Check: 交叉验证测量数据与对比结果，标记证据缺口，评估侵权概率
    ### Act: 生成探测报告 + 权利要求对比表 + 证据包目录 + 警告函草稿

