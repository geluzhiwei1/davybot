template:
  slug: reverse-detection-biotech
  name: "生物/医药反向侵权探测"
  version: "1.0"
  module: ip-reverse-detection
  team_slug: ip-reverse-detection

  description: |
    针对生物/医药类专利的反向侵权探测。
    检测市场上药品、生物制品、疫苗、体外诊断试剂、医疗器械、基因检测产品是否侵犯我方专利权。
    针对医药专利的特殊属性，结合上市药品目录分析、处方/成分分析、生物序列比对、
    临床试验数据对比、说明书/标签对比等多路径取证，
    逐项对比权利要求与疑似侵权药品/生物制品特征，生成侵权分析报告、权利要求对比表、证据链和警告函草稿。
    特别处理 Bolar 例外/实验使用例外、方法专利举证责任倒置、医疗方法权利要求、
    Hatch-Waxman 机制、专利链接制度等医药专利特有问题。

  data_requirements:
    required:
      - key: patent_numbers
        label: "我方专利号"
        type: string
        placeholder: "如：CN1234567A, US9876543B2（逗号分隔，支持多件）"
        store: "input/task_params.json"
      - key: suspected_product
        label: "疑似侵权产品"
        type: string
        placeholder: "描述疑似侵权的药品、生物制品、医疗器械、诊断试剂"
        store: "input/task_params.json"
    optional:
      - key: product_category
        label: "产品类别"
        type: select
        default: ""
        options:
          - { value: "", label: "不限/不确定" }
          - { value: "小分子药物", label: "小分子药物" }
          - { value: "生物药/抗体", label: "生物药/抗体" }
          - { value: "疫苗", label: "疫苗" }
          - { value: "体外诊断试剂", label: "体外诊断试剂" }
          - { value: "医疗器械", label: "医疗器械" }
          - { value: "基因检测", label: "基因检测" }
          - { value: "中药/天然产物", label: "中药/天然产物" }
          - { value: "其他", label: "其他" }
        store: "input/task_params.json"
      - key: detection_method
        label: "首选探测方法"
        type: select
        default: ""
        options:
          - { value: "", label: "全部方法综合" }
          - { value: "上市药品信息分析", label: "上市药品信息分析" }
          - { value: "处方/成分分析", label: "处方/成分分析" }
          - { value: "生物序列比对", label: "生物序列比对" }
          - { value: "临床试验数据对比", label: "临床试验数据对比" }
          - { value: "说明书/标签对比", label: "说明书/标签对比" }
          - { value: "混合方法", label: "混合方法" }
        store: "input/task_params.json"
      - key: jurisdiction
        label: "侵权判定管辖地"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国（全面覆盖+等同原则）" }
          - { value: "US", label: "美国（Literal+Doctrine of Equivalents）" }
          - { value: "EP", label: "欧洲（Article 69 + Protocol）" }
          - { value: "JP", label: "日本（均等论）" }
        store: "input/task_params.json"
      - key: evidence_available
        label: "已有证据"
        type: select
        default: ""
        options:
          - { value: "", label: "暂无" }
          - { value: "product", label: "已购买对方产品" }
          - { value: "marketing", label: "对方宣传资料/网站" }
          - { value: "patents", label: "对方专利/论文" }
          - { value: "mixed", label: "多种来源" }
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/infringement-analysis"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案/专利文件继承的文件"
    - dir: input/checklists
      description: "侵权分析检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "探测报告"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入生物/医药反向侵权探测工作区，请按照 PDCA 工作流执行。
    本工作区专门针对小分子药物、生物药/抗体、疫苗、体外诊断试剂、医疗器械、基因检测、中药/天然产物等产品的专利反向侵权探测，
    需特别处理 Bolar 例外/实验使用例外、方法专利举证责任倒置、医疗方法权利要求执行难、
    Hatch-Waxman 与专利链接制度等医药专利特有问题。

    ## 医药专利侵权判定核心原则

    ### 1. 全面覆盖原则（Literal Infrementation / 字面侵权）
    - 被控侵权产品**包含**权利要求中记载的**所有**技术特征
    - 缺少任何一个技术特征 → 不构成字面侵权
    - 多于权利要求的技术特征 → 仍可能构成字面侵权
    - 对医药专利而言：化合物结构、组成/配方、剂型、给药方案、适应症、检测步骤均需逐一比对

    ### 2. 等同原则（Doctrine of Equivalents / 等同侵权）
    - 被控产品的技术特征与权利要求特征**实质相同**
    - 判断维度：方式（Way）-功能（Function）-效果（Result）
    - 医药等同常见情形：
      - 化合物变体：盐型/晶型/酯/醚/溶剂合物是否构成等同（关注公知常识与已知性质）
      - Markush 结构中取代基的等同替换
      - 配方中辅料替换（实现相同释放曲线、生物等效）
      - 给药剂量/方案变体（剂量范围边缘、给药间隔变化）
    - 美国限缩：检举禁止（Prosecution History Estoppel）、贡献原则

    ### 3. 各管辖地判定方法
    | 管辖地 | 主要原则 | 医药专利特别注意 |
    |--------|---------|----------------|
    | 中国 | 全面覆盖+等同 | 《专利法》第 76 条专利链接；药品专利纠纷早期解决机制；MAH 持有人责任 |
    | 美国 | Literal + DOE | Hatch-Waxman Act（35 U.S.C. §271(e)）；Orange Book 列名；Bolar 例外；ANDA/P-IV 挑战 |
    | 欧洲 | Article 69 + Protocol | SPC（补充保护证书）延长保护期；Bolar 例外（Directive 2004/27/EC）；儿科用药延长 |
    | 日本 | 均等论+目的论 | 特许法第 69 条；Bolar 例外（特許法第 69 条第 1 项但书）；PMDA 注册信息公开 |

    ## 生物/医药专利权利要求类型与拆解

    ### Step 1: 识别医药专利权利要求类型
    生物/医药专利通常包含以下权利要求类型，需分别拆解和比对：

    #### A. 化合物权利要求（Compound Claims / Markush 结构）
    - **通式（Markush）权利要求**：覆盖一类化合物（如：包含核心结构 + 可选取代基 R1-Rn）
      - 拆解：核心骨架 + 取代基定义范围 + 优选子集（从属权利要求）
      - 注意：Markush 范围的"清楚性"要求；优先权链中支持问题
    - **具体化合物权利要求**：单一定义一个化合物（如：化合物 X 的游离碱/特定盐型/特定晶型）
      - 拆解：化学名、CAS 号、SMILES/InChI、立体化学、多晶型、盐型
    - 比对要点：被控 API（活性药物成分）的结构与权利要求定义的范围是否落入

    #### B. 组成/制剂权利要求（Composition / Formulation Claims）
    - **药物组合物**：API + 可药用辅料/载体
      - 拆解：API（含量/单位剂量）+ 辅料类型 + 剂型（片剂、胶囊、注射剂、缓释等）
    - **特定制剂技术**：如缓释、控释、脂质体、纳米制剂、微球
      - 拆解：特定结构/释放特性/工艺参数
    - 比对要点：被控药品的处方组成、剂型、释放特性

    #### C. 制备方法权利要求（Method of Manufacture）
    - 拆解：合成路线 + 关键中间体 + 反应条件 + 纯化步骤
    - **特殊规则：举证责任倒置**（中国《专利法》第 66 条；美国 35 U.S.C. §295）
      - 当涉及新产品制造方法时，举证责任转移至被告，需证明其制造方法不同于专利方法
      - 适用条件：所涉产品为"新产品"（在专利申请日前国内未公开/未销售）
      - 原告仍需尽到初步证明义务（合理努力后仍无法证明）

    #### D. 治疗方法权利要求（Method of Treatment）
    - 拆解：给药对象（适应症/患者群体）+ 给药方案（剂量、频率、途径、疗程）
    - **目的限定型产品权利要求（瑞士型/Swiss-type）**：
      - "化合物 X 在制备用于治疗疾病 Y 的药物中的用途"
      - "化合物 X 用于治疗疾病 Y 的用途"
    - 比对要点：被控药品的**批准适应症**是否落入权利要求限定的用途范围

    #### E. 诊断方法权利要求（Diagnostic Method Claims）
    - 拆解：样本类型 + 检测靶标 + 检测方法 + 判定标准
    - 比对要点：被控诊断试剂/方法的检测靶标、判定阈值、样本处理流程
    - **执行难度**：诊断方法（特别是体外诊断）通常可被有效主张，但医疗实践方法（in vivo）执行难度高

    ### Step 2: 标注技术特征类型
    对每个拆解出的特征，标注：
    - **结构特征**：化学结构（Markush、SMILES、立体构象）、生物序列（核酸/蛋白序列）
    - **组成特征**：处方、辅料、配比、杂质谱
    - **方法步骤特征**：合成步骤、检测步骤、给药方案
    - **功能特征**：释放曲线、生物等效性、结合亲和力（Kd/IC50）
    - **参数特征**：粒径、溶解度、纯度、含量范围、XRD 衍射峰
    - **用途/适应症特征**：批准适应症、给药对象、用药方案

    ## 生物/医药特定探测方法

    ### 方法 1: 上市药品信息分析（监管数据库）
    通过各监管机构的公开药品注册数据库获取被控药品的关键信息：

    | 数据源 | 适用市场 | 关键信息 |
    |--------|---------|---------|
    | **Orange Book (FDA)** | 美国 | 批准药品、参比制剂、ANDA、专利列名、独占期 |
    | **Drugs@FDA** | 美国 | 审评历史、标签、批准函 |
    | **CNIPA 药品专利链接** | 中国 | 上市药品专利信息登记平台、专利声明 |
    | **NMPA 药品注册数据库** | 中国 | 批准文号、上市许可持有人、规格、剂型 |
    | **EMA EPAR** | 欧盟 | 欧洲公众评估报告、产品特征摘要（SmPC） |
    | **PMDA** | 日本 | 审评报告、添付文书（说明书） |
    | **WHO INN** | 全球 | 国际非专利名称（INN）、生物类似药分类 |

    - 关注点：
      - 仿制药（ANDA / 仿制申请）的"第四段声明"（Paragraph IV Certification）：暗示挑战我方专利
      - 专利链接登记平台中的 4 类声明（中国：未登记 / 已登记未侵权 / 已登记将过期 / 无效）
      - 上市时间 vs 我方专利公开/授权时间
      - 参比制剂（RLD）选择、生物等效性声明

    ### 方法 2: 处方/成分分析（药品逆向工程）
    通过实验分析获取被控药品的处方和成分信息：

    #### 小分子药物 API 分析
    - **高效液相色谱（HPLC）**：定量分析 API 含量、纯度、有关物质
    - **质谱（MS）**：分子量、结构确认、杂质识别
    - **核磁共振（NMR）**：结构确证（1H、13C、2D NMR）
    - **X 射线粉末衍射（XRD）**：晶型鉴别（多晶型专利的关键证据）
    - **差示扫描量热（DSC）/ 热重分析（TGA）**：晶型、溶剂合物鉴别
    - **比旋度**：手性药物光学纯度
    - **红外光谱（IR）/ 拉曼光谱**：快速鉴别、晶型指纹

    #### 制剂分析
    - **溶出曲线测试**：与参比制剂比对生物等效性，反推处方设计
    - **XRD**：制剂中 API 晶型鉴别
    - **显微镜（光学/SEM）**：颗粒形貌、包衣结构
    - **元素分析 / ICP-MS**：辅料成分、痕量杂质

    ### 方法 3: 生物序列比对（生物药/抗体）
    针对生物药（抗体、融合蛋白、疫苗、基因治疗）的核心方法：

    - **序列 ID 列表（Sequence Listing）**：
      - 专利权利要求中的 CDR 区、可变区、全长序列
      - WIPO ST.26 标准（2022 年 7 月起生效，取代 ST.25）
    - **BLAST / Smith-Waterman 比对**：
      - 重链/轻链 CDR 比对（CDR-H1, H2, H3, L1, L2, L3）
      - 框架区（FR）序列同源性分析
      - 抗原结合位点关键残基
    - **公开来源**：
      - 被控方自己公开的 sequence listing（如美国 FDA "Purple Book"、抗体序列披露）
      - SAB (Specific Antibody Database)、sdAb 数据库
      - 论文/专利/监管文件中披露的序列
    - **生物类似药（Biosimilar）信息**：
      - FDA Purple Book（生物类似药/可互换性标注）
      - EMA 生物类似药审评报告
      - 中国 NMPA 生物类似药目录
    - **比对标准**：
      - 100% 同源 → 字面侵权强证据
      - 高同源 + 相同靶点 → 等同侵权可能性评估
      - 同一 epitope（表位）→ 功能等同证据
    - **注意**：抗体专利的"抗原结合"功能性限定可能受到等同原则限制

    ### 方法 4: 临床试验数据对比
    - **ClinicalTrials.gov**（美国 NIH）：试验编号、入组标准、给药方案、主要终点、申办方
    - **ChiCTR**（中国临床试验注册中心）：中国境内临床试验
    - **EU Clinical Trials Register**：欧洲临床试验
    - **PMDA JAPIC / jRCT**：日本临床试验
    - 比对要点：
      - 试验适应症是否落入权利要求限定的用途范围
      - 给药方案（剂量、频率、途径）与权利要求是否一致
      - 联合用药方案：联合治疗的侵权认定
      - 试验时间 vs 我方专利公开时间（影响先用权抗辩）
    - 注意：临床试验阶段产品尚未"上市销售"，需评估不同管辖地对临床阶段的侵权认定（中国《专利法》第 75 条第（五）项 Bolar 例外）

    ### 方法 5: 说明书/标签对比
    - **核心文件**：
      - 美国：FDA 批准的 Prescribing Information（PI）、药物指南（MedGuide）
      - 中国：药品说明书（NMPA 批准版本）、包装标签
      - 欧洲：Summary of Product Characteristics（SmPC）、Package Leaflet
      - 日本：添付文书
    - 比对要点：
      - **适应症**（Indications）：是否落入权利要求限定的用途
      - **给药方案**（Dosage and Administration）：剂量、频率、给药途径、疗程
      - **特殊人群**：儿童、老年、肝肾功能不全剂量调整
      - **剂型/规格**：与权利要求剂型是否对应
    - 关键意义：
      - 说明书落入权利要求范围 = 字面侵权强证据（特别是在用途/适应症权利要求中）
      - 美国案例：Warner-Lambert v. Teva（标签攀附与诱导侵权）

    ### 方法 6: 混合方法（多路径交叉验证）
    - 综合使用上述多种方法，形成证据链
    - 例：监管数据库 → 说明书对比 → 处方逆向分析 → 临床试验数据印证
    - 优先级建议：
      - 化合物/制剂专利：处方分析 + 上市信息 + 说明书
      - 用途专利：说明书适应症 + 临床试验 + 监管批准信息
      - 方法专利：举证责任倒置 + 公开技术资料 + 专家辅助意见
      - 抗体/生物药专利：序列比对 + 监管文件 + 临床数据

    ## 逐项特征对比矩阵
    对每个技术特征构建对比矩阵：

    | 权利要求特征 | 特征类型 | 被控产品对应特征 | 探测方法 | 字面侵权？ | 等同侵权？ | 证据强度 | 备注 |
    |-------------|---------|----------------|---------|-----------|-----------|---------|------|

    评分标准：
    - **确认匹配**：监管文件/说明书/检测报告直接显示该特征存在
    - **高度可能**：上市信息、处方分析可合理推断该特征存在
    - **可能匹配**：部分信息支持，需进一步实验分析/取证
    - **信息不足**：制造工艺/中间体无法直接观测，需依赖举证责任倒置或法院调查
    - **不匹配**：监管信息或检测结果显示该特征不存在

    ## 侵权概率评级
    | 等级 | 标准 | 建议行动 |
    |------|------|---------|
    | 高（>70%） | 所有特征确认匹配或高度可能 | 准备警告函/启动 Hatch-Waxman 或专利链接程序/取证 |
    | 中（40-70%） | 部分特征可能匹配，存在等同可能 | 补充实验分析/补充监管信息调查 |
    | 低（<40%） | 关键特征不匹配或信息不足 | 持续监控/放弃/评估无效风险 |

    ## 医药专利特殊法律问题

    ### 1. Bolar 例外 / 实验使用例外
    仿制药上市前的实验/审批行为**不构成侵权**：
    - **美国**：35 U.S.C. §271(e)(1) —— Hatch-Waxman 的 Bolar 例外
      - 适用范围：仅为获得监管审批（FDA）而进行的实验
      - 限缩：Merck v. Integra（延伸至临床前研究）；可能不适用于商业化研究
    - **中国**：《专利法》第 75 条第（五）项 —— "为提供行政审批所需要的信息，制造、使用、进口专利药品或者专利医疗器械的"
      - 仅适用于行政审批目的，不延伸至商业化研发
    - **欧洲**：Directive 2004/27/EC（共同体法典）—— Bolar 例外
    - **日本**：特许法第 69 条第 1 项但书
    - 影响策略：
      - 无法对仿制药企的 ANDA 前实验主张侵权
      - 但 ANDA 提交本身构成"拟制侵权"（Artificial Infringement，35 U.S.C. §271(e)(2)）
      - 中国：专利链接制度下的 4 类声明是触发纠纷的依据

    ### 2. 方法专利侵权：举证责任倒置
    - **中国《专利法》第 66 条**：制造专利方法 → 制造**同一产品**的新产品 → 被告举证
      - 关键："新产品"要件（在专利申请日前国内未公开销售）
      - 原告仍需证明：合理努力后无法证明被告方法
    - **美国 35 U.S.C. §295**：方法专利 → 产品 → 推定使用（法院裁量）
    - **欧洲**：无统一规则，但某些国家（如德国）有类似机制
    - 实务难点：
      - 生物药/复杂制剂的制造方法难以通过最终产品反推
      - 化学合成的多种路线选择，被告可通过证明"使用了不同方法"抗辩
      - 应对：依赖监管文件中的合成路线披露、专家证人分析

    ### 3. 医疗方法权利要求的执行难度
    - **治疗/手术方法**（in vivo）：
      - 中国《专利法》第 25 条：疾病的诊断和治疗方法**不授予专利权**
      - 美国：可授予专利权，但执行难度大（医生豁免、共同侵权）
      - 欧洲（EPC 第 53(c) 条）：治疗方法不可专利，但**已知物质/组合物的第一/第二医疗用途**可专利（瑞士型 / EPC 2000 第 54(5) 条）
      - 日本：治疗方法不可专利
    - **诊断方法**：
      - 体外诊断（IVD）：通常可专利且可执行
      - in vivo 诊断：在多数司法辖区不可专利或执行困难
    - **瑞士型权利要求**：
      - "物质 X 在制备用于治疗疾病 Y 的药物中的用途"
      - 实质是产品权利要求的一种特殊形式，避开了治疗方法不可专利的问题
      - 中国《专利审查指南》允许第二医药用途权利要求
    - 执行策略：
      - 优先主张产品/组成/用途权利要求
      - 通过药品说明书/监管批准信息证明用途侵权
      - 对医疗方法专利，依赖医疗机构的实施行为作为间接侵权证据

    ### 4. Hatch-Waxman Act（美国）与专利链接（中国）
    - **Hatch-Waxman Act**（美国，1984 年）：
      - **Bolar 例外**：35 U.S.C. §271(e)(1)
      - **拟制侵权**：35 U.S.C. §271(e)(2) —— ANDA/P-IV 声明视为侵权
      - **Orange Book 列名**：NDA 持有人登记专利，仿制药企声明
      - **45 天诉讼期 + 30 个月遏制期**：原研可起诉仿制药企，触发 FDA 批准延迟
      - **180 天独占期**：首个 P-IV 挑战成功的仿制药企
      - **策略**：监控 Orange Book 新登记、P-IV 声明，及时起诉
    - **中国专利链接制度**（2021 年起，CNIPA-NMPA）：
      - **上市药品专利信息登记平台**：MAH 在 CNIPA 登记平台登记专利
      - **仿制药声明**：4 类声明（未登记 / 已登记未侵权 / 已登记将过期 / 无效）
      - **9 类声明**（与登记专利相关）→ 触发纠纷解决机制
      - **9 个月等待期**：CNIPA 受理后 NMPA 设置 9 个月等待期
      - **行政裁决**：CNIPA 可作出行政裁决，司法可救济
      - **策略**：及时在登记平台登记、监控仿制药声明、参与行政裁决
    - **欧洲 SPC（补充保护证书）**：
      - 延长专利保护期最多 5 年（+儿科 6 个月）
      - 监控 SPC 申请/授予，评估延长期内的侵权

    ## 证据链构建

    ### 直接证据
    - **监管文件**：药品注册申请、批准文件、上市许可持有人证明
    - **检测报告**：HPLC/MS/NMR/XRD 分析报告（第三方 CNAS/CMA 资质机构）
    - **生物等效性报告**：与参比制剂比对
    - **序列数据**：被控方公开的 sequence listing、抗体 CDR 序列

    ### 间接证据
    - **说明书/标签**：批准的适应症、给药方案
    - **临床试验数据**：试验设计、入组标准、给药方案
    - **学术论文/会议报告**：制造工艺、API 结构、序列披露
    - **公司公开资料**：年报、技术白皮书、产品宣传

    ### 时间线
    - 我方专利申请日 → 公开日 → 授权日 → 我方药品批准日
    - 对方产品上市时间 / 临床试验开始时间 / 监管批准时间
    - **先用权抗辩评估**：对方是否在我方专利申请日前已独立研发并制造

    ### 证据保全建议
    - **公证购买**：通过公证员见证购买被控药品/试剂
    - **第三方检测报告**：CNAS/CMA 资质机构出具（HPLC、XRD、MS、NMR）
    - **区块链存证**：监管文件、说明书、网页的固化
    - **专家辅助意见**：化学/药学/生物领域专家出具的等同性、生物等效性、序列同源性意见

