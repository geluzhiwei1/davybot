template:
  slug: paris-route
  name: "巴黎公约申请路径规划"
  version: "2.0"
  module: ip-filing
  team_slug: ip-filing

  description: |
    基于巴黎公约的多国直接申请路径规划。
    适用于目标国家较少（≤4个）的场景，避免 PCT 国际阶段费用和延迟。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        store: "input/task_params.json"
      - key: target_countries
        label: "目标国家/地区"
        type: string
        placeholder: "如：CN, US, JP（逗号分隔，建议 ≤ 4 个）"
        store: "input/task_params.json"
      - key: home_country
        label: "首次申请国"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国（CNIPA）" }
          - { value: "US", label: "美国（USPTO）" }
          - { value: "EP", label: "欧洲（EPO）" }
          - { value: "JP", label: "日本（JPO）" }
          - { value: "KR", label: "韩国（KIPO）" }
        store: "input/task_params.json"
    optional:
      - key: priority_date
        label: "优先权日"
        type: string
        placeholder: "YYYY-MM-DD"
        store: "input/task_params.json"
      - key: budget_range
        label: "预算范围"
        type: select
        default: ""
        options:
          - { value: "", label: "不限" }
          - { value: "low", label: "经济型（< 10 万 RMB）" }
          - { value: "medium", label: "标准型（10-20 万 RMB）" }
          - { value: "high", label: "充裕型（> 20 万 RMB）" }
        store: "input/task_params.json"
      - key: language_concern
        label: "翻译需求"
        type: string
        placeholder: "各目标国语言翻译安排"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/filing-requirements"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游申请书继承的文件"
    - dir: input/checklists
      description: "申请要求清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "完整路径方案"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入巴黎公约申请路径规划工作区，请按照 PDCA 工作流执行。

    ## 巴黎公约路径核心规则
    - **12 个月优先权窗口**：从首次申请日（优先权日）起，12 个月内必须在各目标国提交申请
    - **优先权效力**：后续各国申请享有首次申请的申请日作为优先权日
    - **适用场景**：目标国家 ≤ 4 个，且对时间敏感（希望快速获得各国审查结果）

    ## 各国直接申请要点
    ### 中国（CNIPA）
    - 语言：中文
    - 费用：申请费 ¥900 + 公开费 + 审查费 ¥2500（减缴后更低）
    - 特点：可同时申请发明+实用新型（双报策略）

    ### 美国（USPTO）
    - 语言：英文（或提供翻译）
    - 费用：申请费 $300-430 + 检索费 + 审查费（小实体减60%，微实体减80%）
    - 特点：可先提交临时申请（Provisional），12 个月内转正式申请

    ### 欧洲（EPO）
    - 语言：英/法/德
    - 费用：申请费 €1300 + 搜索费 + 指定费
    - 授权后需在各指定国验证

    ### 日本（JPO）
    - 语言：日文
    - 费用：申请费 ¥14,000 + ¥4,000/项权利要求

    ## PCT vs 巴黎公约快速对比
    | 维度 | PCT | 巴黎公约 |
    |------|-----|---------|
    | 时间 | 30 月内进入各国 | 12 月内各国直接申请 |
    | 费用 | 国际费 + 各国费 | 各国申请费 + 翻译 + 代理 |
    | 适用 | ≥ 4 个目标国 | ≤ 3 个目标国 |
    | 灵活性 | 30 月决策窗口 | 需快速决策 |

    ## 输入数据
    1. `input/task_params.json` — 目标国家、首次申请国、优先权日、预算
    2. `input/inherited/` — 专利草案/申请书

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 确认目标国家、首次申请国、优先权日，计算 12 个月期限剩余天数
    ### Do:
    - 各国直接申请时间线（精确到每个国家的提交截止日）
    - 各国费用明细（官费 + 翻译费 + 本地代理费）
    - 翻译安排（确认每种目标语言）
    - 本地代理推荐（每个目标国需要本地代理）
    ### Check: 核对申请要求清单、12 个月期限精确计算
    ### Act: 生成完整路径方案文件

  deliverables:
    - file: "drafts/paris_filing_plan.md"
      name: "巴黎公约路径方案"
      format: markdown
    - file: "output/filing_timeline.md"
      name: "各国申请时间线"
      format: markdown
    - file: "output/fee_breakdown.md"
      name: "各国费用明细"
      format: markdown

  phases:
    - name: plan
      label: "确认目标与期限"
      progress: 15
    - name: do_timeline
      label: "各国时间线"
      progress: 30
    - name: do_fees
      label: "各国费用计算"
      progress: 25
    - name: check
      label: "核验清单"
      progress: 20
    - name: act
      label: "输出方案"
      progress: 10
