template:
  slug: filing-strategy-comparison
  name: "海外申请路径决策分析"
  version: "1.0"
  module: ip-filing
  team_slug: ip-filing

  description: |
    PCT vs 巴黎公约 vs 直接国家申请的路径决策分析。
    基于目标国家数量、预算、时间要求、商业策略综合推荐最优路径。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "请输入发明名称"
        store: "input/task_params.json"
      - key: target_countries
        label: "目标国家/地区"
        type: string
        placeholder: "如：CN, US, EP, JP, KR, IN, BR（逗号分隔）"
        store: "input/task_params.json"
      - key: home_country
        label: "首次申请国"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国" }
          - { value: "US", label: "美国" }
          - { value: "EP", label: "欧洲" }
          - { value: "JP", label: "日本" }
          - { value: "KR", label: "韩国" }
          - { value: "other", label: "其他" }
        store: "input/task_params.json"
    optional:
      - key: priority_date
        label: "优先权日"
        type: string
        placeholder: "YYYY-MM-DD（如已有首次申请）"
        store: "input/task_params.json"
      - key: budget_range
        label: "预算范围"
        type: select
        default: ""
        options:
          - { value: "", label: "不限" }
          - { value: "low", label: "经济型（< 10 万 RMB）" }
          - { value: "medium", label: "标准型（10-30 万 RMB）" }
          - { value: "high", label: "充裕型（> 30 万 RMB）" }
        store: "input/task_params.json"
      - key: time_sensitivity
        label: "时间敏感性"
        type: select
        default: ""
        options:
          - { value: "", label: "一般" }
          - { value: "urgent", label: "急需（需尽快获权）" }
          - { value: "flexible", label: "灵活（可推迟决策）" }
        store: "input/task_params.json"
      - key: market_strategy
        label: "商业策略"
        type: select
        default: ""
        options:
          - { value: "", label: "一般保护" }
          - { value: "licensing", label: "许可授权" }
          - { value: "litigation", label: "诉讼防御" }
          - { value: "blocking", label: "阻击竞争者" }
        store: "input/task_params.json"
      - key: technology_field
        label: "技术领域"
        type: string
        placeholder: "如：AI/通信/生物医药/机械"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/filing-requirements"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游申请书继承的文件"
    - dir: input/checklists
      description: "申请要求清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "完整决策分析"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入海外申请路径决策分析工作区，请按照 PDCA 工作流执行。

    ## 路径决策核心维度

    ### 1. 目标国家数量分析
    | 目标国数量 | 推荐路径 | 原因 |
    |-----------|---------|------|
    | 1 个 | 巴黎公约（直接申请） | 无需国际阶段费用 |
    | 2-3 个 | 巴黎公约（直接申请） | 总费用低于 PCT |
    | 4 个 | 临界点（需详细计算） | 费用接近，取决于翻译/代理费 |
    | 5+ 个 | PCT | 延迟费用支出，利用国际检索报告筛选 |

    ### 2. 费用对比框架
    **PCT 路径总费用**：
    - 国际阶段：申请费 + 检索费 + 可能的初步审查费 + 翻译费 + 代理费（约 5-8 万 RMB）
    - 国家阶段：各国进入费 + 翻译费 + 本地代理费（每国 3-8 万 RMB）

    **巴黎公约路径总费用**：
    - 各国直接申请费 + 翻译费 + 本地代理费（每国 3-8 万 RMB）
    - 无国际阶段费用，但所有费用需在 12 个月内一次性支出

    ### 3. 时间线对比
    | 维度 | PCT | 巴黎公约 | 直接国家申请 |
    |------|-----|---------|-------------|
    | 优先权日 | T+0 | T+0 | T+0 |
    | 国际申请/各国申请 | T+12 月 | T+12 月 | T+12 月 |
    | 检索报告 | T+16 月 | 各国不同 | 各国不同 |
    | 国家阶段进入 | T+30 月 | — | — |
    | 最终决策窗口 | T+30 月 | T+12 月 | T+12 月 |

    ### 4. 特殊考虑因素
    - **技术领域**：生物医药/化学领域建议 PCT（检索报告价值大，可评估后再投入）
    - **市场不确定性**：目标市场不明确时建议 PCT（延长决策窗口）
    - **资金压力**：资金紧张建议 PCT（推迟大额支出）
    - **竞争对手动态**：需快速获权可选择巴黎公约 + 加速审查

    ### 5. 组合策略
    - **PCT + PPH**：国际阶段获得正面书面意见 → 进入各国阶段时利用 PPH 加速
    - **PCT + 巴黎公约混合**：重要市场通过巴黎公约提前布局，其他通过 PCT 延迟决策
    - **Provisional + PCT**：美国先提交临时申请占优先权 → 再进 PCT

    ## 输入数据
    1. `input/task_params.json` — 目标国家、首次申请国、预算、时间、商业策略
    2. `input/inherited/` — 专利草案/申请书

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 确认目标国家、优先权日、预算约束、商业策略
    ### Do:
    - 路径对比分析表（PCT vs 巴黎公约 vs 直接申请，按目标国家逐一分析）
    - 费用对比（3 年总费用 / 5 年总费用，含翻译和代理）
    - 时间线对比（关键截止日、决策窗口、预期获权时间）
    - 最优路径推荐（含理由）
    - 混合策略分析（如适用）
    ### Check: 核对各路径截止日、验证费用计算准确性
    ### Act: 生成完整决策分析报告

  deliverables:
    - file: "drafts/path_decision_analysis.md"
      name: "路径决策分析报告"
      format: markdown
    - file: "output/path_comparison_table.md"
      name: "路径对比表"
      format: markdown
    - file: "output/fee_comparison.md"
      name: "费用对比（3年/5年）"
      format: markdown
    - file: "output/timeline_comparison.md"
      name: "时间线对比"
      format: markdown
    - file: "output/recommendation.md"
      name: "推荐路径及理由"
      format: markdown

  phases:
    - name: plan
      label: "分析需求与约束"
      progress: 15
    - name: do_comparison
      label: "路径对比分析"
      progress: 30
    - name: do_fees
      label: "费用对比计算"
      progress: 25
    - name: check
      label: "核验与验证"
      progress: 20
    - name: act
      label: "输出推荐方案"
      progress: 10
