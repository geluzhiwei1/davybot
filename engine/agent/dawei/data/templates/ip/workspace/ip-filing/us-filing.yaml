template:
  slug: us-filing
  name: "美国专利申请策略"
  version: "1.0"
  module: ip-filing
  team_slug: ip-filing

  description: |
    向 USPTO（美国专利商标局）提交专利申请的完整策略规划。
    包含申请类型选择、实体折扣、Track One 加速、临时申请策略。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "请输入发明名称"
        store: "input/task_params.json"
      - key: application_type
        label: "申请类型"
        type: select
        default: "utility"
        options:
          - { value: "utility", label: "Utility（发明专利）" }
          - { value: "provisional", label: "Provisional（临时申请）" }
          - { value: "plant", label: "Plant（植物专利）" }
          - { value: "design", label: "Design（外观设计）" }
        store: "input/task_params.json"
      - key: entity_status
        label: "实体状态"
        type: select
        default: "small"
        options:
          - { value: "large", label: "大实体（全额）" }
          - { value: "small", label: "小实体（减50%）" }
          - { value: "micro", label: "微实体（减75%）" }
        store: "input/task_params.json"
    optional:
      - key: acceleration
        label: "加速策略"
        type: select
        default: ""
        options:
          - { value: "", label: "普通审查" }
          - { value: "track_one", label: "Track One 优先审查（$1000-4000，目标12个月）" }
          - { value: "accelerated", label: "Accelerated Examination（需提供预检索报告）" }
          - { value: "pph", label: "PPH（基于外国审查结果）" }
        store: "input/task_params.json"
      - key: has_foreign_priority
        label: "外国优先权"
        type: select
        default: ""
        options:
          - { value: "", label: "无" }
          - { value: "yes", label: "有外国优先权申请" }
        store: "input/task_params.json"
      - key: continuing_app
        label: "继续申请"
        type: string
        placeholder: "如：CIP（部分继续）、Divisional（分案）"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/filing-requirements"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游申请书继承的文件"
    - dir: input/checklists
      description: "申请要求清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "完整策略方案"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入美国专利申请策略规划工作区，请按照 PDCA 工作流执行。

    ## USPTO 申请核心规则

    ### 实体折扣
    | 实体类型 | 折扣 | 条件 |
    |---------|------|------|
    | 大实体 | 无 | 默认 |
    | 小实体 | 减 50% | <500人企业/非营利/独立发明人 |
    | 微实体 | 减 75% | 小实体+收入≤$200K/年+未在4件以上申请中被列名 |

    ### 申请类型与策略
    1. **Utility Patent（发明专利）**：标准申请，保护期 20 年（自申请日起）
    2. **Provisional Application（临时申请）**：
       - 费用低（$65-300），不审查，12 个月内必须转正式申请
       - 策略：先占优先权日，争取时间完善发明/评估市场
       - 不需要权利要求（但建议有），不需要声明
    3. **Design Patent（外观设计）**：保护期 15 年（授权日起）
    4. **Plant Patent（植物专利）**：保护期 20 年

    ### 继续申请策略（Continuing Application）
    - **CIP（Continuation-in-Part）**：添加新内容，共享原申请部分优先权
    - **Divisional（分案）**：从母案中分离限制要求（Restriction Requirement）的发明
    - **Continuation（继续）**：完全共享母案公开内容，可修改权利要求

    ### 加速审查途径
    1. **Track One Prioritized Examination**：
      - 费用：大实体 $4,000 / 小实体 $2,000 / 微实体 $1,000
      - 目标：12 个月内完成最终审查决定
      - 限制：每年 10,000 件名额
    2. **Accelerated Examination Program**：
      - 需提交预检索报告 + 加速审查支持文件
      - 复杂但费用较低
    3. **PPH**：基于外国/国际阶段的正面审查结果

    ### USPTO 官费参考（Utility，大实体）
    - 申请费：$320
    - 检索费：$700
    - 审查费：$800
    - 授权领证费：$1,200
    - 年费：第3.5年 $1,600 / 第7.5年 $3,600 / 第11.5年 $7,400

    ## 输入数据
    1. `input/task_params.json` — 发明名称、申请类型、实体状态、加速策略
    2. `input/inherited/` — 专利草案/申请书

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 确认申请类型、实体资格、加速可行性
    ### Do: 申请时间线 + 费用预算（含实体折扣）+ 继续申请策略
    ### Check: 核对申请要求清单、临时申请12月期限检查
    ### Act: 生成完整策略方案

  deliverables:
    - file: "drafts/us_filing_strategy.md"
      name: "美国专利申请策略方案"
      format: markdown
    - file: "output/filing_timeline.md"
      name: "申请时间线"
      format: markdown
    - file: "output/fee_breakdown.md"
      name: "费用明细（含实体折扣）"
      format: markdown

  phases:
    - name: plan
      label: "分析申请需求"
      progress: 15
    - name: do_strategy
      label: "制定申请策略"
      progress: 30
    - name: do_fees
      label: "费用预算"
      progress: 25
    - name: check
      label: "核验清单"
      progress: 20
    - name: act
      label: "输出方案"
      progress: 10
