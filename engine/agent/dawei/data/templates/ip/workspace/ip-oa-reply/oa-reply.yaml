template:
  slug: oa-reply
  name: "OA 审查意见答复"
  version: "1.0"
  module: ip-oa-reply
  team_slug: ip-oa-reply

  description: |
    分析审查意见通知书（Office Action），解析驳回理由，
    制定答复策略，撰写答复意见陈述书及修改的权利要求。

  data_requirements:
    required:
      - key: country
        label: "审查国家"
        type: select
        options:
          - { value: "CN", label: "中国 (CNIPA)" }
          - { value: "US", label: "美国 (USPTO)" }
          - { value: "EP", label: "欧洲 (EPO)" }
          - { value: "JP", label: "日本 (JPO)" }
          - { value: "KR", label: "韩国 (KIPO)" }
        store: "input/task_params.json"
      - key: oa_content
        label: "审查意见内容"
        type: string
        placeholder: "粘贴审查意见通知书内容，或上传文件"
        store: "input/task_params.json"
    optional:
      - key: reply_strategy
        label: "答复策略偏好"
        type: select
        options:
          - { value: "balanced", label: "均衡策略" }
          - { value: "aggressive", label: "积极争辩" }
          - { value: "conservative", label: "保守修改" }
        default: "balanced"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/patent-examination-guidelines

  checklists:
    - ref: "checklist/oa-reply-checklist"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案/申请书继承的文件"
    - dir: input/checklists
      description: "OA 答复检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "答复文件草稿"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入 OA 审查意见答复工作区，请按照 PDCA 工作流执行。

    ## 核心原则：逐条回应
    对审查意见的每一条驳回/异议，必须逐条给出反驳或修改。

    ## 输入数据
    1. `input/task_params.json` — 审查国家、OA 内容、策略
    2. `input/inherited/` — 原始专利草案/权利要求

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 解析 OA，分类驳回理由（新颖性/创造性/清楚性等）
    ### Do: 逐条分析对比文件 + 制定答复策略 + 撰写意见陈述
    ### Check: 核对 OA 答复清单，确认逐条覆盖
    ### Act: 生成答复意见书 + 修改后权利要求

  deliverables:
    - file: "drafts/oa_reply_full.md"
      name: "OA 答复意见书"
      format: markdown
    - file: "output/rejection_analysis.md"
      name: "驳回理由分析"
      format: markdown
    - file: "output/amended_claims.md"
      name: "修改后权利要求"
      format: markdown

  phases:
    - name: plan
      label: "解析审查意见"
      progress: 15
    - name: do_analysis
      label: "对比文件分析"
      progress: 25
    - name: do_strategy
      label: "制定答复策略"
      progress: 20
    - name: do_reply
      label: "撰写意见陈述"
      progress: 25
    - name: check
      label: "核验清单"
      progress: 10
    - name: act
      label: "输出答复文件"
      progress: 5
