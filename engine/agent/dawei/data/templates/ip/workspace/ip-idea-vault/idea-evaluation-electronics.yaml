template:
  slug: idea-evaluation-electronics
  name: "电子/通信创新可专利性评估"
  version: "1.0"
  module: ip-idea-vault
  team_slug: ip-idea-vault

  description: |
    针对电子电路、通信系统、半导体器件等领域创新的可专利性评估。
    重点关注电路架构新颖性、信号处理方法的创造性、硬件实现的技术效果。

  data_requirements:
    required:
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "请描述您的电子/通信创新（电路结构、信号处理流程、系统架构，200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: select
        placeholder: "选择子领域"
        default: ""
        options:
          - value: ""
            label: "请选择"
          - value: "集成电路"
            label: "集成电路/芯片设计"
          - value: "无线通信"
            label: "无线通信 (5G/6G/WiFi)"
          - value: "光通信"
            label: "光通信/光纤"
          - value: "信号处理"
            label: "数字/模拟信号处理 (DSP)"
          - value: "电源管理"
            label: "电源管理/功率电子"
          - value: "传感器"
            label: "传感器/物联网"
          - value: "消费电子"
            label: "消费电子/可穿戴设备"
        store: "input/task_params.json"
      - key: prior_art
        label: "已知的现有技术"
        type: string
        placeholder: "已有专利、标准、技术规范等"
        store: "input/task_params.json"
      - key: technical_effect
        label: "技术效果"
        type: string
        placeholder: "如：功耗降低、传输速率提升、集成度提高"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/checklists
      description: "可专利性检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入电子/通信创新可专利性评估工作区，请按照 PDCA 工作流执行。

    ## 评估重点
    本模板专注于**电子电路与通信系统**类创新，需特别关注：
    1. **新颖性**：电路拓扑/通信协议/信号处理方法是否为现有技术
    2. **创造性**：是否具有非显而易见的技术改进
    3. **实用性**：硬件可实现性、量产可行性
    4. **标准必要专利可能性**：是否涉及通信标准（3GPP/IEEE等）
    5. **技术效果量化**：功耗、速率、面积、误码率等可量化指标

    ## 输入数据
    1. `input/task_params.json` — 技术创意描述、技术子领域、技术效果

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 理解电子/通信创新，确定评估维度
    ### Do: 新颖性分析、创造性分析、实用性分析、标准相关性分析
    ### Check: 核对可专利性清单
    ### Act: 生成评估报告 → `output/patentability_report.md`

  deliverables:
    - file: "output/patentability_report.md"
      name: "电子通信创新可专利性评估报告"
      format: markdown

  phases:
    - name: plan
      label: "理解创意"
      progress: 15
    - name: do
      label: "三性分析"
      progress: 50
    - name: check
      label: "核验清单"
      progress: 20
    - name: act
      label: "生成报告"
      progress: 15
