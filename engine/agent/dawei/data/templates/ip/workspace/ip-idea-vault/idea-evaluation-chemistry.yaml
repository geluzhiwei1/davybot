template:
  slug: idea-evaluation-chemistry
  name: "化学/材料创新可专利性评估"
  version: "1.0"
  module: ip-idea-vault
  team_slug: ip-idea-vault

  description: |
    针对化学组合物、新材料、化工工艺等领域创新的可专利性评估。
    重点关注组分新颖性、配方创造性、性能数据充分性。

  data_requirements:
    required:
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "请描述您的化学/材料创新（化学式/组分/配方/工艺路线，200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: select
        placeholder: "选择子领域"
        default: ""
        options:
          - value: ""
            label: "请选择"
          - value: "高分子材料"
            label: "高分子/聚合物材料"
          - value: "无机材料"
            label: "无机非金属/陶瓷/玻璃"
          - value: "金属材料"
            label: "金属合金/复合材料"
          - value: "纳米材料"
            label: "纳米材料/二维材料"
          - value: "电池/储能"
            label: "电池/电化学/储能"
          - value: "催化剂"
            label: "催化剂/反应助剂"
          - value: "化工工艺"
            label: "化工工艺/分离/合成"
          - value: "涂层/薄膜"
            label: "涂层/薄膜/表面处理"
        store: "input/task_params.json"
      - key: prior_art
        label: "已知的现有技术"
        type: string
        placeholder: "已有专利、文献、产品说明书等"
        store: "input/task_params.json"
      - key: performance_data
        label: "性能数据概况"
        type: string
        placeholder: "关键性能指标及测试方法（如：拉伸强度、导电率、转化率）"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/checklists
      description: "可专利性检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入化学/材料创新可专利性评估工作区，请按照 PDCA 工作流执行。

    ## 评估重点
    本模板专注于**化学组合物与新材料**类创新，需特别关注：
    1. **新颖性**：化学组成/晶体结构/配方比例是否已被公开
    2. **创造性**：组分选择/配比变化是否产生预料不到的技术效果
    3. **充分公开**：制备方法、性能数据是否支持权利要求保护范围
    4. **权利要求类型**：化合物专利/组合物专利/方法专利/用途专利
    5. **马库什结构**：通式化合物的范围合理性
    6. **选择发明**：从已知范围中选出的特定优选方案

    ## 输入数据
    1. `input/task_params.json` — 技术创意描述、技术子领域、性能数据

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 理解化学/材料创新，确定评估维度
    ### Do: 新颖性分析、创造性分析、充分公开性分析、权利要求类型建议
    ### Check: 核对可专利性清单（重点关注化学领域特殊审查规则）
    ### Act: 生成评估报告 → `output/patentability_report.md`

  deliverables:
    - file: "output/patentability_report.md"
      name: "化学材料创新可专利性评估报告"
      format: markdown

  phases:
    - name: plan
      label: "理解创意"
      progress: 15
    - name: do
      label: "三性分析"
      progress: 50
    - name: check
      label: "核验清单"
      progress: 20
    - name: act
      label: "生成报告"
      progress: 15
