template:
  slug: idea-evaluation-mechanical
  name: "机械/制造创新可专利性评估"
  version: "1.0"
  module: ip-idea-vault
  team_slug: ip-idea-vault

  description: |
    针对机械结构、制造工艺、自动化设备等领域创新的可专利性评估。
    重点关注结构新颖性、工艺步骤的创造性、工业适用性。

  data_requirements:
    required:
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "请描述您的机械/制造创新（结构组成、工艺流程、运动原理，200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: select
        placeholder: "选择子领域"
        default: ""
        options:
          - value: ""
            label: "请选择"
          - value: "精密机械"
            label: "精密机械/传动机构"
          - value: "制造工艺"
            label: "制造工艺/加工方法"
          - value: "自动化设备"
            label: "自动化设备/工业机器人"
          - value: "汽车工程"
            label: "汽车/轨道交通"
          - value: "航空航天"
            label: "航空航天/船舶"
          - value: "模具/夹具"
            label: "模具/夹具/检具"
          - value: "流体机械"
            label: "流体机械/液压/气动"
        store: "input/task_params.json"
      - key: prior_art
        label: "已知的现有技术"
        type: string
        placeholder: "已有专利、技术手册、行业规范等"
        store: "input/task_params.json"
      - key: technical_effect
        label: "技术效果"
        type: string
        placeholder: "如：加工精度提高、效率提升、成本降低、可靠性增强"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/checklists
      description: "可专利性检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入机械/制造创新可专利性评估工作区，请按照 PDCA 工作流执行。

    ## 评估重点
    本模板专注于**机械结构与制造工艺**类创新，需特别关注：
    1. **新颖性**：机械结构/工艺步骤是否已有相同设计
    2. **创造性**：组合特征是否产生预料不到的技术效果
    3. **实用性**：可制造性、可重复生产
    4. **保护范围**：可否通过结构特征清楚限定（方法专利vs产品专利）
    5. **实用新型可能性**：部分机械结构可同时申请实用新型

    ## 输入数据
    1. `input/task_params.json` — 技术创意描述、技术子领域、技术效果

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 理解机械/制造创新，确定评估维度
    ### Do: 新颖性分析、创造性分析、实用性分析、保护类型建议
    ### Check: 核对可专利性清单
    ### Act: 生成评估报告 → `output/patentability_report.md`

  deliverables:
    - file: "output/patentability_report.md"
      name: "机械制造创新可专利性评估报告"
      format: markdown

  phases:
    - name: plan
      label: "理解创意"
      progress: 15
    - name: do
      label: "三性分析"
      progress: 50
    - name: check
      label: "核验清单"
      progress: 20
    - name: act
      label: "生成报告"
      progress: 15
