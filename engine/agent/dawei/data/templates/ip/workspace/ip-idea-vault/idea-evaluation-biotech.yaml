template:
  slug: idea-evaluation-biotech
  name: "生物/医药创新可专利性评估"
  version: "1.0"
  module: ip-idea-vault
  team_slug: ip-idea-vault

  description: |
    针对生物技术、药物化合物、医疗器械等领域创新的可专利性评估。
    重点关注生物保藏、实验数据充分性、伦理合规、药品审批链接。

  data_requirements:
    required:
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "请描述您的生物/医药创新（化合物结构、生物序列、器械结构、治疗效果，200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: select
        placeholder: "选择子领域"
        default: ""
        options:
          - value: ""
            label: "请选择"
          - value: "药物化合物"
            label: "药物化合物/药物组合物"
          - value: "生物序列"
            label: "基因/蛋白质/核酸序列"
          - value: "医疗器械"
            label: "医疗器械/植入物"
          - value: "诊断方法"
            label: "诊断/检测方法"
          - value: "疫苗"
            label: "疫苗/免疫制剂"
          - value: "细胞工程"
            label: "细胞工程/基因编辑"
          - value: "中药"
            label: "中药/天然产物"
        store: "input/task_params.json"
      - key: prior_art
        label: "已知的现有技术"
        type: string
        placeholder: "已有专利、文献、临床试验数据等"
        store: "input/task_params.json"
      - key: experimental_data
        label: "实验数据概况"
        type: string
        placeholder: "已有实验数据类型（体外/体内/临床试验阶段）"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/checklists
      description: "可专利性检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入生物/医药创新可专利性评估工作区，请按照 PDCA 工作流执行。

    ## 评估重点
    本模板专注于**生物技术与医药**类创新，需特别关注：
    1. **客体限制**：疾病诊断/治疗方法不可专利（专利法第二十五条）
    2. **生物材料保藏**：涉及生物材料是否需要保藏（布达佩斯条约）
    3. **充分公开**：实验数据是否支持权利要求范围（专利法第二十六条第三款）
    4. **新颖性**：化合物/序列/结构是否已被公开
    5. **创造性**：相对于已知化合物的结构差异和预料不到的效果
    6. **伦理合规**：是否违反法律/社会公德/妨害公共利益
    7. **药品专利链接**：是否涉及药品注册审批相关特殊规定

    ## 输入数据
    1. `input/task_params.json` — 技术创意描述、技术子领域、实验数据概况

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 理解生物/医药创新，确定评估维度
    ### Do: 客体适格性、新颖性、创造性、充分公开性、伦理合规分析
    ### Check: 核对可专利性清单（重点关注生物医药特殊审查规则）
    ### Act: 生成评估报告 → `output/patentability_report.md`

  deliverables:
    - file: "output/patentability_report.md"
      name: "生物医药创新可专利性评估报告"
      format: markdown

  phases:
    - name: plan
      label: "理解创意"
      progress: 15
    - name: do
      label: "三性+合规分析"
      progress: 50
    - name: check
      label: "核验清单"
      progress: 20
    - name: act
      label: "生成报告"
      progress: 15
