template:
  slug: idea-evaluation
  name: "创新点可专利性评估（通用）"
  version: "1.0"
  module: ip-idea-vault
  team_slug: ip-idea-vault

  description: |
    对技术创意进行专利可专利性和商业价值快速评估。
    输出可专利性评分、新颖性分析、创造性分析及保护建议。

  data_requirements:
    required:
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "请描述您的技术创意（200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: string
        placeholder: "如：人工智能、新能源"
        store: "input/task_params.json"
      - key: prior_art
        label: "已知的现有技术"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/checklists
      description: "可专利性检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入创新点可专利性评估工作区，请按照 PDCA 工作流执行。

    ## 输入数据
    1. `input/task_params.json` — 技术创意描述、技术领域

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 理解创意内容，确定评估维度
    ### Do: 新颖性分析、创造性分析、实用性分析、保护策略建议
    ### Check: 核对可专利性清单
    ### Act: 生成评估报告 → `output/patentability_report.md`

  deliverables:
    - file: "output/patentability_report.md"
      name: "可专利性评估报告"
      format: markdown

  phases:
    - name: plan
      label: "理解创意"
      progress: 15
    - name: do
      label: "三性分析"
      progress: 50
    - name: check
      label: "核验清单"
      progress: 20
    - name: act
      label: "生成报告"
      progress: 15
