template:
  slug: us-provisional
  name: "美国临时申请 (Provisional)"
  version: "1.0"
  module: ip-application
  team_slug: ip-application
  target_country: US

  description: |
    生成 USPTO Provisional Application 文件。
    临时申请不需要正式权利要求，但需要完整的 Specification。
    用于确立优先权日，12 个月内需提交正式申请。

  data_requirements:
    required:
      - key: applicant_name
        label: "申请人全称 (Applicant Name)"
        type: string
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人姓名 (Inventor Names)"
        type: string
        store: "input/task_params.json"
    optional:
      - key: entity_status
        label: "实体状态"
        type: select
        options:
          - { value: "large", label: "大型实体" }
          - { value: "small", label: "小型实体" }
          - { value: "micro", label: "微型实体" }
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/us-patent-law

  checklists: []

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案继承的文件"
    - dir: output
      description: "临时申请文件"
    - dir: drafts
      description: "完整申请文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令
    基于草案生成 USPTO Provisional Application。
    临时申请核心：完整 Specification（enabling disclosure），权利要求可选。
    注意：临时申请 12 个月内必须提交正式申请（Non-provisional）以主张优先权。
    工作流：Plan → Do（Specification + Cover Sheet） → Check → Act

  deliverables:
    - file: "drafts/us_provisional_package.md"
      name: "美国临时申请文件"
      format: markdown

  phases:
    - name: plan
      label: "分析草案内容"
      progress: 15
    - name: do_spec
      label: "生成 Specification"
      progress: 40
    - name: check
      label: "完整性检查"
      progress: 25
    - name: act
      label: "生成最终文件"
      progress: 20
