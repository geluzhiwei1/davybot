template:
  slug: pct-application
  name: "PCT 国际申请文件"
  version: "1.0"
  module: ip-application
  team_slug: ip-application
  target_country: PCT

  description: |
    基于专利草案生成符合 WIPO PCT 要求的国际专利申请文件
    (Request + Description + Claims + Abstract + Drawings)。

  data_requirements:
    required:
      - key: applicant_name
        label: "申请人全称 (Applicant Name)"
        type: string
        placeholder: "Legal name of applicant(s)"
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人姓名 (Inventor Names)"
        type: string
        store: "input/task_params.json"
    optional:
      - key: applicant_address
        label: "申请人地址 (Applicant Address)"
        type: string
        store: "input/task_params.json"
      - key: receiving_office
        label: "受理局 (Receiving Office)"
        type: string
        placeholder: "CN / US / EP / JP / KR"
        options:
          - value: CN
            label: "CNIPA (中国)"
          - value: US
            label: "USPTO (美国)"
          - value: EP
            label: "EPO (欧洲)"
          - value: JP
            label: "JPO (日本)"
          - value: KR
            label: "KIPO (韩国)"
        store: "input/task_params.json"
      - key: designated_states
        label: "指定国/选定国 (Designated/Designated States)"
        type: string
        placeholder: "US, EP, JP, KR 等（逗号分隔）"
        store: "input/task_params.json"
      - key: language_filing
        label: "申请语言 (Filing Language)"
        type: string
        placeholder: "zh / en"
        options:
          - value: zh
            label: "中文"
          - value: en
            label: "英文"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/us-patent-law

  checklists:
    - ref: "checklist/pct-format"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案继承的文件"
    - dir: input/checklists
      description: "格式检查清单"
    - dir: output
      description: "PCT 各分册输出"
    - dir: drafts
      description: "完整申请文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入 PCT 国际专利申请文件工作区，请按照 PDCA 工作流执行。

    ## 核心原则：格式合规
    从草案中提取内容，按 PCT Treaty & Regulations 要求重组。不要修改草案的技术内容。

    ## PCT International Application 组成
    | 文件 | 法律依据 |
    |------|---------|
    | PCT Request Form (PCT/RO/101) | PCT Art. 11 |
    | Description | PCT Rule 5 |
    | Claims | PCT Rule 6 |
    | Abstract | PCT Rule 8 |
    | Drawings | PCT Rule 7 |
    | Declaration of Inventorship | PCT Rule 4.17 |

    ## 输入数据
    1. `input/task_params.json` — 申请人信息、受理局、指定国
    2. `input/inherited/` — 专利草案

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取草案，确认 PCT 文件生成顺序，确认受理局和指定国
    ### Do: Request → Description → Claims → Abstract → Drawings
    ### Check: 逐项核对 PCT 格式清单
    ### Act: 生成完整 PCT 申请文件包

    ## 关键 PCT 格式要求
    - Description 需按 PCT Rule 5 结构: Technical Field → Background → Summary → Drawings → Detailed Description
    - Claims 需编号，独立权利要求在最前
    - Abstract 不超过 150 词（中/英文）
    - 权利要求总数建议不超过 10 项（避免超项费）
    - 指定国应列出所有感兴趣的 PCT 缔约国
    - 优先权信息需准确填写（优先权日、优先权国、优先权号）

  deliverables:
    - file: "drafts/pct_patent_package.md"
      name: "PCT 国际申请全套文件"
      format: markdown
    - file: "output/01_pct_request.md"
      name: "PCT Request Form"
    - file: "output/02_description_pct.md"
      name: "Description (说明书)"
    - file: "output/03_claims_pct.md"
      name: "Claims (权利要求书)"
    - file: "output/04_abstract_pct.md"
      name: "Abstract (摘要)"
    - file: "output/05_drawings_pct.md"
      name: "Drawings Description (附图说明)"

  phases:
    - name: plan
      label: "分析草案 + 确认指定国"
      progress: 10
    - name: do_request
      label: "生成 PCT Request"
      progress: 10
    - name: do_description
      label: "生成 Description"
      progress: 25
    - name: do_claims
      label: "生成 Claims"
      progress: 20
    - name: do_abstract_drawings
      label: "生成 Abstract + Drawings"
      progress: 15
    - name: check
      label: "PCT 格式审查"
      progress: 15
    - name: act
      label: "生成最终文件"
      progress: 5
