template:
  slug: kr-application
  name: "韓国特許出願文件"
  version: "1.0"
  module: ip-application
  team_slug: ip-application
  target_country: KR

  description: |
    基于专利草案生成符合 KIPO 要求的韩国特許出願文件
    (明細書 + 特許請求範圍 + 要約書)。

  data_requirements:
    required:
      - key: applicant_name
        label: "出願人名 (Applicant Name)"
        type: string
        store: "input/task_params.json"
      - key: inventor_names
        label: "発明者名 (Inventor Names)"
        type: string
        store: "input/task_params.json"
    optional:
      - key: filing_language
        label: "出願言語"
        type: select
        options:
          - { value: "ko", label: "한국어" }
          - { value: "en", label: "English" }
        default: "ko"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/us-patent-law

  checklists: []

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案继承的文件"
    - dir: output
      description: "KIPO 各分册输出"
    - dir: drafts
      description: "完整申请文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令
    基于草案生成 KIPO 韩国特許出願文件。
    KIPO 格式：明細書（五部分）+ 特許請求範圍 + 要約書（300字以内）。
    工作流：Plan → Do（明細書 → 特許請求範圍 → 要約書） → Check → Act

  deliverables:
    - file: "drafts/kr_patent_package.md"
      name: "韓国特許出願文件"
      format: markdown

  phases:
    - name: plan
      label: "分析草案内容"
      progress: 10
    - name: do_spec
      label: "生成明細書"
      progress: 30
    - name: do_claims
      label: "生成特許請求範圍"
      progress: 25
    - name: do_abstract
      label: "生成要約書"
      progress: 15
    - name: check
      label: "KIPO 格式审查"
      progress: 15
    - name: act
      label: "生成最终文件"
      progress: 5
