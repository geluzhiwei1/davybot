template:
  slug: us-utility
  name: "美国发明专利申请文件"
  version: "1.0"
  module: ip-application
  team_slug: ip-application
  target_country: US

  description: |
    基于专利草案生成符合 USPTO 要求的 Utility Patent Application 文件
    (Specification + Claims + Abstract + Drawings Description)。

  data_requirements:
    required:
      - key: applicant_name
        label: "申请人全称 (Applicant Full Name)"
        type: string
        placeholder: "Individual or corporation legal name"
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人姓名 (Inventor Names)"
        type: string
        store: "input/task_params.json"
    optional:
      - key: applicant_address
        label: "申请人地址 (Applicant Address)"
        type: string
        store: "input/task_params.json"
      - key: attorney_docket_number
        label: "案卷号 (Attorney Docket No.)"
        type: string
        store: "input/task_params.json"
      - key: entity_status
        label: "实体状态 (Entity Status)"
        type: string
        placeholder: "large / small / micro"
        options:
          - value: large
            label: "大型实体 (Large Entity)"
          - value: small
            label: "小型实体 (Small Entity)"
          - value: micro
            label: "微型实体 (Micro Entity)"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/us-patent-law

  checklists:
    - ref: "checklist/us-utility-format"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案继承的文件"
    - dir: input/checklists
      description: "格式检查清单"
    - dir: output
      description: "USPTO 各分册输出"
    - dir: drafts
      description: "完整申请文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入美国发明专利申请文件工作区，请按照 PDCA 工作流执行。

    ## 核心原则：格式合规
    从草案中提取内容，按 USPTO 35 U.S.C. § 111(a) 要求重组。不要修改草案的技术内容。

    ## USPTO Utility Patent Application 组成
    | 文件 | 法律依据 |
    |------|---------|
    | Transmittal Letter | 37 CFR 1.51(a)(1) |
    | Specification | 35 U.S.C. § 112(a) |
    | Claims | 35 U.S.C. § 112(b) |
    | Abstract | 37 CFR 1.72(b) |
    | Drawings Description | 35 U.S.C. § 113 |
    | Declaration/Assignment | 37 CFR 1.63/3.73 |

    ## 输入数据
    1. `input/task_params.json` — 申请人信息
    2. `input/inherited/` — 专利草案

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取草案，确认 USPTO 文件生成顺序
    ### Do: Specification → Claims → Abstract → Drawings → Transmittal
    ### Check: 逐项核对格式清单 (35 USC 112 要求)
    ### Act: 生成完整申请文件包

    ## 关键 USPTO 格式要求
    - Claims 必须以 "What is claimed is:" 开头
    - 独立权利要求需完整 preamble + transitional phrase + body
    - Means-plus-function 语言需谨慎（35 USC 112(f)）
    - Specification 必须包含 enabling disclosure
    - Abstract 不超过 150 词
    - 图纸描述需标注 FIG. 1, FIG. 2 等

  deliverables:
    - file: "drafts/us_patent_package.md"
      name: "美国发明专利申请全套文件"
      format: markdown
    - file: "output/01_specification_uspto.md"
      name: "Specification (说明书)"
    - file: "output/02_claims_uspto.md"
      name: "Claims (权利要求书)"
    - file: "output/03_abstract_uspto.md"
      name: "Abstract (摘要)"
    - file: "output/04_drawings_description.md"
      name: "Drawings Description (附图说明)"

  phases:
    - name: plan
      label: "分析草案内容"
      progress: 10
    - name: do_spec
      label: "生成 Specification"
      progress: 25
    - name: do_claims
      label: "生成 Claims"
      progress: 25
    - name: do_abstract_drawings
      label: "生成 Abstract + Drawings"
      progress: 20
    - name: check
      label: "USPTO 格式审查"
      progress: 15
    - name: act
      label: "生成最终文件"
      progress: 5
