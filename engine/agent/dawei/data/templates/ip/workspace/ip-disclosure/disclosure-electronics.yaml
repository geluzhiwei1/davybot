template:
  slug: disclosure-electronics
  name: "电子/通信技术交底书"
  version: "1.0"
  module: ip-disclosure
  team_slug: ip-disclosure

  description: |
    针对电子电路、通信系统、半导体器件等领域的交底书撰写。
    重点关注电路拓扑、信号处理链路、协议流程、硬件实现细节。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "如：一种低功耗5G终端信号接收方法及装置"
        store: "input/task_params.json"
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "描述电路结构/通信协议/信号处理方法（200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: select
        placeholder: "选择子领域"
        default: ""
        options:
          - value: ""
            label: "请选择"
          - value: "集成电路"
            label: "集成电路/芯片设计"
          - value: "无线通信"
            label: "无线通信 (5G/6G/WiFi)"
          - value: "光通信"
            label: "光通信/光纤"
          - value: "信号处理"
            label: "数字/模拟信号处理 (DSP)"
          - value: "电源管理"
            label: "电源管理/功率电子"
          - value: "传感器"
            label: "传感器/物联网"
          - value: "消费电子"
            label: "消费电子/可穿戴设备"
        store: "input/task_params.json"
      - key: circuit_detail
        label: "电路/系统细节"
        type: string
        placeholder: "关键电路模块、信号链路、协议帧结构等"
        store: "input/task_params.json"
      - key: performance_metrics
        label: "性能指标"
        type: string
        placeholder: "功耗、速率、误码率、面积等关键指标"
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/patent-examination-guidelines

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游评估继承的文件"
    - dir: input/checklists
      description: "交底书检查清单"
    - dir: output
      description: "各章节输出"
    - dir: drafts
      description: "完整交底书文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入电子/通信技术交底书撰写工作区，请按照 PDCA 工作流执行。

    ## 领域重点：电子/通信交底书
    电子通信类交底书需特别关注以下方面：
    1. **电路拓扑精确描述**：各功能模块的连接关系、信号流向、时序关系
    2. **协议/算法流程**：通信协议各层流程、信号处理步骤、编解码方案
    3. **硬件可实现性**：具体器件选型、工艺参数、物理实现方式
    4. **性能量化对比**：信噪比改善、功耗降低、传输速率提升等量化指标
    5. **标准相关性**：是否涉及3GPP/IEEE等标准，标注标准条款编号

    ## 交底书 8 章节
    1. 技术领域（明确电子/通信子领域）
    2. 背景技术（现有电路/协议的缺陷）
    3. 发明目的（要解决的技术问题）
    4. 技术方案（电路结构 + 信号处理 + 工作时序）
    5. 有益效果（量化性能对比）
    6. 具体实施方式（至少2个电路/系统实施例）
    7. 附图说明（电路框图/时序图/协议流程图）
    8. 权利要求概要（方法+装置+系统+芯片）

    ## 输入数据
    1. `input/task_params.json` — 发明名称、电路/系统描述、性能指标
    2. `input/inherited/` — 可选的上游评估报告

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取输入，确认电路/系统核心创新点
    ### Do: 逐章节撰写，重点描述电路拓扑和信号流程
    ### Check: 核对交底书完整性清单
    ### Act: 汇总输出完整交底书

  deliverables:
    - file: "drafts/disclosure_full.md"
      name: "电子通信技术交底书全文"
      format: markdown
    - file: "output/disclosure_sections.md"
      name: "各章节结构化数据"
      format: markdown

  phases:
    - name: plan
      label: "理解技术方案"
      progress: 10
    - name: do_core
      label: "撰写技术方案"
      progress: 25
    - name: do_embodiments
      label: "撰写实施方式"
      progress: 25
    - name: do_remaining
      label: "撰写其他章节"
      progress: 20
    - name: check
      label: "完整性审查"
      progress: 15
    - name: act
      label: "汇总输出"
      progress: 5
