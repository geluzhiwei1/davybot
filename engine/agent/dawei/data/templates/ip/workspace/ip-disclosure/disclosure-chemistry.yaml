template:
  slug: disclosure-chemistry
  name: "化学/材料技术交底书"
  version: "1.0"
  module: ip-disclosure
  team_slug: ip-disclosure

  description: |
    针对化学组合物、新材料、化工工艺等领域的交底书撰写。
    重点关注组分配方、合成路线、性能测试数据、应用场景。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "如：一种高导电柔性复合材料及其制备方法"
        store: "input/task_params.json"
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "描述化学组成/配方比例/合成工艺/材料性能（200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: select
        placeholder: "选择子领域"
        default: ""
        options:
          - value: ""
            label: "请选择"
          - value: "高分子材料"
            label: "高分子/聚合物材料"
          - value: "无机材料"
            label: "无机非金属/陶瓷/玻璃"
          - value: "金属材料"
            label: "金属合金/复合材料"
          - value: "纳米材料"
            label: "纳米材料/二维材料"
          - value: "电池/储能"
            label: "电池/电化学/储能"
          - value: "催化剂"
            label: "催化剂/反应助剂"
          - value: "化工工艺"
            label: "化工工艺/分离/合成"
          - value: "涂层/薄膜"
            label: "涂层/薄膜/表面处理"
        store: "input/task_params.json"
      - key: composition_detail
        label: "组分/配方详情"
        type: string
        placeholder: "各组分名称、比例范围、优选范围、替代组分"
        store: "input/task_params.json"
      - key: process_detail
        label: "制备工艺"
        type: string
        placeholder: "合成路线、工艺参数（温度/压力/时间/设备）"
        store: "input/task_params.json"
      - key: performance_data
        label: "性能数据"
        type: string
        placeholder: "关键性能指标及测试方法（如：拉伸强度/导电率/转化率）"
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/patent-examination-guidelines

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游评估继承的文件"
    - dir: input/checklists
      description: "交底书检查清单"
    - dir: output
      description: "各章节输出"
    - dir: drafts
      description: "完整交底书文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入化学/材料技术交底书撰写工作区，请按照 PDCA 工作流执行。

    ## 领域重点：化学/材料交底书
    化学材料类交底书需特别关注以下方面：
    1. **组分/配方描述**：每种组分的名称、化学式、用量范围（宽范围+优选范围+最佳值）
    2. **制备工艺可重复性**：详细到温度、压力、时间、搅拌速度、设备规格
    3. **性能数据对比**：与现有材料的定量对比（附测试标准和方法）
    4. **马库什结构**：通式化合物的取代基范围和优选方案
    5. **组分协同效果**：多组分组合产生的预料不到的协同效果
    6. **替代方案**：等同组分替换、工艺参数调整范围

    ## 交底书 8 章节
    1. 技术领域（明确化学/材料子领域）
    2. 背景技术（现有材料/工艺的缺陷）
    3. 发明目的（要解决的技术问题）
    4. 技术方案（组分配方 + 制备工艺 + 应用领域）
    5. 有益效果（性能数据量化对比）
    6. 具体实施方式（制备实施例 + 性能测试对比例）
    7. 附图说明（配方表/工艺流程图/性能对比图/SEM/XRD图）
    8. 权利要求概要（组合物+方法+用途+产品）

    ## 输入数据
    1. `input/task_params.json` — 发明名称、组分配方、工艺参数、性能数据
    2. `input/inherited/` — 可选的上游评估报告

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取输入，确认化学组成/材料核心创新点
    ### Do: 逐章节撰写，重点描述配方和制备工艺
    ### Check: 核对交底书完整性清单（关注充分公开和组分范围）
    ### Act: 汇总输出完整交底书

  deliverables:
    - file: "drafts/disclosure_full.md"
      name: "化学材料技术交底书全文"
      format: markdown
    - file: "output/disclosure_sections.md"
      name: "各章节结构化数据"
      format: markdown

  phases:
    - name: plan
      label: "理解技术方案"
      progress: 10
    - name: do_core
      label: "撰写技术方案"
      progress: 25
    - name: do_embodiments
      label: "撰写实施方式"
      progress: 25
    - name: do_remaining
      label: "撰写其他章节"
      progress: 20
    - name: check
      label: "完整性审查"
      progress: 15
    - name: act
      label: "汇总输出"
      progress: 5
