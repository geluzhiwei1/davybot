template:
  slug: trademark-infringement-analysis
  name: "商标侵权分析与维权策略"
  version: "1.0"
  module: ip-trademark
  team_slug: ip-trademark

  description: |
    分析他人是否侵犯我方商标权，制定维权策略。
    包含侵权判定（混淆可能性分析）、证据收集方案、维权路径选择
    （警告函/行政投诉/民事诉讼/海关保护）、损害赔偿计算。

  data_requirements:
    required:
      - key: own_trademark
        label: "我方商标信息"
        type: string
        placeholder: "商标名称、注册号、注册类别、注册日期"
        store: "input/task_params.json"
      - key: infringer_info
        label: "疑似侵权方信息"
        type: string
        placeholder: "侵权方名称/产品/店铺/网站链接"
        store: "input/task_params.json"
    optional:
      - key: infringement_type
        label: "侵权类型"
        type: select
        default: ""
        options:
          - { value: "", label: "待分析" }
          - { value: "identical_same_class", label: "相同商标+同类商品" }
          - { value: "similar_same_class", label: "近似商标+同类商品" }
          - { value: "similar_related_class", label: "近似商标+类似商品" }
          - { value: "counterfeit", label: "假冒（含伪造/贴牌）" }
          - { value: "online", label: "电商平台侵权" }
          - { value: "keyword", label: "搜索引擎关键词侵权" }
          - { value: "domain", label: "域名抢注" }
        store: "input/task_params.json"
      - key: jurisdiction
        label: "维权管辖地"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国" }
          - { value: "US", label: "美国" }
          - { value: "EU", label: "欧盟" }
          - { value: "multi", label: "多国" }
        store: "input/task_params.json"
      - key: damage_estimate
        label: "损失估算"
        type: string
        placeholder: "因侵权造成的销售额损失/对方侵权规模估算"
        store: "input/task_params.json"
      - key: evidence_collected
        label: "已收集证据"
        type: string
        placeholder: "已掌握的证据（公证购买/截图/实物等）"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/trademark-law

  checklists:
    - ref: "checklist/trademark-infringement"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/evidence
      description: "证据材料"
    - dir: input/checklists
      description: "维权检查清单"
    - dir: output
      description: "分析产出"
    - dir: drafts
      description: "维权文书草稿"
    - dir: references
      description: "法规与判例参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入商标侵权分析与维权工作区，请按照 PDCA 工作流执行。

    ## 侵权判定核心：混淆可能性（Likelihood of Confusion）

    ### 多因素测试法（Polaroid Factors / Sleekcraft Factors）

    | 因素 | 说明 | 分析要点 |
    |------|------|---------|
    | 商标相似度 | 音/形/义三维对比 | 整体印象+要部比对 |
    | 商品/服务相似度 | 功能/渠道/消费群体 | 类似群组交叉分析 |
    | 商标强度 | 显著性+知名度 | 臆造>任意>暗示>描述 |
    | 实际混淆证据 | 消费者投诉/误认 | 误认报告、客服记录 |
    | 被告善意 | 是否故意模仿 | 抢注/傍名牌历史 |
    | 消费者注意程度 | 商品价格/专业程度 | 低注意→更易混淆 |
    | 产品线扩展可能性 | 品牌延伸领域 | 可能进入同一市场 |

    ### 中国司法解释要点

    根据《最高人民法院关于审理商标民事纠纷案件适用法律若干问题的解释》：

    **相同或近似判定**：
    - 以相关公众的一般注意力为准
    - 整体比对与主要部分比对相结合
    - 隔离比对

    **类似商品/服务判定**：
    - 以相关公众对商品/服务的一般认识综合判断
    - 参考《商标注册用商品和服务国际分类表》
    - 参考《类似商品和服务区分表》

    ## 侵权行为类型

    | 类型 | 法条（中国） | 典型场景 |
    |------|------------|---------|
    | 假冒（相同+同类） | 商标法第57条第1项 | 造假贴牌 |
    | 近似侵权 | 商标法第57条第2项 | 仿冒近似商标 |
    | 销售侵权商品 | 商标法第57条第3项 | 经销商/零售商 |
    | 伪造商标标识 | 商标法第57条第4项 | 印刷厂/标签商 |
    | 反向假冒 | 商标法第57条第5项 | 去除商标后重新销售 |
    | 帮助侵权 | 商标法第57条第6项 | 提供仓储/运输/便利 |
    | 其他侵权 | 商标法第57条第7项 | 给他人注册商标专用权造成其他损害 |

    ### 特殊侵权形式

    **电商侵权**：
    - 平台责任：通知-删除规则（避风港原则）
    - 自营 vs 第三方商家责任区分
    - 跨境电商的特殊问题

    **关键词广告侵权**：
    - 竞品商标作为搜索关键词
    - 广告标题/描述中使用他人商标
    - 隐性使用（仅作为关键词，不在广告中显示）

    **域名侵权**：
    - 域名与商标相同或混淆性相似
    - 域名持有人无权利或合法利益
    - 域名持有人有恶意
    - UDRP/CNDRP 程序

    ## 维权路径选择

    | 路径 | 适用场景 | 优势 | 劣势 | 周期 |
    |------|---------|------|------|------|
    | 警告函 | 初步侵权、希望快速解决 | 成本低、速度快 | 无强制力、可能打草惊蛇 | 1-2周 |
    | 平台投诉 | 电商/社交媒体侵权 | 快速下架、成本低 | 仅限平台内、可能反复 | 3-7天 |
    | 行政投诉 | 假冒/大规模侵权 | 查处速度快、可罚款 | 无损害赔偿、金额低 | 1-3月 |
    | 民事诉讼 | 需要损害赔偿/禁令 | 可获赔偿、终局解决 | 周期长、成本高 | 6-18月 |
    | 海关保护 | 进出口假冒商品 | 拦截源头、查获量大 | 需海关备案、仅限进出口 | 持续 |
    | 刑事报案 | 大规模假冒（入罪标准） | 威慑力最强、可追刑责 | 立案门槛高 | 6-12月 |

    ## 损害赔偿计算

    | 计算方法 | 适用条件 | 计算公式 |
    |---------|---------|---------|
    | 权利人实际损失 | 能证明因侵权导致的损失 | 每件利润 × 减少的销售量 |
    | 侵权人获利 | 能证明侵权人的违法所得 | 每件利润 × 侵权销售量 |
    | 商标许可费倍数 | 有可比的许可合同 | 许可费 × 合理倍数（1-5倍） |
    | 法定赔偿 | 上述均无法证明 | 法院酌定（中国：500万以下） |
    | 惩罚性赔偿 | 恶意侵权+情节严重 | 实际损失/获利/许可费 × 1-5倍 |

    ## 证据收集方案

    | 证据类型 | 收集方式 | 证明目的 |
    |---------|---------|---------|
    | 公证购买 | 公证员陪同购买侵权产品 | 固定侵权事实 |
    | 网页公证 | 时间戳/区块链存证 | 固定线上侵权 |
    | 实物对比 | 购买正品+侵权品对比 | 证明混淆性 |
    | 消费者调查 | 第三方调查机构 | 证明实际混淆 |
    | 财务证据 | 申请法院调查令 | 证明侵权规模 |
    | 工商信息 | 企业信息查询 | 确认侵权主体 |

    ## 分析方法论

    ### Step 1: 权利基础确认
    1. 确认我方商标注册的有效性（类别、期限、状态）
    2. 确认商标保护范围（是否驰名、是否有跨类保护）
    3. 确认侵权行为发生地在我方权利范围内

    ### Step 2: 侵权判定分析
    | 分析项 | 分析内容 | 结论 |
    |-------|---------|------|
    | 商标相似度 | 音/形/义对比 | 相似度评分 |
    | 商品类似度 | 功能/渠道/消费群体 | 类似程度 |
    | 混淆可能性 | 多因素综合 | 是否可能混淆 |
    | 侵权行为类型 | 对应法条 | 具体条款 |

    ### Step 3: 维权策略制定
    - 根据侵权规模、侵权方实力、证据充分度选择最优路径
    - 制定短期（停止侵权）和长期（损害赔偿）目标
    - 预算与时间线规划

    ### Step 4: 文书准备
    - 警告函/投诉书/起诉状
    - 证据清单与说明
    - 赔偿计算依据

    ## 输入数据
    1. `input/task_params.json` — 双方商标信息、侵权类型、管辖地
    2. `input/evidence/` — 已收集的证据
    3. `input/checklists/` — 维权检查清单

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 确认权利基础，初步评估侵权可能性
    ### Do:
    - 混淆可能性多因素分析
    - 侵权行为定性（对应法条）
    - 证据缺口识别与收集方案
    - 维权路径选择与策略制定
    - 损害赔偿计算
    ### Check: 交叉验证分析结论，评估胜诉概率，确认策略可行性
    ### Act: 生成侵权分析报告 + 维权策略方案 + 文书草稿

  deliverables:
    - file: "drafts/infringement_analysis_report.md"
      name: "商标侵权分析报告"
      format: markdown
    - file: "output/confusion_analysis.md"
      name: "混淆可能性分析（多因素）"
      format: markdown
    - file: "output/enforcement_strategy.md"
      name: "维权策略方案"
      format: markdown
    - file: "output/damages_calculation.md"
      name: "损害赔偿计算"
      format: markdown
    - file: "output/warning_letter_draft.md"
      name: "警告函草稿"
      format: markdown
    - file: "output/evidence_plan.md"
      name: "证据收集方案"
      format: markdown

  phases:
    - name: plan
      label: "确认权利基础"
      progress: 10
    - name: do_infringement
      label: "侵权判定分析"
      progress: 25
    - name: do_evidence
      label: "证据方案制定"
      progress: 20
    - name: do_strategy
      label: "维权策略选择"
      progress: 20
    - name: check
      label: "胜诉评估与复核"
      progress: 15
    - name: act
      label: "输出报告与文书"
      progress: 10
