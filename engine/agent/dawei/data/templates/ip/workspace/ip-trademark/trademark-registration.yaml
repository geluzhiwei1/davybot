template:
  slug: trademark-registration
  name: "商标可注册性评估与注册方案"
  version: "2.0"
  module: ip-trademark
  team_slug: ip-trademark

  description: |
    全面评估商标可注册性：显著性分析、尼斯分类精确推荐、绝对理由与相对理由审查、
    多类别注册策略制定。覆盖中国（CNIPA）、美国（USPTO）、欧盟（EUIPO）、
    日本（JPO）等主要管辖地的注册要求差异。

  data_requirements:
    required:
      - key: trademark_name
        label: "商标名称/图样描述"
        type: string
        placeholder: "如：华为 HUAWEI / 一个太阳图形 + SUNRISE"
        store: "input/task_params.json"
      - key: goods_services
        label: "使用商品/服务描述"
        type: string
        placeholder: "如：智能手机、云计算服务、软件开发（尽量详细）"
        store: "input/task_params.json"
    optional:
      - key: trademark_type
        label: "商标类型"
        type: select
        default: "word"
        options:
          - { value: "word", label: "文字商标（中文/外文/数字）" }
          - { value: "figurative", label: "图形商标" }
          - { value: "combined", label: "组合商标（文字+图形）" }
          - { value: "sound", label: "声音商标" }
          - { value: "3d", label: "三维标志（立体商标）" }
          - { value: "color", label: "颜色组合商标" }
          - { value: "slogan", label: "口号/广告语" }
          - { value: "certification", label: "证明商标" }
          - { value: "collective", label: "集体商标" }
        store: "input/task_params.json"
      - key: jurisdiction
        label: "目标注册管辖地"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国（CNIPA）" }
          - { value: "US", label: "美国（USPTO）" }
          - { value: "EU", label: "欧盟（EUIPO）" }
          - { value: "JP", label: "日本（JPO）" }
          - { value: "KR", label: "韩国（KIPO）" }
          - { value: "multi", label: "多国（需进一步规划）" }
        store: "input/task_params.json"
      - key: applicant_type
        label: "申请人类型"
        type: select
        default: "company"
        options:
          - { value: "company", label: "企业法人" }
          - { value: "individual", label: "自然人" }
          - { value: "partnership", label: "合伙企业" }
          - { value: "foreign", label: "外国申请人" }
        store: "input/task_params.json"
      - key: use_status
        label: "使用状态"
        type: select
        default: "intent"
        options:
          - { value: "in_use", label: "已在商业中使用" }
          - { value: "intent", label: "意图使用（尚未使用）" }
          - { value: "foreign_reg", label: "基于外国注册" }
          - { value: "foreign_app", label: "基于外国申请（优先权）" }
        store: "input/task_params.json"
      - key: priority_claim
        label: "优先权主张"
        type: string
        placeholder: "如有优先权，填写首次申请国+日期：如 CN, 2024-01-15"
        store: "input/task_params.json"
      - key: known_similar_marks
        label: "已知近似商标"
        type: string
        placeholder: "已知可能冲突的商标（如有）"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/trademark-law

  checklists:
    - ref: "checklist/trademark-registration"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游继承的文件"
    - dir: input/checklists
      description: "注册检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "注册方案文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入商标可注册性评估与注册方案工作区，请按照 PDCA 工作流执行。

    ## 商标注册核心原则

    ### 1. 显著性（Distinctiveness）—— 商标可注册性的根基

    | 显著性层级 | 描述 | 可注册性 | 示例 |
    |-----------|------|---------|------|
    | 臆造词（Fanciful） | 为商标目的创造的全新词汇 | 最强 | KODAK、EXXON |
    | 任意词（Arbitrary） | 词典存在但与商品无关 | 极强 | APPLE（电脑）、SHELL（石油） |
    | 暗示性（Suggestive） | 暗示商品特征但需想象 | 强 | MICROSOFT、NETFLIX |
    | 描述性（Descriptive） | 直接描述商品特征 | 弱（需第二含义） | "快速送达"（快递） |
    | 通用名称（Generic） | 商品/服务的通用名称 | 不可注册 | "电脑"（电脑产品） |

    **第二含义（Secondary Meaning）**：描述性商标通过长期使用获得识别性后可注册。
    判断因素：使用时间、广告投入、销售额、消费者调查、媒体引用。

    ### 2. 尼斯分类（Nice Classification）—— 精确类别选择

    当前版本：**第 12 版（2023 版）**，45 个类别（1-34 商品，35-45 服务）。

    分类原则：
    - **商品分类**：按功能、用途、原材料、销售渠道分类
    - **服务分类**：按服务性质、对象、方式分类
    - **跨类保护**：同一商标在多个类别注册可获得更宽保护范围
    - **核心类别 vs 防御类别**：核心经营类别必注，关联类别建议注，防御类别选注

    分类常见误区：
    - 零售批发服务 → 第 35 类（不是商品类别）
    - 软件下载/SAAS → 第 9 类（软件）+ 第 42 类（技术服务）
    - 餐饮服务 → 第 43 类
    - 广告服务 → 第 35 类
    - 金融服务 → 第 36 类

    ### 3. 绝对理由审查（Absolute Grounds）

    | 驳回理由 | 条款（中国） | 说明 |
    |---------|------------|------|
    | 通用名称 | 商标法第11条 | 本商品的通用名称、图形、型号 |
    | 直接描述性 | 商标法第11条 | 仅直接表示商品的质量、原料、功能、重量等 |
    | 缺乏显著性 | 商标法第11条 | 其他缺乏显著特征的标志 |
    | 国旗国徽等 | 商标法第10条 | 国家名称、国旗、国徽、国际组织标志 |
    | 欺骗性 | 商标法第10条 | 容易使公众对商品质量/产地产生误认 |
    | 不良影响 | 商标法第10条 | 有害于社会主义道德风尚或有其他不良影响 |
    | 地理标志冲突 | 商标法第16条 | 商标含地理标志但商品非来源于该地 |

    ### 4. 相对理由审查（Relative Grounds）—— 近似商标冲突

    近似判断维度：
    - **音近**：读音相同或相近（中文同音、谐音）
    - **形近**：字形/外观相同或相近（字母构成、图形构图）
    - **义近**：含义相同或相近（同义词、翻译对应）
    - **商品/服务类似**：尼斯分类相同或类似群组

    近似判断原则：
    - **整体比对 + 要部比对**：既要看整体印象，也要看主要显著部分
    - **隔离比对**：模拟消费者记忆中的对比，非并排放置
    - **消费者一般注意力**：以普通消费者的一般注意力为标准

    ## 各管辖地注册流程差异

    | 管辖地 | 审查制度 | 实质审查 | 公告异议期 | 注册周期 |
    |-------|---------|---------|-----------|---------|
    | 中国 CNIPA | 实质审查 | 是 | 3 个月 | 12-18 个月 |
    | 美国 USPTO | 实质审查 | 是 | 30 天（可延） | 12-24 个月 |
    | 欧盟 EUIPO | 实质审查 | 仅绝对理由 | 3 个月 | 4-8 个月 |
    | 日本 JPO | 实质审查 | 是 | 2 个月 | 6-12 个月 |

    ### 美国 USPTO 特殊要求
    - **使用证据**：必须提交实际使用证据（Specimen），或声明意图使用
    - **Section 8/15 声明**：注册后第 5-6 年需提交继续使用声明
    - **TEAS Plus vs TEAS Standard**：费用与要求不同

    ### 欧盟 EUIPO 特殊要求
    - **一件商标全欧盟有效**：27 个成员国统一保护
    - **不审查相对理由**：仅审查绝对理由，近似冲突留给异议程序
    - **语言**：必须指定第二语言（英语/法/德/意/西）

    ## 分析方法论

    ### Step 1: 商标解析
    1. 拆解商标构成要素（文字部分、图形部分、颜色要素）
    2. 确定商标主要识别部分
    3. 标注商标类型和显著性层级

    ### Step 2: 显著性评估
    | 评估项 | 判断标准 | 评分 |
    |-------|---------|------|
    | 词汇创造性 | 臆造/任意/暗示/描述/通用 | 5/4/3/2/1 |
    | 与商品关联度 | 无关/弱关联/中等关联/直接描述 | 5/4/3/1 |
    | 图形独创性 | 完全独创/有设计变化/通用图案 | 5/3/1 |
    | 整体可识别性 | 消费者能否据商标识别来源 | 5/4/3/2/1 |

    ### Step 3: 尼斯分类推荐
    1. 根据商品/服务描述匹配尼斯分类
    2. 标注核心类别（必须注册）和防御类别（建议注册）
    3. 生成商品/服务项目清单（使用尼斯分类规范表述）

    | 分类层级 | 含义 | 建议 |
    |---------|------|------|
    | 核心类别 | 直接对应主营业务 | **必须注册** |
    | 关联类别 | 上下游或相关业务 | **强烈建议** |
    | 防御类别 | 非主营业务但可能被抢注 | 选注（预算允许时） |

    ### Step 4: 近似商标冲突分析
    对每个核心类别，模拟近似商标检索结果分析：

    | 在先商标 | 相似度（音/形/义） | 商品类似度 | 冲突概率 | 风险等级 |
    |---------|------------------|-----------|---------|---------|

    ### Step 5: 可注册性综合评分

    | 维度 | 权重 | 得分 | 加权分 |
    |------|------|------|-------|
    | 显著性 | 30% | | |
    | 绝对理由合规 | 25% | | |
    | 近似冲突风险 | 30% | | |
    | 商品分类精确性 | 15% | | |
    | **总分** | 100% | | **X/100** |

    | 评分区间 | 可注册性 | 建议行动 |
    |---------|---------|---------|
    | 85-100 | 极高 | 立即提交注册申请 |
    | 70-84 | 较高 | 提交申请，关注可能的小审查意见 |
    | 55-69 | 中等 | 建议修改商标或补充使用证据 |
    | 40-54 | 较低 | 需要重大修改或寻求第二含义证据 |
    | 0-39 | 极低 | 建议更换商标 |

    ## 输入数据
    1. `input/task_params.json` — 商标名称、商品服务、类型、管辖地
    2. `input/inherited/` — 已有商标图样/设计说明（如有）
    3. `input/checklists/` — 注册检查清单

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 解析商标要素，确认管辖地要求，制定评估方案
    ### Do:
    - 显著性评估（层级判定+第二含义分析）
    - 尼斯分类精确推荐（核心+关联+防御类别）
    - 商品/服务项目规范表述
    - 绝对理由审查
    - 近似商标冲突分析
    ### Check: 综合评分交叉验证，检查分类完整性，确认无遗漏风险
    ### Act: 生成注册方案 + 商品/服务清单 + 风险评估报告

  deliverables:
    - file: "drafts/trademark_registration_plan.md"
      name: "商标注册方案"
      format: markdown
    - file: "output/registrability_assessment.md"
      name: "可注册性综合评估"
      format: markdown
    - file: "output/nice_classification.md"
      name: "尼斯分类推荐与商品服务清单"
      format: markdown
    - file: "output/similarity_analysis.md"
      name: "近似商标冲突分析"
      format: markdown
    - file: "output/filing_strategy.md"
      name: "注册策略建议（含费用估算）"
      format: markdown

  phases:
    - name: plan
      label: "解析商标要素"
      progress: 10
    - name: do_distinctiveness
      label: "显著性评估"
      progress: 20
    - name: do_classification
      label: "尼斯分类推荐"
      progress: 25
    - name: do_search
      label: "近似冲突分析"
      progress: 25
    - name: check
      label: "综合评分与风险核查"
      progress: 12
    - name: act
      label: "输出注册方案"
      progress: 8
