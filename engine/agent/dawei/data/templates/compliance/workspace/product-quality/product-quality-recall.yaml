# 合规工作区模板: 召回准备度评估
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: product-quality-recall
  name: "召回准备度评估"
  version: "1.0"
  team_slug: product-quality

  description: |
    对企业产品召回预案和合规流程进行全面审查，评估召回
    准备度并识别改进领域，确保符合各国召回法规要求。

  applicable_scenarios:
    - "召回预案制定/审查"
    - "产品安全事件评估"
    - "召回流程演练评估"
    - "CPSC/RAPEX 召回合规"

  estimated_time: "25-35 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: product_categories
        label: "产品类别"
        type: multiselect
        options: ["电子/电器", "汽车及零部件", "玩具/儿童用品", "食品/饮料", "医疗器械", "化妆品", "纺织品", "化学品", "其他"]
        store: "input/task_parameters.json"

      - key: sales_regions
        label: "产品销售区域"
        type: multiselect
        options: ["中国", "欧盟", "美国", "日本", "其他"]
        store: "input/task_parameters.json"

      - key: has_recall_plan
        label: "是否有既有召回预案"
        type: boolean
        default: false
        store: "input/company_info.json"

    optional:
      - key: existing_recall_plan
        label: "既有召回预案文件"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: previous_recalls
        label: "过往产品召回记录"
        type: text
        placeholder: "描述过往召回事件..."
        store: "input/company_info.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：产品召回预案全面审查-2026"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/product-quality-recall"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的召回预案和相关文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解产品线和销售区域
    - 根据合规清单制定召回准备度评估执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 各市场召回法规要求梳理 → `output/recall_regulations_summary.md`
    b. 既有召回预案内容审查 → `output/existing_plan_review.md`
    c. 召回流程要素完整性检查 → `output/process_elements_checklist.csv`
    d. 产品可追溯性评估 → `output/traceability_assessment.md`
    e. 召回沟通与通知机制评估 → `output/communication_assessment.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证流程覆盖从识别到关闭全周期
    - 确认各市场报告时间表与义务
    - 提交审查结论供用户审核

    ### Act (输出)
    - 生成召回准备度评估报告 → `reports/recall_readiness_assessment.docx`
    - 报告必须包含：执行摘要、召回法规要求概述、预案审查结果、流程要素完整性评分、改进建议（按优先级）、演练建议

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 各市场召回报告义务和时限不同 (如美国 CPSC: 24小时内报告)
    - 产品可追溯性是召回效率的关键

  report_template:
    format: docx
    sections:
      - executive_summary
      - regulations_overview
      - plan_review
      - process_completeness
      - traceability
      - improvement_recommendations
      - drill_suggestions
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_regulations
      label: "法规要求梳理"
      progress: 20
    - name: do_review
      label: "预案审查"
      progress: 25
    - name: do_assessment
      label: "流程要素评估"
      progress: 25
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 10
