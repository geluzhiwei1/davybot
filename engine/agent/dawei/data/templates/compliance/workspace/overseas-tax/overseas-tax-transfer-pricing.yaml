# 合规工作区模板: 转让定价合规分析
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: overseas-tax-transfer-pricing
  name: "转让定价合规分析"
  version: "1.0"
  team_slug: overseas-tax

  description: |
    基于 OECD 转让定价指南和各国转让定价法规，对关联交易
    转让定价合规性进行分析，评估文档准备和争议风险。

  applicable_scenarios:
    - "关联交易转让定价评估"
    - "同期资料准备 (主文档/本地文档/国别报告)"
    - "转让定价风险自评"
    - "APA 预约定价安排评估"

  estimated_time: "30-45 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: transaction_types
        label: "关联交易类型"
        type: multiselect
        options: ["货物购销", "服务提供", "无形资产转让/许可", "资金融通", "劳务", "其他"]
        store: "input/task_parameters.json"

      - key: jurisdictions_involved
        label: "涉及税务管辖区"
        type: multiselect
        options: ["中国", "香港", "新加坡", "美国", "欧盟", "开曼/BVI", "其他"]
        store: "input/task_parameters.json"

      - key: annual_volume
        label: "关联交易年度金额（万人民币）"
        type: string
        placeholder: "如：5000"
        store: "input/task_parameters.json"

    optional:
      - key: has_tp_documentation
        label: "是否有既有转让定价文档"
        type: boolean
        default: false
        store: "input/company_info.json"

      - key: existing_tp_docs
        label: "既有转让定价文档/关联交易合同"
        type: file
        accept: ".pdf,.docx,.xlsx"
        store: "input/"

      - key: profit_margin
        label: "企业整体利润率水平"
        type: string
        placeholder: "如：8%"
        store: "input/company_info.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：2025年度转让定价合规分析"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/tax-transfer-pricing"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的转让定价信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解关联交易结构和规模
    - 根据合规清单制定转让定价合规分析执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 关联交易全景映射 → `output/related_party_transaction_map.json`
    b. 功能风险分析 (Functional Analysis) → `output/functional_risk_analysis.md`
    c. 转让定价方法选择分析 → `output/tp_method_selection.md`
    d. 可比性分析与基准定位 → `output/comparability_benchmarking.md`
    e. 同期资料准备义务评估 → `output/documentation_requirements.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证独立交易原则 (Arm's Length Principle) 应用正确
    - 确认各管辖区合规要求覆盖
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成转让定价合规分析报告 → `reports/transfer_pricing_analysis.docx`
    - 报告必须包含：执行摘要、关联交易全景、功能风险分析、转让定价方法推荐、可比性分析结果、同期资料准备建议、风险预警与缓释建议

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 转让定价分析为初步指引，不构成专业税务意见
    - BEPS 2.0 支柱二 (全球最低税率) 可能影响转让定价策略

  report_template:
    format: docx
    sections:
      - executive_summary
      - transaction_overview
      - functional_risk_analysis
      - tp_method_recommendation
      - comparability_analysis
      - documentation_requirements
      - risk_alerts
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_mapping
      label: "交易全景映射"
      progress: 15
    - name: do_functional
      label: "功能风险分析"
      progress: 20
    - name: do_method
      label: "方法选择与可比分析"
      progress: 25
    - name: do_documentation
      label: "文档义务评估"
      progress: 15
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 5
