# 合规工作区模板: 碳中和路径评估
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: esg-carbon-neutrality
  name: "碳中和路径评估"
  version: "1.0"
  team_slug: esg

  description: |
    基于 CBAM (碳边境调节机制) 和全球碳中和政策框架，对企业
    碳排放现状进行评估，制定碳中和实施路径与合规策略。

  applicable_scenarios:
    - "CBAM 碳关税应对"
    - "碳中和目标制定"
    - "碳足迹核算"
    - "碳配额交易合规"

  estimated_time: "30-45 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: industry
        label: "所属行业"
        type: select
        options:
          - { value: steel, label: "钢铁" }
          - { value: cement, label: "水泥" }
          - { value: aluminum, label: "铝业" }
          - { value: fertilizer, label: "化肥" }
          - { value: electricity, label: "电力" }
          - { value: hydrogen, label: "氢能" }
          - { value: manufacturing, label: "其他制造业" }
        store: "input/task_parameters.json"

      - key: target_market
        label: "产品出口市场"
        type: multiselect
        options: ["欧盟", "英国", "美国", "中国", "日本", "其他"]
        store: "input/task_parameters.json"

      - key: annual_emissions
        label: "年度碳排放量 (吨 CO2e)"
        type: string
        placeholder: "如：50000"
        store: "input/company_info.json"

    optional:
      - key: has_carbon_goal
        label: "是否有既定的碳中和目标"
        type: boolean
        default: false
        store: "input/company_info.json"

      - key: carbon_reports
        label: "过往碳足迹/碳核查报告"
        type: file
        accept: ".pdf,.docx,.xlsx"
        store: "input/"

      - key: energy_mix
        label: "能源结构说明"
        type: text
        placeholder: "描述目前使用的能源类型和比例..."
        store: "input/company_info.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：CBAM碳关税应对与碳中和路线图"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/esg-carbon-neutrality"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的碳排放数据和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解碳排放现状和 CBAM 适用范围
    - 根据合规清单制定碳中和评估执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. CBAM 适用范围判定 → `output/cbam_applicability.md`
    b. 碳足迹核算 (Scope 1/2/3) → `output/carbon_footprint_calculation.xlsx`
    c. 对标行业基准排放强度 → `output/benchmark_comparison.md`
    d. 碳中和路径情景分析 → `output/neutrality_pathways.md`
    e. CBAM 合规成本估算 → `output/cbam_cost_estimate.json`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证碳排放数据完整性和计算准确性
    - 确认 CBAM 隐含碳排放计算方法正确
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成碳中和路径评估报告 → `reports/carbon_neutrality_assessment.docx`
    - 报告必须包含：执行摘要、碳排放全景分析、CBAM合规影响评估、碳中和路径推荐（附投资估算）、减排技术路线建议、碳市场交易策略

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 碳排放计算参考 IPCC 方法论
    - CBAM 数据使用 EU-ETS 最新排放因子

  report_template:
    format: docx
    sections:
      - executive_summary
      - carbon_footprint
      - cbam_assessment
      - neutrality_pathways
      - abatement_technologies
      - carbon_market_strategy
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_cbam
      label: "CBAM 适用性"
      progress: 15
    - name: do_footprint
      label: "碳足迹核算"
      progress: 25
    - name: do_pathways
      label: "路径规划"
      progress: 25
    - name: check
      label: "质量审查"
      progress: 15
    - name: act
      label: "报告生成"
      progress: 10
