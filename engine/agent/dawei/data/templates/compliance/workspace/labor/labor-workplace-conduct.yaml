# 合规工作区模板: 职场行为与合规调查审查
# Layer 1: Workspace Template (YAML) — 定义 HOW
# 覆盖维度：Ch 11（反骚扰）+ Ch 16（员工关系）+ Ch 17（举报人保护）
# 状态码：STATUS_403(无ICC/NLRA违规/无举报渠道) / STATUS_401(报复/NDA缺失豁免) / STATUS_402(无Protocolo) / STATUS_200(通过)

template:
  slug: labor-workplace-conduct
  name: "职场行为与合规调查审查"
  version: "1.0"
  team_slug: labor

  description: |
    对企业反骚扰制度、员工关系管理机制、举报人保护体系进行多法域合规审查，
    覆盖印度 POSH ICC 委员会、西班牙 Protocolo、NLRA 薪资讨论权、欧盟举报渠道等专项。

  applicable_scenarios:
    - "反骚扰制度审查"
    - "举报渠道建立"
    - "员工关系审计"
    - "合规调查程序"

  estimated_time: "30-45 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入贵司全称"
        store: "input/company_info.json"

      - key: target_jurisdictions
        label: "适用法区"
        type: multiselect
        options:
          - "中国内地"
          - "美国（含加州）"
          - "英国"
          - "德国"
          - "法国"
          - "西班牙"
          - "意大利"
          - "澳大利亚"
          - "印度"
          - "日本"
          - "其他（请在备注说明）"
        store: "input/task_parameters.json"

      - key: review_scope
        label: "审查范围"
        type: multiselect
        options:
          - "反骚扰/反霸凌制度"
          - "员工关系/沟通机制"
          - "举报人保护体系"
          - "合规调查程序"
          - "全面审查"
        store: "input/task_parameters.json"

      - key: policy_documents
        label: "相关制度文件"
        type: file
        accept: ".pdf,.docx,.txt"
        store: "input/"
        description: "上传反骚扰政策、员工沟通制度、举报人保护制度、合规调查程序等"

    optional:
      - key: has_reporting_channel
        label: "是否建立了内部举报渠道"
        type: boolean
        default: false
        store: "input/company_info.json"

      - key: has_anti_harassment_training
        label: "是否开展了反骚扰合规培训"
        type: boolean
        default: false
        store: "input/company_info.json"

      - key: india_icc_established
        label: "印度 ICC 委员会是否已设立（如适用）"
        type: boolean
        default: false
        store: "input/task_parameters.json"

      - key: spain_protocolo_file
        label: "西班牙语 Protocolo 文件（如适用）"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: nda_file
        label: "保密协议(NDA)模板"
        type: file
        accept: ".pdf,.docx"
        store: "input/"
        description: "用于审查是否包含吹哨人豁免条款"

      - key: recent_incidents
        label: "近期相关事件描述"
        type: text
        placeholder: "描述近期的骚扰投诉、举报事件、劳资纠纷等"
        store: "input/task_parameters.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：全球反骚扰制度合规审查"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/labor-workplace-conduct"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要审查的职场行为相关制度文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 状态码体系

    | 状态码 | 等级 | 含义 |
    |--------|------|------|
    | STATUS_403 (CRITICAL_LOCK) | 🔴 全线阻断 | 印度实体未设 ICC / 禁止薪资讨论触犯 NLRA / 欧盟实体未建举报渠道 |
    | STATUS_401 (ILLEGAL) | 🟠 违法 | 骚扰案件存续期报复性动作 / NDA 缺失吹哨人豁免 / 未经工会联合签字 |
    | STATUS_402 (REJECT) | 🟡 不达标 | 缺失西班牙语 Protocolo / 印尼沙特未完成官方核准 |
    | STATUS_500 (MANDATORY_LOCK) | 🔴 致命 | 吹哨人保护期内拟解雇，强制锁死人事流程 |
    | STATUS_200 (OK) | ✅ 通过 | 三维度全部通过 |

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，识别反骚扰/员工关系/举报人保护三大模块
    - 制定多法域审查方案
    - 向用户展示计划，等待确认

    ### Do — 维度一：反骚扰（Ch 11）
    a. 反骚扰制度审查 → `output/anti_harassment_review.md`
       - 像素级行为定义完备性
       - 印度 POSH ICC 委员会架设状态 [CODE: HAR-01]
    b. 骚扰案件存续期人事动作审查 → `output/harassment_case_review.md`
       - 报复性动作熔断校验 [CODE: HAR-02]
    c. 本地语言专项文件审查 → `output/local_protocol_review.md`
       - 西班牙 Protocolo/拉美法区登记校验 [CODE: HAR-03]

    ### Do — 维度二：员工关系（Ch 16）
    d. 薪资讨论权审查 → `output/salary_discussion_review.md`
       - 禁止讨论薪资触犯美国 NLRA [CODE: REL-01]
    e. 制度修改民主程序审查 → `output/democratic_procedure_review.md`
       - 欧洲 Works Council 联合签字 [CODE: REL-02]
    f. 官方备案审查 → `output/official_filing_review.md`
       - 印尼 MOM PP 备案 [CODE: REL-03]

    ### Do — 维度三：举报人保护（Ch 17）
    g. 欧盟本地举报渠道审查 → `output/whistleblower_channel_review.md`
       - 50 人以上欧盟实体的 Local Reporting Channel [CODE: WHI-01]
    h. 保密协议豁免条款审查 → `output/nda_whistleblower_review.md`
       - 吹哨人豁免断档校验 [CODE: WHI-02]
    i. 举证责任倒置审查 → `output/reverse_burden_review.md`
       - 吹哨人保护期人事动作交叉检索 [CODE: WHI-03]

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 三维度交叉验证（如：举报 → 报复 → 解雇 = 连锁违法）
    - 证据链完整性检查
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成职场行为与合规调查审查报告 → `reports/workplace_conduct_review.docx`
    - 报告必须包含：反骚扰制度评估、员工关系机制评估、举报人保护体系评估、
      状态码判定、整改建议
    - 如发现印度未设 ICC，附言："⚠️ 印度实体面临吊销执照风险，建议立即设立 POSH ICC 委员会。"
    - 如发现举报渠道缺失，附言："⚠️ 欧盟实体必须在 50 人以上时建立 Local Reporting Channel。"

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 骚扰案件存续期的任何人事动作必须审查是否构成报复
    - 吹哨人保护期内拟解雇必须强制锁死
    - NDA 中缺失吹哨人豁免条款将导致保密协议全盘无效

  report_template:
    format: docx
    sections:
      - executive_summary
      - anti_harassment_review
      - employee_relations_review
      - whistleblower_protection_review
      - cross_dimension_analysis
      - status_code_matrix
      - remediation_recommendations
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_harassment
      label: "反骚扰审查"
      progress: 25
    - name: do_relations
      label: "员工关系审查"
      progress: 20
    - name: do_whistleblower
      label: "举报人保护审查"
      progress: 20
    - name: check
      label: "交叉验证"
      progress: 15
    - name: act
      label: "报告生成"
      progress: 10

  # ── 对话采集模式配置 ──
  chat_collection:
    opening: |
      你好！我是职场行为与合规调查审查顾问。我会引导你提供审查所需的信息。

      整个过程大约需要 8-10 分钟。
    groups:
      - name: "制度概况"
        intro: "首先请告诉我企业基本情况和审查范围。"
        fields:
          - company_name
          - review_scope
          - target_jurisdictions
          - policy_documents
          - recent_incidents
      - name: "反骚扰审查"
        intro: "接下来确认反骚扰制度相关情况。"
        fields:
          - has_anti_harassment_training
          - india_icc_established
          - spain_protocolo_file
      - name: "举报人保护"
        fields:
          - has_reporting_channel
          - nda_file
          - task_subject
