# 合规工作区模板: 跨境用工与外派合规评估（升级版 v2.0）
# Layer 1: Workspace Template (YAML) — 定义 HOW
# 覆盖维度：Ch 19（外派管理）+ Ch 12（EHS）+ Ch 13（IP/数据）+ Ch 14（信息安全·深度跨境）+ Ch 15（资产管理）
# 状态码：STATUS_500/403/401/406/302/200 五维度判定

template:
  slug: labor-cross-border
  name: "跨境用工与外派合规评估"
  version: "2.0"
  team_slug: labor

  description: |
    对跨境员工派遣进行全生态五维度合规评估，覆盖外派管理（三方协议/薪酬拆分/签证就劳）、
    EHS（工伤险/高温排班/特种作业）、IP与数据跨境（职务发明/GDPR监控）、
    信息安全（私人用途豁免/远程监控）及资产管理（境外财产/报销纪律）。

  applicable_scenarios:
    - "外派方案评估"
    - "海外用工体系设计"
    - "跨境派遣"
    - "本地雇佣"

  estimated_time: "45-60 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入贵司全称"
        store: "input/company_info.json"

      - key: home_country
        label: "派驻来源国"
        type: select
        options:
          - { value: "china", label: "中国" }
          - { value: "us", label: "美国" }
          - { value: "uk", label: "英国" }
          - { value: "singapore", label: "新加坡" }
          - { value: "japan", label: "日本" }
          - { value: "other", label: "其他" }
        store: "input/task_parameters.json"

      - key: host_country
        label: "派驻目的国"
        type: string
        placeholder: "如：德国、越南、阿联酋、日本、沙特..."
        store: "input/task_parameters.json"

      - key: assignment_type
        label: "派遣类型"
        type: select
        options:
          - { value: "long_term", label: "长期外派 (>183天)" }
          - { value: "short_term", label: "短期外派 (≤183天)" }
          - { value: "business_trip", label: "商务出差" }
          - { value: "remote_work", label: "跨境远程办公" }
          - { value: "local_hire", label: "本地直接雇佣" }
        store: "input/task_parameters.json"

      - key: assignee_count
        label: "外派/本地雇佣人数"
        type: string
        placeholder: "如：5 人"
        store: "input/task_parameters.json"

      - key: assignment_documents
        label: "外派相关文件"
        type: file
        accept: ".pdf,.docx,.xlsx"
        store: "input/"
        description: "上传外派协议/Secondment Agreement、劳动合同、薪酬拆分方案等"

    optional:
      - key: assignee_roles
        label: "外派人员岗位职责"
        type: text
        placeholder: "描述外派人员的具体工作内容和岗位性质（管理/技术/操作）"
        store: "input/assignment_details.json"

      - key: planned_duration
        label: "计划派遣周期"
        type: string
        placeholder: "如：6 个月、1 年、2 年"
        store: "input/assignment_details.json"

      - key: salary_split_arrangement
        label: "薪酬拆分安排"
        type: text
        placeholder: "描述境内外薪酬发放比例和方式"
        store: "input/assignment_details.json"

      - key: social_security_arrangement
        label: "社保/互免安排"
        type: text
        placeholder: "描述双边社保互免协定(CoC)申请状态或本地社保缴纳计划"
        store: "input/assignment_details.json"

      - key: ehs_risk_assessment
        label: "工作场所 EHS 风险描述"
        type: text
        placeholder: "描述外派工作现场的安全风险（如前线调试、户外作业等）"
        store: "input/assignment_details.json"

      - key: data_cross_border_plan
        label: "数据跨境传输计划"
        type: text
        placeholder: "描述外派场景下 HRM 数据跨境、邮件监控等数据处理计划"
        store: "input/assignment_details.json"

      - key: existing_arrangements
        label: "既有的外派安排文件"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：日本技术外派合规评估"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/labor-cross-border"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的跨境派遣信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 状态码体系（五维度）

    | 状态码 | 等级 | 含义 |
    |--------|------|------|
    | STATUS_500 (FATAL_ERROR) | 🔴 致命 | 德国缺失雇员发明报酬，专利所有权退还个人 |
    | STATUS_403 (CRITICAL_LOCK) | 🔴 全线阻断 | 缺失 Cross-Default 联动解雇条款 / GDPR 监控击穿比例原则 |
    | STATUS_401 (ILLEGAL) | 🟠 违法 | 商务签执行体力作业 / 新加坡缺失 WICA / 加州 Non-Compete 无效 / 意大利远程监控 / 境外强行清场 |
    | STATUS_406 (NOT_ACCEPTABLE) | 🟡 不合格 | 特种作业无证上岗 |
    | STATUS_302 (WARNING) | 🟢 预警 | 欧盟 Posted Workers 12 月吞噬 / 报销惩罚缺乏比例原则 |
    | STATUS_200 (OK) | ✅ 通过 | 五维度全部通过 |

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/assignment_details.json` — 外派详情（如有）
    4. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，识别派遣类型、周期、岗位、薪酬结构
    - 制定五维度跨境合规评估方案（外派 + EHS + IP/数据 + 信息安全 + 资产）
    - 向用户展示计划，等待确认

    ### Do — 维度一：外派管理（Ch 19）
    a. 三方派遣协议审查 → `output/secondment_agreement_review.md`
       - 境内母公司/海外实体/外派人员三方签署
       - 跨国两地解雇联动条款刚性闭环 [CODE: MOB-01]
    b. 薪酬拆分与双重税务审查 → `output/salary_split_tax_review.md`
       - 两边发放全局统一核算
       - 两地个税代扣代缴合规
    c. 外派时限与强行法吞噬审查 → `output/posted_workers_review.md`
       - 欧盟 Posted Workers 12 月吞噬红线 [CODE: MOB-02]
    d. 签证与就劳资质审查 → `output/visa_work_permit_review.md`
       - 日本 ICT 签证就劳资质红线
       - 商务签执行前线体力作业的刑事风险 [CODE: MOB-03]

    ### Do — 维度二：EHS（Ch 12）
    e. 强制工伤险审查 → `output/workplace_injury_insurance.md`
       - 新加坡 WICA 全员在保校验 [CODE: EHS-01]
    f. 高温/极端环境排班审查 → `output/extreme_environment_review.md`
       - 中东夏季户外疲劳极限排班 [CODE: EHS-02]
    g. 特种作业资质审查 → `output/special_operation_cert.md`
       - 持牌资质前置交叉校验 [CODE: EHS-03]

    ### Do — 维度三：IP 与数据资产（Ch 13）
    h. 职务发明审查 → `output/invention_assignment_review.md`
       - 德国雇员发明人法定报酬 [CODE: IP-01]
    i. 非竞争限制审查 → `output/non_compete_review.md`
       - 加州 Non-Compete 合法性过滤 [CODE: IP-02]
    j. 数据跨境审查 → `output/data_transfer_review.md`
       - GDPR/PIPL 监控与调阅权限红线 [CODE: IP-03]

    ### Do — 维度四：信息安全（Ch 14）
    k. 电子通信资产审查 → `output/info_security_review.md`
       - 德国私人用途豁免红线 [CODE: SEC-01]
       - 意大利远程监控禁止 [CODE: SEC-02]
       - AI 工具数据跨境控制 [CODE: SEC-03]

    ### Do — 维度五：资产管理（Ch 15）
    l. 公司财产腾退审查 → `output/asset_recovery_review.md`
       - 境外公寓/住房收回机制合法性 [CODE: FIN-02]
    m. 报销与财务纪律审查 → `output/expense_discipline_review.md`
       - 单方扣款禁止 [CODE: FIN-01]
       - 报销舞弊零容忍闭环 [CODE: FIN-03]

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 五维度交叉验证
    - 双重联动解雇闭环检查
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成跨境用工与外派合规评估报告 → `reports/cross_border_employment_assessment.docx`
    - 报告必须包含：外派管理评估、EHS 合规评估、IP/数据合规评估、信息安全评估、
      资产管理评估、综合状态码判定、缓释建议
    - 如发现三方协议缺失 Cross-Default 条款，附言："⚠️ 建议立即补充三方派遣协议中的 Cross-Default 联动解雇条款。"
    - 如触发欧盟 12 月吞噬，附言："⚠️ 建议评估是否需要转为本地雇佣合同以避免全套劳工法自动适用。"

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 长期外派 (>183天) 通常触发派驻国全面税务和社保义务
    - 商务签执行体力劳动可能构成目的国刑事犯罪
    - 欧盟 Posted Workers 累计超 12 月将触发全套本地劳工法自动适用

  report_template:
    format: docx
    sections:
      - executive_summary
      - assignment_overview
      - secondment_management_review
      - ehs_compliance_review
      - ip_data_transfer_review
      - info_security_review
      - asset_management_review
      - risk_matrix
      - status_code_matrix
      - mitigation_recommendations
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 5
    - name: do_secondment
      label: "外派管理审查"
      progress: 20
    - name: do_ehs
      label: "EHS 合规审查"
      progress: 15
    - name: do_ip_data
      label: "IP/数据审查"
      progress: 15
    - name: do_infosec
      label: "信息安全审查"
      progress: 10
    - name: do_assets
      label: "资产管理审查"
      progress: 10
    - name: check
      label: "交叉验证"
      progress: 15
    - name: act
      label: "报告生成"
      progress: 10

  # ── 对话采集模式配置 ──
  chat_collection:
    opening: |
      你好！我是跨境用工与外派合规评估顾问。我会引导你提供外派方案评估所需的信息。

      整个过程大约需要 10-15 分钟。跨境用工合规涉及多个法域，请尽量提供详细信息。
    groups:
      - name: "外派概况"
        intro: "首先请提供外派基本信息。"
        fields:
          - company_name
          - home_country
          - host_country
          - assignment_type
          - assignee_count
          - assignment_documents
          - assignee_roles
          - planned_duration
      - name: "薪酬/税务"
        intro: "接下来确认薪酬和社保安排。"
        fields:
          - salary_split_arrangement
          - social_security_arrangement
          - existing_arrangements
      - name: "签证/就劳"
        fields:
          - task_subject
      - name: "EHS/数据"
        fields:
          - ehs_risk_assessment
          - data_cross_border_plan
