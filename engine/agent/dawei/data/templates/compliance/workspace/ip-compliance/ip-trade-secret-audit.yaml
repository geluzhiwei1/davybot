# 合规工作区模板: 商业秘密合规审计
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: ip-trade-secret-audit
  name: "商业秘密合规审计"
  version: "1.0"
  team_slug: ip-compliance

  description: |
    对企业商业秘密保护制度进行全面审计，评估保密协议、
    竞业限制和技术泄露风险，确保合规管理。

  applicable_scenarios:
    - "核心研发人员离职风险评估"
    - "供应商/合作伙伴保密协议审查"
    - "商业秘密管理体系建设"
    - "员工竞业限制合规审查"

  estimated_time: "25-35 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待审计企业全称"
        store: "input/company_info.json"

      - key: business_scope
        label: "涉及的核心技术/商业秘密"
        type: text
        placeholder: "请描述企业的核心技术秘密和商业秘密范围..."
        store: "input/task_parameters.json"

      - key: concern
        label: "审计重点"
        type: select
        options:
          - { value: employee_exit, label: "关键人员离职风险评估" }
          - { value: nda_review, label: "保密协议体系审查" }
          - { value: comprehensive, label: "全面合规审计" }
          - { value: incident, label: "泄密事件调查" }
        store: "input/task_parameters.json"

    optional:
      - key: nda_docs
        label: "保密协议文件（可选）"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: employee_info
        label: "涉密人员信息（可选）"
        type: text
        placeholder: "涉及保密的核心岗位和人员信息..."
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/ip-trade-secret-audit"

  workspace_structure:
    - dir: input
      description: "审计输入材料"
      initial_files:
        - path: "input/README.md"
          content: "# 审计输入目录\n\n审计相关材料和参数。"
    - dir: output
      description: "审计中间结果"
    - dir: reports
      description: "审计报告"
    - dir: references
      description: "法律法规参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    1. `input/task_parameters.json`
    2. `input/company_info.json`
    3. `input/` 下所有上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan
    - 理解企业商业秘密范围和审计重点
    - 确定适用法律法规（《反不正当竞争法》、《劳动合同法》等）

    ### Do
    a. 保密协议审查 → `output/nda_review.md`
    b. 竞业限制合规评估 → `output/non_compete_review.md`
    c. 离职风险点识别 → `output/exit_risk_identification.md`
    d. 制度缺陷与改进建议 → `output/remediation_plan.md`

    ### Check
    - 验证审计项覆盖完整
    - 确认法律法规引用准确

    ### Act
    - 生成商业秘密合规审计报告 → `reports/trade_secret_audit_report.docx`

    ## 重要提示
    - 重点关注竞业限制补偿金支付合规性
    - 区分商业秘密与技术秘密的法律定义
    - 本报告不替代专业律师法律意见

  report_template:
    format: docx
    sections:
      - executive_summary
      - scope_and_methodology
      - nda_review
      - non_compete_assessment
      - exit_risk_analysis
      - remediation_plan
      - legal_references

  phases:
    - name: plan
      label: "审计规划"
      progress: 10
    - name: do_nda
      label: "保密协议审查"
      progress: 25
    - name: do_noncompete
      label: "竞业限制评估"
      progress: 25
    - name: do_remediation
      label: "改进方案"
      progress: 25
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 5
