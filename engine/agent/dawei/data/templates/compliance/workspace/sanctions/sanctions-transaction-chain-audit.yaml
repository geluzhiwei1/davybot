# 合规工作区模板: 交易全链路合规审计（新增）
# Layer 1: Workspace Template (YAML) — 定义 HOW
# 覆盖维度：② 交易链 + ③ 标的物 + ④ 地理连接点
# 状态码：多维度独立输出 + 综合判定

template:
  slug: sanctions-transaction-chain-audit
  name: "交易全链路合规审计"
  version: "1.0"
  team_slug: sanctions

  description: |
    对特定跨境交易做全链路制裁合规审计，含 KYT 交易链筛查、
    标的物 HS/ECCN 审计、De Minimis 含美量计算、
    司法管辖连接点分析和地理围栏审查。

  applicable_scenarios:
    - "跨境交易合规审计"
    - "高风险地区交易审查"
    - "出口管制交叉检查"
    - "美元结算交易合规审查"

  estimated_time: "60-90 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        store: "input/company_info.json"

      - key: contract_file
        label: "合同/形式发票/PO"
        type: file
        accept: ".pdf,.docx,.xlsx"
        store: "input/"
        description: "上传跨境交易合同草案、形式发票或采购订单"

      - key: trade_parties
        label: "交易参与方信息"
        type: text
        placeholder: |
          请列出交易链条中所有参与方：
          - 买方/卖方全称、注册地
          - 中间商/佣金方（如有）
          - 最终用户全称、所在国
          - 最终用途描述
        store: "input/trade_parties.json"

      - key: goods_description
        label: "标的物描述"
        type: text
        placeholder: "中英文品名、规格型号、HS 编码"
        store: "input/goods_info.json"

      - key: hs_codes
        label: "海关 HS 编码"
        type: text
        placeholder: "精确到 6-10 位 HS Code，多个用逗号分隔"
        store: "input/goods_info.json"

      - key: shipment_route
        label: "运输路径"
        type: text
        placeholder: |
          启运港 → 中转港 → 目的港
          如涉及海运，请提供船名和 IMO 编码
        store: "input/shipment_info.json"

      - key: payment_info
        label: "结算信息"
        type: text
        placeholder: |
          计价币种、付款行/收款行名称、SWIFT BIC
          如有 MT103 报文请上传
        store: "input/payment_info.json"

      - key: destination_country
        label: "最终目的地国家"
        type: string
        store: "input/task_parameters.json"

    optional:
      - key: bill_of_lading
        label: "海运提单/空运运单"
        type: file
        accept: ".pdf,.jpg,.png"
        store: "input/"

      - key: end_user_statement
        label: "最终用户声明书 (EUS)"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: mt103_file
        label: "MT103 结算报文"
        type: file
        accept: ".pdf,.txt"
        store: "input/"

      - key: product_bom
        label: "产品物料清单 (BOM)"
        type: file
        accept: ".xlsx,.pdf"
        store: "input/"
        description: "包含核心元器件原产地和价值占比的 BOM 表，用于 De Minimis 计算"

      - key: us_content_percentage
        label: "已知含美成分占比（%）"
        type: string
        placeholder: "如不确定请留空，系统将引导计算"
        store: "input/goods_info.json"

      - key: involved_persons
        label: "项目参与关键人员"
        type: text
        placeholder: "姓名、国籍、绿卡状态（用于 U.S. Person 人身管辖判定）"
        store: "input/personnel.json"

      - key: governing_law
        label: "合同适用法"
        type: string
        placeholder: "如：中国法 / 英国法 / 纽约州法"
        store: "input/task_parameters.json"

      - key: existing_export_license
        label: "已有出口许可证（如有）"
        type: file
        accept: ".pdf"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：XX合同跨境交易制裁合规审计"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/sanctions-transaction-chain"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置交易相关合同、提单、报文等文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 状态码体系

    **KYT 维度：**
    - STATUS_401 (BLACKLIST_HIT) — 交易链中存在黑名单主体
    - STATUS_403 (BLOCKED_VESSEL) — 承运船舶为受管辖冻结资产
    - STATUS_402 (FINANCIAL_BLOCK) — 清算路径触碰被切断 SWIFT 的银行

    **标的物维度：**
    - STATUS_403 (GOODS_EMBARGO) — 标的物属于目标国禁运品
    - STATUS_401 (EAR_US_NEXUS) — 含美量超标，触发长臂管辖

    **地理连接维度：**
    - STATUS_403 (USD_NEXUS_FORBIDDEN) — USD 清算 + 制裁地区双重命中
    - STATUS_401 (PERSON_NEXUS) — U.S. Person 参与敏感交易
    - STATUS_406 (GEO_EMBARGO) — 运输路径触碰制裁地理围栏

    **综合：**
    - STATUS_200 (ALL_CLEAR) — 三维度全部通过

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/trade_parties.json` — 交易参与方
    4. `input/goods_info.json` — 标的物信息
    5. `input/shipment_info.json` — 运输路径
    6. `input/payment_info.json` — 结算信息
    7. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 解析交易合同，识别全链路参与方、标的物、路径、结算方式
    - 制定三维度（交易链 + 标的物 + 地理连接）审计计划
    - 向用户展示计划，等待确认

    ### Do — 维度② 交易全链路 KYT

    a. 全链路参与方名单匹配 → `output/kyt_screening_results.json`
       - 合同相对方、中间商、最终用户
       - 物流承运方（船东/货代/报关行）
       - 金融清算链（付款行/中转行/收款行 SWIFT BIC）

    b. 运输工具数字指纹校验 → `output/vessel_verification.json`
       - IMO 编码比对 OFAC 冻结船舶名单
       - 船旗国/船名变更历史

    c. 金融清算路径穿透 → `output/payment_chain_analysis.md`
       - SWIFT BIC 黑名单比对
       - MT103 Field 50/59/70 敏感词扫描

    d. 最终用户/最终用途真实性审查 → `output/end_user_assessment.md`

    ### Do — 维度③ 标的物属性

    e. HS 编码禁运目录比对 → `output/hs_code_check.json`
       - 美国对目的地国的禁运 HS 清单
       - BIS ECCN 分类判定

    f. De Minimis 含美量计算 → `output/de_minimis_calculation.json`
       - BIS De Minimis：≥25%（通用阈值），全面禁运国适用更严标准
       - 注意区分 BIS De Minimis 与 OFAC 50% Rule（不同监管机构）
       - 如用户提供 BOM，执行逐元器件价值拆解

    ### Do — 维度④ 地理连接点

    g. 司法管辖连接点分析 → `output/jurisdiction_nexus.json`
       - USD 清算 → CHIPS → OFAC 管辖激活判定
       - U.S. Person 人身管辖判定
       - 合同适用法管辖

    h. 地理路径围栏审查 → `output/geo_fence_check.json`
       - 运输路线是否途经/停靠制裁地区
       - 中转自贸区风险

    ### Check (验证)
    - 三维度交叉验证（如：实体命中 + USD 结算 = 双重红旗）
    - 证据链完整性检查

    ### Act (输出)
    - 生成交易全链路制裁合规审计报告 → `reports/transaction_chain_audit_report.docx`
    - 包含：交易链图谱、KYT 全节点筛查结果、运输工具验证、金融路径穿透、
      HS 编码/ECCN 判定、De Minimis 计算表、管辖连接点分析、
      综合状态码判定、缓释建议
    - 如发现系统性风险，附言："⚠️ 建议进一步启动「制裁风险综合评估」模板 (sanctions-risk-assessment) 进行全维度评估。"

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - BIS De Minimis 与 OFAC 50% Rule 分属不同监管机构，不可混淆
    - 中国《反外国制裁法》冲突情况必须显式标注"⚠️ 双向合规冲突"

  report_template:
    format: docx
    sections:
      - executive_summary
      - transaction_overview
      - kyt_screening
      - vessel_verification
      - payment_chain_analysis
      - end_user_assessment
      - hs_eccn_analysis
      - de_minimis_calculation
      - jurisdiction_nexus
      - geo_fence_check
      - overall_status
      - mitigation_recommendations
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 5
    - name: do_kyt
      label: "KYT 交易链筛查"
      progress: 20
    - name: do_vessel
      label: "运输工具验证"
      progress: 10
    - name: do_payment
      label: "金融路径穿透"
      progress: 10
    - name: do_goods
      label: "标的物审计"
      progress: 15
    - name: do_nexus
      label: "地理连接点分析"
      progress: 15
    - name: check
      label: "交叉验证"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 15

  # ── 对话采集模式配置 ──
  chat_collection:
    opening: |
      你好！我是制裁合规审计顾问。接下来我会引导你提供跨境交易全链路审计所需的信息。

      我们将从交易概况开始，然后逐步了解参与方、标的物、运输和结算细节。
      你可以随时上传合同、提单、报文等文件。整个过程大约需要 10-15 分钟。
    groups:
      - name: "交易概况"
        intro: "首先，让我们了解这笔交易的基本情况。"
        fields:
          - company_name
          - destination_country
          - governing_law
          - task_subject
      - name: "合同与参与方"
        intro: "请上传合同并提供交易参与方信息。"
        fields:
          - contract_file
          - trade_parties
          - involved_persons
      - name: "标的物"
        intro: "接下来描述交易标的物。"
        fields:
          - goods_description
          - hs_codes
          - product_bom
          - us_content_percentage
      - name: "运输与结算"
        intro: "请提供运输路径和结算信息。"
        fields:
          - shipment_route
          - payment_info
          - bill_of_lading
          - mt103_file
      - name: "补充材料"
        intro: "如果有其他补充文件，可以在这里上传。"
        fields:
          - end_user_statement
          - existing_export_license
