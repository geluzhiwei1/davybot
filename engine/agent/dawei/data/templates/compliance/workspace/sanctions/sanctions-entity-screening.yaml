# 合规工作区模板: 制裁名单快捷筛查（升级版 v2.0）
# Layer 1: Workspace Template (YAML) — 定义 HOW
# 覆盖维度：② 名单匹配（快速）
# 状态码：STATUS_403(SDN命中) / STATUS_401(行业制裁) / STATUS_200(通过)

template:
  slug: sanctions-entity-screening
  name: "制裁名单快捷筛查"
  version: "2.0"
  team_slug: sanctions

  description: |
    基于 OFAC/EU/UN/UK 等多法域制裁名单对目标实体进行快速筛查，
    含 OFAC 50% Rule 聚合风险提示、模糊匹配人工复核清单和结构化状态码输出。

  applicable_scenarios:
    - "交易对手制裁筛查"
    - "客户准入 KYC 筛查"
    - "供应商准入筛查"
    - "跨境支付合规筛查"
    - "并购交易制裁尽调"
    - "定期重新筛查"

  estimated_time: "15-25 分钟"

  data_requirements:
    required:
      - key: target_entities
        label: "待筛查实体"
        type: text
        placeholder: |
          输入待筛查实体名称，每行一个。支持中英文全称、曾用名、缩写。
          也可上传文件批量筛查。
        store: "input/target_entities.txt"

      - key: sanction_regimes
        label: "关注的制裁体系"
        type: multiselect
        options:
          - "OFAC SDN (美国)"
          - "OFAC Sectoral (美国行业制裁)"
          - "OFAC Non-SDN (CAPTA/NS-MBS)"
          - "EU Restrictive Measures (欧盟)"
          - "UN Security Council (联合国)"
          - "UK OFSI (英国)"
          - "BIS Entity List (美国商务部)"
          - "中国反外国制裁清单"
        store: "input/task_parameters.json"

      - key: screening_purpose
        label: "筛查目的"
        type: select
        options:
          - { value: "kyc_onboarding", label: "客户准入 KYC 筛查" }
          - { value: "transaction_review", label: "交易审查" }
          - { value: "periodic_rescreening", label: "定期重新筛查" }
          - { value: "merger_due_diligence", label: "并购尽调" }
          - { value: "vendor_onboarding", label: "供应商准入" }
        store: "input/task_parameters.json"

    optional:
      - key: company_name
        label: "发起筛查的企业名称（可选）"
        type: string
        placeholder: "请输入贵司全称"
        store: "input/company_info.json"

      - key: target_entities_file
        label: "批量筛查文件（可选）"
        type: file
        accept: ".xlsx,.csv,.txt"
        store: "input/"
        description: "上传包含待筛查实体名称的文件，优先于上方文本输入"

      - key: risk_threshold
        label: "模糊匹配阈值"
        type: select
        options:
          - { value: "exact", label: "精确匹配 (100%)" }
          - { value: "high", label: "高置信度 (≥ 90%)" }
          - { value: "medium", label: "中置信度 (≥ 75%)" }
          - { value: "low", label: "低置信度 (≥ 60%)" }
        default: "high"
        store: "input/task_parameters.json"

      - key: transaction_context
        label: "交易背景说明"
        type: text
        placeholder: "简要描述筛查的交易/业务背景..."
        store: "input/task_parameters.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：2026年Q3制裁名单合规筛查"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/sanctions-entity-screening"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要筛查的实体名单和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 状态码体系

    | 状态码 | 等级 | 含义 |
    |--------|------|------|
    | STATUS_403 (SDN_HIT) | 🔴 全线阻断 | 确认命中 SDN/资产冻结名单 |
    | STATUS_401 (SECTORAL_HIT) | 🟠 限制 | 命中行业制裁/限制性清单 |
    | STATUS_200 (CLEAR) | 🟢 通过 | 无命中 |

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解筛查范围和制裁关注体系
    - 解析筛查目的，确定需要匹配的名单类型和严格程度
    - **告知用户**：OFAC 50% Rule — 被制裁主体合计持股 ≥50% 的实体也会被间接认定为受制裁
    - 根据合规清单制定实体筛查执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 实体名称规范化与去重（中文/英文/拼音/曾用名）→ `output/normalized_entities.csv`
    b. 多法域制裁名单筛查 → `output/screening_results_raw.csv`
    c. 命中结果分类标记：
       - STATUS_403: 确认命中 SDN / 资产冻结名单 → 全线阻断
       - STATUS_401: 命中行业制裁 / 限制性清单 → 部分限制
       - STATUS_200: 无命中 → 准予放行
    d. OFAC 50% Rule 聚合计算提醒 → `output/50pct_rule_notes.md`
    e. 模糊匹配结果人工复核清单 → `output/flagged_for_review.csv`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证命中率合理性（过高则建议调高阈值）
    - 确认别名 (AKA/DBA) 覆盖
    - 交叉验证命中的身份要素

    ### Act (输出)
    - 生成制裁名单筛查报告 → `reports/sanctions_screening_report.docx`
    - 报告必须包含：执行摘要、筛查概况（实体数/命中数/命中率）、命中详情（含制裁体系/项目/匹配度/建议操作）、50% Rule 风险提示、人工复核清单
    - 如发现 STATUS_403/401 命中，在报告末尾附言："⚠️ 建议进一步启动「交易对手深度尽调」模板 (sanctions-counterparty-deep-diligence) 进行穿透式分析。"

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 所有筛查结果必须记录时间戳和名单版本，以备审计追溯
    - 制裁名单实时变化，AI 筛查结果仅供参考
    - 任何命中结果建议人工二次确认

  report_template:
    format: docx
    sections:
      - executive_summary
      - screening_overview
      - hit_details
      - 50pct_rule_risk_notes
      - flagged_for_review
      - compliance_recommendations
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_normalize
      label: "实体标准化"
      progress: 15
    - name: do_screening
      label: "名单筛查"
      progress: 35
    - name: do_analysis
      label: "结果分析"
      progress: 25
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 5

  # ── 对话采集模式配置 ──
  chat_collection:
    opening: |
      你好！我是制裁合规筛查顾问。接下来我会引导你提供实体筛查所需的信息。

      整个过程大约需要 3-5 分钟。你可以一次提供所有信息，也可以逐步回答。
    groups:
      - name: "筛查对象"
        intro: "首先，请告诉我需要筛查哪些实体。"
        fields:
          - company_name
          - target_entities
          - target_entities_file
      - name: "筛查参数"
        intro: "接下来请确认筛查范围和参数。"
        fields:
          - sanction_regimes
          - screening_purpose
          - risk_threshold
          - transaction_context
          - task_subject
