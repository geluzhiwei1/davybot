# 合规工作区模板: 数据出境安全评估
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: data-export-assessment
  name: "数据出境安全评估"
  version: "1.0"
  team_slug: data

  description: |
    基于《数据出境安全评估办法》及配套指南，对数据出境场景进行
    安全评估申报材料准备与合规分析，判定是否需要申报安全评估。

  applicable_scenarios:
    - "数据出境安全评估申报"
    - "个人信息出境标准合同备案"
    - "跨境数据合规评估"
    - "重要数据出境审查"

  estimated_time: "30-40 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: export_scenario
        label: "数据出境场景"
        type: select
        options:
          - { value: business_transfer, label: "业务数据传输至境外" }
          - { value: remote_access, label: "境外远程访问境内数据" }
          - { value: cloud_storage, label: "使用境外云服务" }
          - { value: cross_border_sharing, label: "跨境数据共享/转移" }
          - { value: other, label: "其他" }
        store: "input/task_parameters.json"

      - key: data_types
        label: "出境数据类型"
        type: multiselect
        options: ["个人信息", "重要数据", "企业商业秘密", "客户数据", "员工数据", "其他"]
        store: "input/task_parameters.json"

      - key: export_volume
        label: "出境个人信息规模"
        type: select
        options:
          - { value: under_10k, label: "不足1万人" }
          - { value: 10k_to_1m, label: "1万至100万人" }
          - { value: 1m_to_10m, label: "100万至1000万人" }
          - { value: over_10m, label: "1000万人以上" }
          - { value: unknown, label: "暂不确定" }
        store: "input/task_parameters.json"

      - key: recipient_country
        label: "数据接收方所在国家/地区"
        type: multiselect
        options: ["美国", "欧盟", "新加坡", "日本", "香港", "其他"]
        store: "input/task_parameters.json"

    optional:
      - key: existing_contracts
        label: "既有数据出境合同/协议"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: dpia_reports
        label: "个人信息保护影响评估 (PIA) 报告"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：数据出境安全评估申报-2026"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/data-export-security-assessment"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的数据出境信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解数据出境场景和规模
    - 根据合规清单判定适用的合规路径（安全评估/标准合同/认证）
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 数据出境合规路径判定 → `output/compliance_path_determination.md`
    b. 数据出境安全风险自评估 → `output/self_assessment_risk.md`
    c. 接收方数据保护能力评估 → `output/recipient_capability.md`
    d. 申报材料清单准备 → `output/filing_checklist.md`
    e. 标准合同草案条款审查 → `output/scc_review.md` (如适用)

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证合规路径判定准确
    - 确认安全评估申报材料完整
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成数据出境安全评估报告 → `reports/data_export_assessment.docx`
    - 报告必须包含：执行摘要、数据出境全景分析、合规路径判定、安全自评估结果、申报材料清单、后续行动计划（含时间线）、法规依据索引

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 关注触发安全评估的法定情形（重要数据/100万人以上/累计100万人等）
    - 安全评估结论为初步分析，正式申报需经网信部门审批

  report_template:
    format: docx
    sections:
      - executive_summary
      - export_overview
      - compliance_path
      - self_assessment
      - filing_checklist
      - action_plan
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_path
      label: "合规路径判定"
      progress: 20
    - name: do_assessment
      label: "安全风险评估"
      progress: 30
    - name: do_materials
      label: "申报材料准备"
      progress: 20
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 10
