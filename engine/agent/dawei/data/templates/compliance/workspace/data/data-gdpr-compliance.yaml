# 合规工作区模板: GDPR 合规差距分析
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: data-gdpr-compliance
  name: "GDPR 合规差距分析"
  version: "1.0"
  team_slug: data

  description: |
    基于 GDPR 框架进行数据保护合规全面差距分析，识别高风险领域，
    生成整改路线图。适用于向欧盟提供服务或处理欧盟个人数据的企业。

  applicable_scenarios:
    - "在欧盟有业务"
    - "处理欧盟个人数据"
    - "向欧盟用户提供服务"
    - "GDPR 合规审计准备"

  estimated_time: "30-45 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: data_processing_scope
        label: "数据处理范围"
        type: multiselect
        options: ["收集", "存储", "传输", "处理", "删除"]
        store: "input/task_parameters.json"

      - key: data_categories
        label: "涉及的数据类别"
        type: multiselect
        options: ["个人身份信息", "健康数据", "财务数据", "生物识别", "位置数据", "通信数据", "其他"]
        store: "input/task_parameters.json"

      - key: cross_border_transfer
        label: "是否涉及数据跨境传输"
        type: boolean
        default: false
        store: "input/task_parameters.json"

      - key: dpo_appointed
        label: "是否已任命数据保护官 (DPO)"
        type: boolean
        default: false
        store: "input/company_info.json"

    optional:
      - key: previous_assessments
        label: "既往数据保护评估记录"
        type: text
        placeholder: "描述已完成的 DPIA 或数据保护审计..."
        store: "input/company_info.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：GDPR 合规差距分析-2026"
        store: "input/task_parameters.json"

      - key: policy_documents
        label: "既有隐私政策/数据处理协议"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

  checklists:
    - ref: "checklist/data-gdpr-compliance"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的数据处理信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解数据处理场景
    - 根据合规清单制定 GDPR 差距分析执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 数据处理活动映射 → `output/data_processing_map.json`
    b. 合法性基础审查 → `output/lawful_basis_analysis.md`
    c. 数据主体权利实现评估 → `output/subject_rights_assessment.md`
    d. 安全措施差距分析 → `output/security_gap_analysis.md`
    e. 跨境传输合规评估 → `output/cross_border_assessment.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证分析结果完整性
    - 确认未遗漏高风险领域
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成最终 GDPR 合规差距报告 → `reports/gdpr_compliance_gap_report.docx`
    - 报告必须包含：执行摘要、数据处理全景、差距分析矩阵（高/中/低风险）、整改建议（按优先级排序，含时间线）、法规依据索引

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 涉及欧盟监管合规的建议标注监管期望
    - 高风险项必须单独标识，提示优先整改

  report_template:
    format: docx
    sections:
      - executive_summary
      - data_processing_overview
      - gap_analysis_matrix
      - remediation_roadmap
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_mapping
      label: "处理活动映射"
      progress: 25
    - name: do_assessment
      label: "合规差距分析"
      progress: 35
    - name: check
      label: "质量审查"
      progress: 15
    - name: act
      label: "报告生成"
      progress: 15
