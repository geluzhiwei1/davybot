# 合规工作区模板: 第三方尽调审查
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: anti-bribery-third-party
  name: "第三方尽调审查"
  version: "1.0"
  team_slug: anti-bribery

  description: |
    基于 FCPA/UK Bribery Act 等国际反腐败法规，对第三方商业伙伴
    (代理商/经销商/顾问等) 进行反腐败尽职调查和风险评估。

  applicable_scenarios:
    - "第三方合作伙伴准入审查"
    - "FCPA 合规尽调"
    - "代理商/经销商反腐审查"
    - "合并收购反腐败尽调"

  estimated_time: "30-45 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称（委托方）"
        store: "input/company_info.json"

      - key: third_party_name
        label: "第三方名称"
        type: string
        placeholder: "请输入待审查第三方全称"
        store: "input/task_parameters.json"

      - key: third_party_type
        label: "第三方类型"
        type: select
        options:
          - { value: agent, label: "代理商/中间人" }
          - { value: distributor, label: "经销商" }
          - { value: consultant, label: "顾问/咨询" }
          - { value: jv_partner, label: "合资伙伴" }
          - { value: contractor, label: "承包商/供应商" }
          - { value: other, label: "其他" }
        store: "input/task_parameters.json"

      - key: third_party_country
        label: "第三方所在国家/地区"
        type: string
        placeholder: "如：尼日利亚、印度、巴西"
        store: "input/task_parameters.json"

      - key: engagement_purpose
        label: "合作关系/服务内容"
        type: text
        placeholder: "描述与第三方合作的目的和服务范围..."
        store: "input/task_parameters.json"

    optional:
      - key: payment_amount
        label: "预计年度支付金额（万美元）"
        type: string
        placeholder: "如：50"
        store: "input/task_parameters.json"

      - key: has_government_interaction
        label: "第三方是否与政府官员有互动"
        type: boolean
        default: false
        store: "input/task_parameters.json"

      - key: existing_contract
        label: "既有合作合同/协议"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：XX代理商反腐败尽调审查"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/anti-bribery-third-party"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的第三方尽调信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解第三方合作关系和风险特征
    - 根据合规清单制定第三方尽调审查执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 第三方基础信息核实 → `output/basic_verification.json`
    b. 红警指标 (Red Flags) 筛查 → `output/red_flags_screening.md`
    c. 反腐败合规记录审查 → `output/compliance_record_check.md`
    d. 腐败感知指数 (CPI) 与国家风险结合评估 → `output/country_risk_assessment.md`
    e. 第三方风险等级评定 → `output/risk_rating.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证红警指标覆盖全面
    - 确认风险评估方法一致性
    - 提交审查结论供用户审核

    ### Act (输出)
    - 生成第三方反腐败尽调报告 → `reports/third_party_due_diligence.docx`
    - 报告必须包含：执行摘要、第三方基本信息、红警指标筛查结果、合规风险评估、终局风险等级、建议行动（批准/附条件批准/拒绝）、持续监测建议

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - FCPA 域外效力广泛，美国连接点即可触发管辖
    - 重点关注与政府官员互动的第三方

  report_template:
    format: docx
    sections:
      - executive_summary
      - party_profile
      - red_flags_screening
      - risk_assessment
      - final_rating
      - recommended_actions
      - monitoring_plan
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_verification
      label: "基础信息核实"
      progress: 15
    - name: do_red_flags
      label: "红警指标筛查"
      progress: 30
    - name: do_assessment
      label: "综合风险评估"
      progress: 25
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 10
