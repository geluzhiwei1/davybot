# 项目合规模板: 投资并购合规
# 纵向复合模板 — 覆盖 M&A 全流程的反垄断、ODI、CFIUS、税务、劳动、IP

template:
  slug: project-ma
  name: "投资并购合规"
  version: "1.0"
  category: "project"
  team_slug: compliance
  is_project_template: true

  description: |
    面向跨境投资并购交易的全流程合规管理。覆盖反垄断经营者集中申报、
    境外投资备案（ODI）、CFIUS国家安全审查、转让定价、劳动用工合规、
    知识产权FTO尽调。以交易为时间轴驱动合规里程碑管理。

  applicable_scenarios:
    - "跨境并购交易（Cross-border M&A）"
    - "海外合资/合营（Joint Venture）"
    - "绿地投资/海外建厂"
    - "私募股权/基金海外投资"
    - "国有企业境外投资"

  estimated_time: "交易全流程"

  domains_covered:
    - key: antitrust
      label: "反垄断"
      reason: "经营者集中申报、市场支配地位"
    - key: overseas-investment
      label: "境外投资"
      reason: "ODI备案、CFIUS审查、EU FDI筛选"
    - key: overseas-tax
      label: "海外税务"
      reason: "转让定价、PE风险、CFC"
    - key: labor
      label: "劳动合规"
      reason: "目标公司劳动尽调、员工安置"
    - key: ip-compliance
      label: "知识产权"
      reason: "FTO分析、IP资产权属、技术出口管制"

  agent_teams:
    - antitrust-team
    - overseas-investment-team
    - overseas-tax-team
    - labor-team
    - ip-compliance-team
    - compliance-team

  data_requirements:
    required:
      - key: project_name
        label: "交易名称"
        type: string
        store: "input/project_info.json"
        placeholder: "如：收购德国某汽车零部件企业"

      - key: deal_type
        label: "交易类型"
        type: select
        options:
          - { value: "acquisition", label: "收购（股权/资产）" }
          - { value: "merger", label: "合并" }
          - { value: "jv", label: "合资/合营" }
          - { value: "greenfield", label: "绿地投资" }
          - { value: "other", label: "其他" }
        store: "input/project_info.json"

      - key: target_country
        label: "目标国家/地区"
        type: string
        store: "input/project_info.json"
        placeholder: "如：德国、美国、东盟"

    optional:
      - key: deal_value
        label: "交易金额"
        type: string
        store: "input/project_info.json"
        placeholder: "如：3亿欧元"

      - key: target_industry
        label: "目标行业"
        type: string
        store: "input/project_info.json"
        placeholder: "如：汽车零部件、半导体、新能源"

      - key: closing_date_target
        label: "目标交割日期"
        type: string
        store: "input/project_info.json"
        placeholder: "如：2026-Q4"

  checklists:
    - ref: "checklist/sanctions-entity-screening"

  workspace_structure:
    - dir: input
      description: "交易合规输入数据"
      initial_files:
        - path: "input/README.md"
          content: |
            # 投资并购合规输入数据

            ## 摸底调查表
            `input/investigation.json` — 交易结构、交易对手信息

            ## 项目材料
            `input/materials/` — 交易文件、尽调报告、SPA、估值报告等
    - dir: output
    - dir: output/screening_results
    - dir: output/contract_review
    - dir: reports
    - dir: references

  agent_instructions: |
    # {template_name} — 投资并购合规工作区

    你已加入投资并购合规工作区。聚焦跨境M&A交易合规。

    ## 工作区路径
    {workspace_path}

    ## 合规审查里程碑

    ### 1. 反垄断申报（antitrust-team）
    - 经营者集中申报门槛判断
    - 中国/欧盟/美国申报义务分析
    - 市场界定和竞争评估

    ### 2. 境外投资审查（overseas-investment-team）
    - ODI备案流程（发改委/商务部/外管局）
    - CFIUS国家安全审查风险（如涉美）
    - EU FDI筛选框架分析

    ### 3. 税务合规（overseas-tax-team）
    - 交易架构税务效率分析
    - 转让定价文档准备
    - PE风险和CFC分析

    ### 4. 劳动尽调（labor-team）
    - 目标公司劳动合同审查
    - 员工安置/裁员方案合规
    - 跨境用工和外派安排

    ### 5. 知识产权尽调（ip-compliance-team）
    - FTO自由实施分析
    - IP资产权属确认
    - 技术出口管制交叉检查

    ## 智能体工具优先级
    1. nn-kb-searcher（法律检索）
    2. sanctions-knowledge（交易对手筛查）
    3. web search（兜底）

    ## 关联合规清单
    {checklist_table}

  phases:
    - name: initiation
      label: "立项 — 交易结构分析"
      progress: 10
    - name: screening
      label: "尽调 — 合规风险识别"
      progress: 30
    - name: monitoring
      label: "执行 — 申报/审查/整改"
      progress: 30
    - name: reporting
      label: "交付 — 合规意见"
      progress: 20
    - name: exit
      label: "退出 — 交割归档"
      progress: 10
