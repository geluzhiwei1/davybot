# 项目合规模板索引
# 项目合规 ≠ 单域合规分析
# 项目合规是纵向复合的：一个项目可能同时涉及制裁、供应链、出口管制等多个合规域
# 对齐 PRD-Compliance 90章 双核驱动 + 5阶段生命周期

templates:
  - slug: project-overseas-epc
    name: "海外工程项目合规"
    icon: "building"
    category: "project"
    estimated_time: "持续跟踪"
    description: "海外工程项目全生命周期合规管理：业主筛查、合同审核、供应链、出口管制、劳动用工、反贿赂"
    domains_covered:
      - key: sanctions
        label: "制裁合规"
        reason: "业主/交易对手制裁筛查，SDN 50%规则"
      - key: supply-chain
        label: "供应链合规"
        reason: "供应商尽调、UFLPA风险、冲突矿产"
      - key: export-control
        label: "出口管制"
        reason: "设备/技术 ECCN 分类、两用物项"
      - key: anti-bribery
        label: "反商业贿赂"
        reason: "FCPA/UKBA 合规承诺、第三方尽调"
      - key: labor
        label: "劳动合规"
        reason: "跨境用工、外派管理、强迫劳动风险"
    agent_teams:
      - sanctions-team
      - supply-chain-team
      - export-control-team
      - anti-bribery-team
      - labor-team
      - compliance-team

  - slug: project-cross-border-trade
    name: "跨境贸易合规"
    icon: "ship"
    category: "project"
    estimated_time: "持续跟踪"
    description: "跨境贸易合规管理：制裁筛查、出口管制、海关合规、转让定价、外汇结算"
    domains_covered:
      - key: sanctions
        label: "制裁合规"
        reason: "交易对手/银行制裁筛查，SDN 50%规则"
      - key: export-control
        label: "出口管制"
        reason: "EAR/ECCN分类、ITAR、FDPR、De Minimis"
      - key: overseas-tax
        label: "海外税务"
        reason: "转让定价、PE风险、海关估价"
      - key: anti-bribery
        label: "反商业贿赂"
        reason: "海关腐败风险、第三方代理尽调"
    agent_teams:
      - sanctions-team
      - export-control-team
      - overseas-tax-team
      - anti-bribery-team
      - compliance-team

  - slug: project-ma
    name: "投资并购合规"
    icon: "handshake"
    category: "project"
    estimated_time: "持续跟踪"
    description: "投资并购全流程合规：反垄断申报、ODI备案、CFIUS审查、税务、劳动用工、IP尽调"
    domains_covered:
      - key: antitrust
        label: "反垄断"
        reason: "经营者集中申报、市场支配地位"
      - key: overseas-investment
        label: "境外投资"
        reason: "ODI备案、CFIUS审查、EU FDI筛选"
      - key: overseas-tax
        label: "海外税务"
        reason: "转让定价、PE风险、CFC"
      - key: labor
        label: "劳动合规"
        reason: "目标公司劳动尽调、员工安置"
      - key: ip-compliance
        label: "知识产权"
        reason: "FTO分析、IP资产权属、技术出口管制"
    agent_teams:
      - antitrust-team
      - overseas-investment-team
      - overseas-tax-team
      - labor-team
      - ip-compliance-team
      - compliance-team
