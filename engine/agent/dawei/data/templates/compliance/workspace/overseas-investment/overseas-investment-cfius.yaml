# 合规工作区模板: CFIUS 国家安全审查
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: overseas-investment-cfius
  name: "CFIUS 国家安全审查"
  version: "1.0"
  team_slug: overseas-investment

  description: |
    基于 CFIUS 审查框架和 FIRRMA 法案，对涉及美国企业的外资交易
    进行国家安全审查风险评估和申报策略建议。

  applicable_scenarios:
    - "收购美国企业"
    - "投资美国关键技术/基础设施/敏感数据 (TID)"
    - "CFIUS 强制/自愿申报"
    - "外国政府投资者审查"

  estimated_time: "30-45 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "投资方企业名称"
        type: string
        placeholder: "请输入投资方企业全称"
        store: "input/company_info.json"

      - key: target_name
        label: "美国目标企业名称"
        type: string
        placeholder: "请输入美国目标企业全称"
        store: "input/company_info.json"

      - key: transaction_type
        label: "交易类型"
        type: select
        options:
          - { value: m_and_a, label: "并购" }
          - { value: minority, label: "非控股少数股权" }
          - { value: real_estate, label: "房地产交易" }
          - { value: greenfield, label: "绿地投资" }
          - { value: joint_venture, label: "合资企业" }
          - { value: other, label: "其他" }
        store: "input/task_parameters.json"

      - key: tid_involvement
        label: "目标企业涉及 TID 领域"
        type: multiselect
        options: ["关键技术 (T)", "关键基础设施 (I)", "敏感个人数据 (D)", "均不涉及", "不确定"]
        store: "input/task_parameters.json"

      - key: investor_type
        label: "投资方性质"
        type: select
        options:
          - { value: private, label: "纯商业/私人" }
          - { value: state_owned, label: "国有/国家控制" }
          - { value: sovereign_fund, label: "主权基金" }
          - { value: state_linked, label: "与国家有关联" }
        store: "input/task_parameters.json"

    optional:
      - key: control_level
        label: "交易后控制权程度"
        type: select
        options:
          - { value: full, label: "全部控制 (100%)" }
          - { value: majority, label: "多数控制 (>50%)" }
          - { value: minority_board, label: "少数股权但有董事席位" }
          - { value: minority_passive, label: "少数被动投资 (无控制权)" }
        store: "input/task_parameters.json"

      - key: deal_documents
        label: "交易文件/条款清单"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：XX公司收购美国YY企业CFIUS风险评估"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/overseas-investment-cfius"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的交易信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 交易双方基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解交易结构和 TID 关联性
    - 根据合规清单制定 CFIUS 审查评估执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 管辖范围判定 (Covered Transaction) → `output/covered_transaction_analysis.md`
    b. TID 业务线映射 → `output/tid_business_mapping.md`
    c. 国家安全风险因素分析 → `output/national_security_risk_factors.md`
    d. 申报类型判定 (强制声明 vs 自愿通知) → `output/filing_type_determination.md`
    e. 缓释措施预评估 → `output/mitigation_measures_preassessment.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证 TID 分类准确性
    - 确认申报类型判定有据
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成 CFIUS 国家安全审查评估报告 → `reports/cfius_assessment.docx`
    - 报告必须包含：执行摘要、交易概述、CFIUS管辖分析、TID业务线分析、国家安全风险评估（分级）、申报策略建议、缓释措施预方案、时间线

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - CFIUS 审查无明确法定截止期限，实际需预留 3-6 个月
    - 涉及外国政府投资者的交易面临更严格审查

  report_template:
    format: docx
    sections:
      - executive_summary
      - transaction_overview
      - cfius_jurisdiction
      - tid_analysis
      - national_security_risk
      - filing_strategy
      - mitigation_plan
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_jurisdiction
      label: "管辖范围判定"
      progress: 15
    - name: do_tid
      label: "TID 业务分析"
      progress: 25
    - name: do_risk
      label: "国家安全风险评估"
      progress: 25
    - name: check
      label: "质量审查"
      progress: 15
    - name: act
      label: "报告生成"
      progress: 10
