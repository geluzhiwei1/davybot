platform: medium
display_name: Medium
version: 0.1.0
capability:
  publish: browser
  publish_modes:
  - direct
  trending: none
  metrics: none
constraints:
  char_limit: 200000
  max_files: 20
  max_video_seconds: 0
  rich_text: true
domains:
- medium.com
publish:
  compose_url: https://medium.com/new-story
  selectors:
    # v0.1.0 未真机验证:Medium 编辑器=整页 contenteditable 段落流,首段 h3=标题;
    # 无显式存草稿按钮(autosave),故只有 direct(Publish);富文本走剪贴板粘贴
    title_input:
      primary: "section[contenteditable='true'] h3, h3.graf--title"
      fallback: "[data-paragraph-id]:first-child"
      wait_timeout_ms: 20000
    compose_box:
      primary: "section[contenteditable='true']"
      fallback: ".graf--after--title"
      wait_timeout_ms: 20000
    publish_button:
      primary: button:has-text("Publish")
      fallback: "[data-action='show-prepublish']"
      wait_after_click_ms: 5000
    media_upload:
      primary: input[type="file"]
      max_files: 20
    success_indicator:
      method: url_change
      pattern: /p/
  rich_text:
    enabled: true
    content_format: html_semantic
    inject_method: clipboard_paste
    image_handling: file_upload
    style:
      heading_style: 'margin: 1.2em 0 0.6em; font-weight: bold;'
      paragraph_style: 'margin: 0.8em 0; line-height: 1.75;'
      blockquote_style: 'margin: 1em 0; padding: 0.5em 1em; border-left: 4px solid #ccc; color: #666;'
      list_style: 'margin: 0.8em 0; padding-left: 2em;'
  login_check:
    url: https://medium.com/new-story
    indicator: "section[contenteditable='true'], [data-paragraph-id]"
    absent_indicator: "a[href*='m/signin']"
    wait_timeout_ms: 15000

# 地理/语种维度(多国家运营过滤;countries=主市场 ISO-2,global 区域平台各国通行)
geo:
  region: global
  countries:
  - US
  - GB
  - IN
  - CA
  languages:
  - en
  - es
  - fr
  - de
  - pt
  - it
  - ja
  - ko
  - zh
