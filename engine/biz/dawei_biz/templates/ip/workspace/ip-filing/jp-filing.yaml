template:
  slug: jp-filing
  name: "日本专利申请策略"
  version: "1.0"
  module: ip-filing
  team_slug: ip-filing

  description: |
    向 JPO（日本特許庁）提交专利申请的完整策略规划。
    包含申请类型选择、费用减免、加速审查（スーパー早い審査）、实用新案策略。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "请输入发明名称"
        store: "input/task_params.json"
      - key: application_type
        label: "申请类型"
        type: select
        default: "patent"
        options:
          - { value: "patent", label: "特許（发明专利）" }
          - { value: "utility_model", label: "実用新案（实用新型）" }
          - { value: "design", label: "意匠（外观设计）" }
        store: "input/task_params.json"
    optional:
      - key: applicant_type
        label: "申请人类型"
        type: select
        default: "large"
        options:
          - { value: "large", label: "大企业（全额）" }
          - { value: "sme", label: "中小企业（减免50-66%）" }
          - { value: "individual", label: "个人/小微企业（减免66-75%）" }
          - { value: "university", label: "大学/研究机构（减免50%）" }
        store: "input/task_params.json"
      - key: acceleration
        label: "加速策略"
        type: select
        default: ""
        options:
          - { value: "", label: "普通审查（约12-18个月）" }
          - { value: "super_express", label: "スーパー早い審査（超级加速，约2个月）" }
          - { value: "fast_track", label: "早い審査（加速审查，约6个月）" }
          - { value: "pph", label: "PPH（基于外国审查结果）" }
        store: "input/task_params.json"
      - key: has_foreign_priority
        label: "外国优先权"
        type: select
        default: ""
        options:
          - { value: "", label: "无" }
          - { value: "yes", label: "有优先权申请" }
        store: "input/task_params.json"
      - key: divisional_app
        label: "分割出願"
        type: string
        placeholder: "是否为分割申请"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/filing-requirements"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游申请书继承的文件"
    - dir: input/checklists
      description: "申请要求清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "完整策略方案"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入日本专利申请策略规划工作区，请按照 PDCA 工作流执行。

    ## JPO 申请核心规则

    ### 申请类型与保护期
    | 类型 | 审查制 | 平均授权周期 | 保护期 |
    |------|--------|-------------|--------|
    | 特許（发明） | 实质审查 | 12-18 月 | 申请日起20年（医药可延长5年） |
    | 実用新案（实用新型） | 无实审（形式审查） | 6 月 | 申请日起10年 |
    | 意匠（外观设计） | 实质审查 | 6-12 月 | 注册日起25年 |

    ### 实质审查请求
    - **必须在申请日起 3 年内**提出实质审查请求
    - 审查费按权利要求数计算：¥4,800 + ¥3,800/项（超1项）
    - 任何人可提出审查请求（不只限申请人）

    ### 减免政策
    | 申请人类型 | 减免比例 | 条件 |
    |-----------|---------|------|
    | 个人/小微企业 | 66-75% | 资本金≤¥50M 或个人 |
    | 中小企业 | 50-66% | 资本金≤¥300M |
    | 大学/研究机构 | 50% | 符合认定条件 |
    | 大企业 | 0% | — |

    ### 加速审查途径
    1. **スーパー早い審査（超级加速审查）**：
       - 目标：2 个月内发出首次 OA
       - 条件：已有外国对应申请在审查中 + 已实施或即将实施
       - 费用：免费（需提交加速理由说明）
    2. **早い審査（加速审查）**：
       - 目标：6 个月内发出首次 OA
       - 条件：已有外国对应申请在审查中/实施相关发明
    3. **PPH**：基于外国审查正面结果，可加速

    ### JPO 官费参考（特許，大企业）
    - 申请费（在线）：¥15,000
    - 申请审查费：¥152,000（含审查手续费¥4,800 + 权利要求附加费）
    - 年费：第1-3年 ¥2,100/年 → 逐年递增 → 第20年 ¥73,800/年
    - 授权登记费：¥30,000

    ### 日本专利特点
    - **权利要求附加费高**：每增加一项权利要求加收 ¥3,800，鼓励精简权利要求
    - **记载要件严格**：实施例需充分支持权利要求范围
    - **信息提供制度**：任何人可向审查员提供相关现有技术信息（免费）
    - **授权后修正**：授权后有严格的修正限制（仅缩小范围、订正笔误、明确化）

    ## 输入数据
    1. `input/task_params.json` — 发明名称、申请类型、申请人类型、加速策略
    2. `input/inherited/` — 专利草案/申请书

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 确认申请类型、申请人资格、加速可行性
    ### Do: 申请时间线 + 费用预算（含减免计算）+ 权利要求数量优化建议
    ### Check: 核对申请要求清单、3年实质审查请求期限、权利要求附加费计算
    ### Act: 生成完整策略方案

  deliverables:
    - file: "drafts/jp_filing_strategy.md"
      name: "日本专利申请策略方案"
      format: markdown
    - file: "output/filing_timeline.md"
      name: "申请时间线"
      format: markdown
    - file: "output/fee_breakdown.md"
      name: "费用明细（含减免计算）"
      format: markdown

  phases:
    - name: plan
      label: "分析申请需求"
      progress: 15
    - name: do_strategy
      label: "制定申请策略"
      progress: 30
    - name: do_fees
      label: "费用预算"
      progress: 25
    - name: check
      label: "核验清单"
      progress: 20
    - name: act
      label: "输出方案"
      progress: 10
