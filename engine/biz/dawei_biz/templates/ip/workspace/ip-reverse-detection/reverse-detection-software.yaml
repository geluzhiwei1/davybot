template:
  slug: reverse-detection-software
  name: "AI/软件反向侵权探测"
  version: "1.0"
  module: ip-reverse-detection
  team_slug: ip-reverse-detection

  description: |
    针对AI/软件类专利的反向侵权探测。
    检测市场上AI产品、算法、软件服务是否侵犯我方软件/算法专利权。
    针对软件专利"黑盒"特性，结合API分析、开源代码对比、论文比对、性能推断等多路径取证，
    逐项对比权利要求与疑似侵权软件特征，生成侵权分析报告、权利要求对比表、证据链和警告函草稿。
    特别处理Alice/Mayo可专利性、112(f)手段-功能限定、云服务多方侵权等软件专利特有问题。

  data_requirements:
    required:
      - key: patent_numbers
        label: "我方专利号"
        type: string
        placeholder: "如：CN1234567A, US9876543B2（逗号分隔，支持多件）"
        store: "input/task_params.json"
      - key: suspected_product
        label: "疑似侵权软件/AI产品"
        type: string
        placeholder: "描述疑似侵权的软件/AI产品、算法、服务"
        store: "input/task_params.json"
    optional:
      - key: algorithm_type
        label: "算法类型"
        type: select
        default: ""
        options:
          - { value: "", label: "不限/不确定" }
          - { value: "ML", label: "机器学习（ML）" }
          - { value: "DL", label: "深度学习（DL）" }
          - { value: "NLP", label: "自然语言处理（NLP）" }
          - { value: "CV", label: "计算机视觉（CV）" }
          - { value: "推荐系统", label: "推荐系统" }
          - { value: "搜索", label: "搜索" }
          - { value: "数据挖掘", label: "数据挖掘" }
        store: "input/task_params.json"
      - key: detection_method
        label: "首选探测方法"
        type: select
        default: ""
        options:
          - { value: "", label: "全部方法综合" }
          - { value: "API分析", label: "API分析" }
          - { value: "SDK逆向", label: "SDK逆向" }
          - { value: "开源代码分析", label: "开源代码分析" }
          - { value: "论文对比", label: "论文对比" }
          - { value: "性能测试推断", label: "性能测试推断" }
        store: "input/task_params.json"
      - key: open_source_check
        label: "是否需要检查开源仓库"
        type: select
        default: "否"
        options:
          - { value: "否", label: "否" }
          - { value: "是-需检查开源仓库", label: "是-需检查开源仓库" }
        store: "input/task_params.json"
      - key: jurisdiction
        label: "侵权判定管辖地"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国（全面覆盖+等同原则）" }
          - { value: "US", label: "美国（Literal+Doctrine of Equivalents）" }
          - { value: "EP", label: "欧洲（Article 69 + Protocol）" }
          - { value: "JP", label: "日本（均等论）" }
        store: "input/task_params.json"
      - key: evidence_available
        label: "已有证据"
        type: select
        default: ""
        options:
          - { value: "", label: "暂无" }
          - { value: "product", label: "已购买对方产品" }
          - { value: "marketing", label: "对方宣传资料/网站" }
          - { value: "patents", label: "对方专利/论文" }
          - { value: "mixed", label: "多种来源" }
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/infringement-analysis"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案/专利文件继承的文件"
    - dir: input/checklists
      description: "侵权分析检查清单"
    - dir: output
      description: "Agent 产出"
    - dir: drafts
      description: "探测报告"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入 AI/软件反向侵权探测工作区，请按照 PDCA 工作流执行。
    本工作区专门针对软件、AI算法、数据驱动服务的专利反向侵权探测，需特别处理算法黑盒、多方侵权、可专利性等软件特有问题。

    ## 软件专利侵权判定核心原则

    ### 1. 全面覆盖原则（Literal Infringement / 字面侵权）
    - 被控侵权软件**实现**权利要求中记载的**所有**技术特征
    - 缺少任何一个技术特征 → 不构成字面侵权
    - 多于权利要求的技术特征 → 仍可能构成字面侵权
    - 对软件而言：方法步骤、数据结构、算法流程、系统组件均需逐一比对

    ### 2. 等同原则（Doctrine of Equivalents / 等同侵权）
    - 被控软件的技术特征与权利要求特征**实质相同**
    - 判断维度：方式（Way）-功能（Function）-效果（Result）
    - 软件等同常见情形：
      - 算法变体（如：CNN vs Transformer 实现同一功能时可能不等同；但同族变体可能等同）
      - 数据结构替换（如：数组 vs 链表实现相同逻辑功能）
      - 部署架构变化（如：本地 vs 云端，单体 vs 微服务）
    - 美国限缩：检举禁止（Prosecution History Estoppel）、贡献原则

    ### 3. 各管辖地判定方法
    | 管辖地 | 主要原则 | 软件专利特别注意 |
    |--------|---------|----------------|
    | 中国 | 全面覆盖+等同 | 《专利审查指南》第二部分第九章：涉及计算机程序的发明专利审查标准；商业规则+算法结合的可专利性 |
    | 美国 | Literal + DOE | Alice/Mayo 两步法（101）；112(f)手段-功能限定；Akamai 多方侵权 |
    | 欧洲 | Article 69 + Protocol | EPO 技术特征效应（Technical Character）；软件"进一步技术效果"要求 |
    | 日本 | 均等论+目的论 | 软件相关发明审查指南；"利用自然规律"要件 |

    ## 软件/AI 专利权利要求拆解

    ### Step 1: 识别权利要求类型并分类拆解
    软件专利通常包含三类权利要求，需分别拆解和比对：

    #### A. 方法权利要求（Method Claims）
    - 拆解为**步骤序列**：步骤1 → 步骤2 → 步骤3...
    - 标注：步骤顺序是否限定（"comprising" vs "consisting of"）
    - 识别：数据流向（输入 → 处理 → 输出）
    - 识别：算法特征（公式、模型、阈值、训练过程）

    #### B. 系统/装置权利要求（System/Apparatus Claims）
    - 拆解为**组件列表**：模块A、模块B、模块C...
    - 标注：组件间的连接/通信关系
    - 注意：是否使用"means for"（112(f)）功能性限定
    - 云端部署考虑：组件可能分布于客户端、服务端、CDN等多方

    #### C. 计算机可读存储介质权利要求（CRM Claims）
    - 拆解为：介质 + 指令集合
    - 美国需注意：transitory signal（暂态信号）类已被排除（2010年In re Nuijten）
    - 中国：通常以"一种计算机可读存储介质"形式撰写

    ### Step 2: 标注技术特征类型
    对每个拆解出的特征，标注：
    - **方法步骤特征**：处理动作、转换操作、判定逻辑
    - **数据结构特征**：数据格式、字段定义、schema
    - **算法特征**：模型类型、训练方式、推理流程、数学公式
    - **系统组件特征**：模块、服务、接口、存储
    - **功能性限定（112(f)）**：以"means for"/"配置为"等功能语言描述
    - **参数特征**：阈值、范围、超参数

    ## AI/算法检测的"黑盒"难题

    ### 核心挑战
    与传统机械/电子专利不同，软件/AI专利的侵权特征**通常不可直接观察**：
    - 算法在服务器端运行，外部无法直接观测
    - 模型权重、训练数据属于商业秘密
    - API仅暴露输入/输出，不暴露中间处理逻辑
    - 开源代码可能与商用版本不一致

    ### 应对策略矩阵
    | 探测路径 | 可观察性 | 证据强度 | 适用情形 |
    |---------|---------|---------|---------|
    | API 文档/行为分析 | 中（I/O可见） | 中 | SaaS服务、开放API |
    | SDK 逆向 | 高（可反编译） | 高 | 提供SDK/客户端 |
    | 开源代码分析 | 高 | 中-高（需证明商用版本） | 有开源仓库 |
    | 论文/博客对比 | 中 | 中 | 有技术团队公开内容 |
    | 性能基准测试 | 低-中 | 中 | 专利技术有独特性能曲线 |
    | 模型架构推断 | 低 | 低-中 | 公开demo、模型可视化 |
    | 数据管线分析 | 中 | 中 | 涉及数据处理流程 |

    ## 软件/AI 特定探测方法

    ### 方法 1: API / SDK 文档分析
    - 收集被控方公开的 API 文档、SDK 文档、开发者指南
    - 比对：API 端点命名、参数结构、返回字段、错误码
    - 比对：SDK 调用流程、初始化参数、回调机制
    - 测试：构造特定输入，观察输出特征（指纹化）
    - 工具：Swagger/OpenAPI 规范解析、Postman、Burp Suite

    ### 方法 2: SDK 逆向 / 客户端反编译
    - **Java/Kotlin**：JAD、JD-GUI、CFR、Procyon 反编译
    - **C#/.NET**：ILSpy、dotPeek、dnSpy 反编译
    - **Python**：直接查看 .pyc 字节码（uncompyle6）、打包文件解包（PyInstaller））
    - **JavaScript/TypeScript**：source map 还原、Webpack bundle 分析
    - **iOS**：class-dump、Hopper、IDA Pro
    - **Android**：jadx、apktool、Frida 动态 hook
    - 注意：服务端代码通常无法获取，仅客户端可逆向
    - 法律风险：需评估 EULA、反规避法律（DMCA 1201、中国《著作权法》）

    ### 方法 3: 开源代码仓库分析
    - 搜索：GitHub、GitLab、Gitee、Bitbucket
    - 关键词：被控方公司名、产品名、核心算法名、专利发明人姓名
    - 比对：算法实现代码与权利要求技术特征
    - 注意：
      - 开源版本可能是简化版/教学版，商用版本可能不同
      - 需证明开源仓库与商用产品的对应关系（commit message、release notes、公司博客引用）
      - 注意许可证条款（GPL/AGPL 可能暗示商用版本采用相同代码）

    ### 方法 4: 技术论文 / 博客对比
    - 搜索：被控方工程师/研究员发表的论文（arXiv、ACL、CVPR、NeurIPS、KDD）
    - 搜索：公司技术博客（Medium、公司 engineering blog、知乎专栏、微信公众号）
    - 搜索：技术大会演讲资料（slides、视频 transcript）
    - 比对：论文中描述的算法与权利要求技术特征
    - 注意：论文可能是研究版本，商用产品可能有差异；但可作为等同侵权证据

    ### 方法 5: 性能基准测试推断
    - 当专利技术具有**独特的性能特征曲线**时适用
    - 例：某种特定的训练加速比、推理延迟-精度权衡曲线、内存占用模式
    - 方法：对被控产品进行标准化基准测试，比对性能特征
    - 局限：仅能推断"使用了类似技术"，无法精确证明具体算法

    ### 方法 6: 模型架构推断（从公开 demo）
    - 通过公开 demo / playground 观察模型行为特征
    - 关注：输出格式、错误模式、提示词响应规律
    - 关注：是否暴露模型元信息（model card、config.json）
    - 关注：HuggingFace、TensorFlow Hub、ONNX Model Zoo 上的模型发布
    - 工具：Netron（模型结构可视化）、model cards 解析

    ### 方法 7: 数据管线分析
    - 涉及数据处理、特征工程、ETL 的专利适用
    - 观察：被控方公开的数据格式、schema、字段命名
    - 观察：训练数据集声明（data cards、datasheets）
    - 比对：数据预处理流程是否与权利要求一致

    ## 逐项特征对比矩阵
    对每个技术特征构建对比矩阵：

    | 权利要求特征 | 特征类型 | 被控软件对应特征 | 探测方法 | 字面侵权？ | 等同侵权？ | 证据强度 | 备注 |
    |-------------|---------|----------------|---------|-----------|-----------|---------|------|

    评分标准：
    - **确认匹配**：开源代码/SDK反编译/官方文档直接显示该特征存在
    - **高度可能**：API行为、论文描述可合理推断该特征存在
    - **可能匹配**：性能特征或demo行为部分支持，需进一步调查
    - **信息不足**：服务端算法无法观测，需法院禁令取证
    - **不匹配**：公开信息显示该特征不存在

    ## 侵权概率评级
    | 等级 | 标准 | 建议行动 |
    |------|------|---------|
    | 高（>70%） | 所有特征确认匹配或高度可能 | 准备警告函/申请证据保全 |
    | 中（40-70%） | 部分特征可能匹配，存在等同可能 | 补充逆向分析/开源调查 |
    | 低（<40%） | 关键特征不匹配或服务端黑盒无法穿透 | 持续监控/放弃 |

    ## 软件专利特殊法律问题

    ### 1. Alice/Mayo 框架（美国 35 U.S.C. § 101）
    评估我方专利有效性时必须考虑：
    - **Step 1**：是否涉及司法排除客体（抽象概念、自然规律、自然现象）——纯算法/商业方法通常属于
    - **Step 2**：是否包含"创造性概念"（inventive concept）足以使 claim 不会被简单理解为排除客体
    - 影响：若专利有效性存疑，侵权主张的谈判筹码大幅下降
    - 应对：在报告中评估涉案权利要求通过 Alice 测试的可能性

    ### 2. Means-Plus-Function 限定（35 U.S.C. § 112(f)）
    - 当权利要求使用"means for"等通用功能性语言时，美国法下保护范围**限于说明书披露的具体结构及其等同**
    - 影响：保护范围可能比字面更窄
    - 应对：识别权利要求中的功能性限定，比对说明书披露的对应结构
    - 中国：等同司法解释第 8 条对此有类似规定

    ### 3. 多方分摊侵权（Divided Infringement）
    云端/SaaS 服务常见情形：单一权利要求的各步骤由不同主体执行
    - 美国 Akamai 框架：
      - **共同侵权（Joint Infringement）**：一方指挥控制另一方（mastermind）
      - **代位侵权（Vicarious）**：一方与另一方有代理关系
    - 中国：通常需要单一主体实施全部步骤，多方场景证明难度高
    - 应对：识别被控服务的架构，确定侵权步骤的实际执行方（云厂商 vs SaaS 提供商 vs 终端用户）

    ### 4. 跨境软件服务管辖问题
    - 软件服务跨境提供（云端部署、全球访问）带来管辖权挑战
    - 美国：服务器所在地、主要客户所在地、决策地均可能成为连接点
    - 中国：被控侵权行为发生地、侵权结果发生地
    - 应对：在报告中明确可能的诉讼管辖地，并分析各地法律差异

    ## 证据保全建议（软件特有）

    ### 1. API 调用日志保全
    - 使用带时间戳的工具记录 API 请求/响应（Postman、curl + tee）
    - 公证处见证 API 调用过程
    - 区块链存证（Factom、保全网、易保全）固化调用记录
    - 保存：完整 request/response headers、body、时间戳、网络路径

    ### 2. SDK 反编译证据保全
    - 工具：JAD（Java）、ILSpy（C#/.NET）、jadx（Android）、uncompyle6（Python）
    - 流程：
      - 公证购买/下载 SDK（保留原始下载链接、版本号、SHA256）
      - 公证反编译过程（公证员见证或在可信第三方环境执行）
      - 输出：反编译源码 + 原始二进制 + 工具版本 + 操作时间
    - 法律风险提示：评估 EULA 条款、DMCA §1201 反规避条款、中国《著作权法》技术措施保护

    ### 3. 网页抓取与时间戳
    - 工具：wget --mirror、Wayback Machine（archive.org）、HAR 文件（浏览器导出）
    - 公证网页保全（公证员现场操作截图）
    - 时间戳固化：可信时间戳服务（TSA）、区块链存证
    - 注意：保留完整 HTTP 响应、TLS 证书信息

    ### 4. 性能测试数据保全
    - 测试环境标准化（硬件规格、OS、依赖版本固定）
    - 多次重复测试（统计显著性）
    - 第三方检测机构出具报告（CNAS/CMA 资质）

    ## 证据链构建
    - **直接证据**：SDK反编译源码、开源仓库代码、官方技术文档
    - **间接证据**：API行为指纹、论文描述、性能基准曲线、demo输出特征
    - **时间线**：对方产品发布时间 vs 我方专利公开时间 vs 开源仓库commit时间
    - **一致性证明**：开源代码 → 官方博客引用 → 产品文档 → API行为 的相互印证

    ## 输入数据
    1. `input/task_params.json` — 专利号、疑似软件、算法类型、探测方法、管辖地
    2. `input/inherited/` — 专利全文/权利要求（如有）
    3. `input/checklists/` — 侵权分析检查清单

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 拆解软件专利三类权利要求（方法/系统/CRM），识别黑盒特征，确认管辖地判定标准与 Alice 有效性风险
    ### Do:
    - 收集被控软件公开信息（API文档、SDK、开源仓库、论文、博客、demo）
    - 按探测方法矩阵选择合适路径执行调查
    - 构建特征对比矩阵（方法步骤、系统组件、介质指令分别分析）
    - 评估字面侵权和等同侵权可能性
    - 处理多方侵权、跨境管辖等特殊问题
    - 构建证据链并执行证据保全
    ### Check: 交叉验证各探测路径结果，标记证据缺口与黑盒穿透难点，评估 Alice 风险与侵权概率
    ### Act: 生成探测报告 + 权利要求对比表 + 证据链目录 + 警告函草稿

  deliverables:
    - file: "drafts/infringement_report.md"
      name: "AI/软件反向侵权探测报告"
      format: markdown
    - file: "output/claim_chart.md"
      name: "权利要求对比表（Claim Chart）"
