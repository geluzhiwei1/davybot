  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入 电子/通信反向侵权探测工作区，请按照 PDCA 工作流执行。
    本工作区专门针对芯片、通信设备、消费电子、IoT、电源/功率器件等电子/通信类专利的反向侵权探测，
    需特别处理内部结构不可直接观察、标准必要专利（SEP）、网络分摊侵权等电子/通信专利特有问题。

    ## 电子/通信专利侵权判定核心原则

    ### 1. 全面覆盖原则（Literal Infringement / 字面侵权）
    - 被控侵权电子产品**包含**权利要求中记载的**所有**技术特征
    - 缺少任何一个技术特征 → 不构成字面侵权
    - 多于权利要求的技术特征 → 仍可能构成字面侵权
    - 对电子而言：电路拓扑、信号处理步骤、协议层、组件参数均需逐一比对

    ### 2. 等同原则（Doctrine of Equivalents / 等同侵权）
    - 被控电子产品的技术特征与权利要求特征**实质相同**
    - 判断维度：方式（Way）-功能（Function）-效果（Result）
    - 电子等同常见情形：
      - 电路拓扑变体（如：分立器件 vs 集成方案实现相同功能时可能等同）
      - 信号处理算法等价（如：FIR vs IIR 在相同应用场景下可能等同）
      - 协议层映射变体（如：不同信令格式实现相同通信功能）
      - 工艺/器件替换（如：Si CMOS vs GaN 在相同电路拓扑中可能等同）
    - 美国限缩：检举禁止（Prosecution History Estoppel）、贡献原则

    ### 3. 各管辖地判定方法
    | 管辖地 | 主要原则 | 电子/通信专利特别注意 |
    |--------|---------|----------------------|
    | 中国 | 全面覆盖+等同 | 《专利审查指南》第二部分第九章、第十一章；电路/通信方法的可专利性；SEP 国家标准 GB/T 39551 系列 |
    | 美国 | Literal + DOE | 112(f)手段-功能限定（电路 means）；Akamai 多方侵权；Ericsson v. D-Link 等 SEP 许可费率案例 |
    | 欧洲 | Article 69 + Protocol | EPO 技术特征效应；SEP/FRAND：Huawei v. ZTE（CJEU C-170/13）程序框架 |
    | 日本 | 均等论+目的论 | 电子电路相关发明审查基准；SEP 许可：Apple v. Samsung（平成23年ワ第30139号） |

    ## 电子/通信专利权利要求拆解

    ### Step 1: 识别权利要求类型并分类拆解
    电子/通信专利通常包含以下几类权利要求，需分别拆解和比对：

    #### A. 电路/装置权利要求（Circuit/Apparatus Claims）
    - 拆解为**电路拓扑**：放大器、滤波器、混频器、ADC/DAC、电源管理...
    - 标注：器件型号、参数（阻值/容值/工作频率/电压）
    - 识别：器件间的连接关系（串联/并联/反馈/级联）
    - 识别：是否使用"means for"等功能性限定（112(f)）

    #### B. 信号处理方法权利要求（Signal Processing Claims）
    - 拆解为**处理步骤序列**：采样 → 滤波 → 变换（FFT/DCT）→ 量化 → 编码...
    - 标注：每步的输入/输出信号、处理参数
    - 识别：算法特征（调制方式、编码方案、纠错码、压缩算法）
    - 识别：硬件加速器/DSP/固件实现方式

    #### C. 通信协议/系统权利要求（Protocol/System Claims）
    - 拆解为**协议栈层**：PHY（物理层）、MAC（介质访问控制）、RLC、PDCP、RRC、应用层
    - 标注：每层的处理逻辑、信令、帧结构
    - 识别：多用户/多链路/多节点协同流程
    - 识别：发送端/接收端/网络设备/终端设备分别执行的特征

    #### D. 器件/工艺权利要求（Device/Process Claims）
    - 拆解为**器件结构**：半导体层、栅极结构、掺杂区、接触孔...
    - 标注：材料组成、尺寸范围、工艺参数
    - 识别：制造工艺步骤（外延、光刻、刻蚀、注入、退火）

    ### Step 2: 标注技术特征类型
    对每个拆解出的特征，标注：
    - **电路拓扑特征**：器件连接关系、信号通路、反馈环路
    - **信号处理特征**：采样、滤波、变换、调制、编码、解码步骤
    - **协议层特征**：帧结构、信令、握手流程、状态机
    - **组件参数特征**：工作频率、电压、功耗、增益、噪声系数、灵敏度
    - **器件结构特征**：层结构、材料、尺寸、布局
    - **功能性限定（112(f)）**：以"means for"/"用于"/"配置为"等功能语言描述

    ## 电子产品的"黑盒"难题

    ### 核心挑战
    与软件专利类似，电子产品的侵权特征**通常不可直接观察**：
    - 芯片封装后内部电路不可见，需 decapping/拆解
    - 通信协议在芯片/固件内部执行，外部仅能通过信号抓包观察
    - DSP/算法在硬件中执行，无法直接查看代码
    - 器件工艺需 SEM/TEM 横截面分析才能确认
    - BOM/物料清单不一定公开

    ### 应对策略矩阵
    | 探测路径 | 可观察性 | 证据强度 | 适用情形 |
    |---------|---------|---------|---------|
    | 芯片拆解/逆向（Decapping） | 高 | 高 | IC/芯片产品 |
    | 信号抓取分析 | 中-高 | 中-高 | 通信设备、消费电子 |
    | 协议一致性测试 | 中-高 | 高 | 标准相关产品（5G/WiFi/BT） |
    | 规格书/Datasheet 对比 | 中 | 中 | 商用 IC、模块 |
    | 射频参数测量 | 高 | 中-高 | 无线通信、射频前端 |
    | BOM 分析 | 中 | 中 | 整机产品 |
    | 公开文档/论文 | 低-中 | 中 | 算法、架构特征 |

    ## 电子/通信特定探测方法

    ### 方法 1: 芯片拆解/逆向（IC Teardown）
    - **Decapping / 开盖**：化学/机械方法去除封装，露出 die
    - **Die photography**：光学显微镜、电子显微镜（SEM）拍摄 die 表面
    - **Circuit extraction**：去除金属层逐层拍照，重建电路原理图
    - **专业服务商**：
      - TechInsights（加拿大，全球最大）
      - Chipworks（已并入 TechInsights）
      - System Plus Consulting（法国，Yole 集团）
      - iFixit（消费电子拆解）
      - 微电子所/集成电路实验室（国内）
    - **成本与时间**：完整芯片逆向报告通常 $10K-$100K+，周期数周至数月
    - **可获取信息**：
      - die 显微照片、版图布局
      - 电路原理图重建（数字电路较难，模拟/射频较易）
      - 工艺节点估算（特征尺寸、层数）
      - 存储器类型/容量、处理器架构
    - **法律风险**：通常合法（购买后拆解），但需注意 EULA、商业秘密法

    ### 方法 2: 信号抓取分析（Signal Capture）
    - **频域分析**：频谱分析仪（Keysight/R&S/Anritsu），测量频谱、带宽、占用带宽、邻道泄漏（ACLR）
    - **时域分析**：示波器（Tektronix/Keysight/LeCroy），捕获波形、眼图、抖动
    - **协议解码**：
      - Wireshark / AirPcap（IP/以太网/WiFi）
      - USB 协议分析仪（Total Phaseysics Beagle）
      - PCIe 分析仪（Teledyne LeCroy）
      - I2C/SPI/UART 逻辑分析仪（Saleae）
      - MIPI 分析仪
      - 5G/LTE 信令分析仪（Temds/Qualcomm QXDM/R&S CMW500）
    - **获取信息**：调制方案、帧结构、信令流程、时序、协议层行为
    - **适用情形**：通信设备、消费电子、IoT 节点、车载总线

    ### 方法 3: 协议一致性测试（Conformance Testing）
    - **3GPP 标准**（5G NR / LTE / NB-IoT）：
      - 3GPP TS 38.521-1/2/3（5G NR RF 一致性）
      - 3GPP TS 38.523-1/2/3（5G NR 协议一致性）
      - 测试设备：R&S CMW500/CMX500、Anritsu MT8000A、Keysight UXM
    - **WiFi 标准**（IEEE 802.11 a/b/g/n/ac/ax/be）：
      - Wi-Fi Alliance 认证测试（PTA、TA）
      - IEEE 802.11 标准 PHY/MAC 一致性
    - **Bluetooth 标准**（BR/EDR/LE）：
      - Bluetooth SIG Profile Tuning Suite（PTS）
    - **适用情形**：标准必要专利（SEP）相关的所有电子产品
    - **关键意义**：通过标准一致性测试 → 强力推定使用标准技术 → SEP 侵权核心证据

    ### 方法 4: 规格书 / Datasheet 对比
    - **Pinout（引脚定义）**：引脚命名、封装、功能映射
    - **Block Diagram（框图）**：内部功能模块划分、信号通路
    - **Timing Diagram（时序图）**：时钟、控制信号、数据时序关系
    - **Electrical Characteristics（电气参数）**：工作电压、电流、功耗、温度范围
    - **Register Map（寄存器映射）**：配置寄存器、状态寄存器
    - **Reference Design（参考设计）**：典型应用电路
    - **获取来源**：厂商官网、Digi-Key/Mouser/贸泽等分销商、eeFocus/21ic/EEVblog 等论坛
    - **适用情形**：商用 IC、模块、电源管理芯片、传感器

    ### 方法 5: 射频参数测量（RF Parameter Measurement）
    - **频率参数**：工作频段、信道带宽、中心频率、频率误差
    - **调制参数**：调制方式（QPSK/16QAM/64QAM/256QAM/1024QAM）、调制误差率（MER）、EVM（误差矢量幅度）
    - **功率参数**：最大输出功率、功率控制范围、ACLR、频谱发射模板（SEM）
    - **接收机参数**：灵敏度、邻道选择性、阻塞、动态范围
    - **天线参数**：增益、方向图、驻波比（VSWR）、隔离度（MIMO）
    - **设备**：频谱仪、矢量信号分析仪（VSA）、网络分析仪（VNA）、信号源、信道模拟器
    - **适用情形**：手机、基站、WiFi 路由器、蓝牙耳机、射频前端模块、雷达

    ### 方法 6: BOM（Bill of Materials）分析
    - **拆解报告**：iFixit、TechInsights 拆机报告列出关键芯片型号
    - **BOM 数据库**：TechInsights Component Library、Counterpoint、IHS Markit
    - **关键芯片追溯**：通过芯片型号查找 datasheet、专利文件，确认是否侵权
    - **适用情形**：整机产品（手机、基站、IoT 设备），需识别关键芯片厂商

    ## 标准必要专利（SEP）特殊处理

    ### 1. SEP 识别与声明检索
    - **ETSI IPR Online Database**：https://ipr.etsi.org
      - 检索 5G/LTE/NB-IoT 相关标准声明
      - 声明格式：专利号 + 标准条款号 + 是否 Essential
    - **IEEE-SA Patents Declaration**：https://standards.ieee.org
      - WiFi（802.11 系列）、以太网（802.3 系列）相关声明
    - **ITU-T/ITU-R Patent Statement**：https://www.itu.int
      - 视频/音频编码（H.264/H.265/AV1）、无线电规则相关
    - **3GPP门户网站**：检索 meeting contributions、TDocs，确认标准发展脉络
    - **中国标准信息公共服务平台**：GB/T 39551（SEP 许可谈判）相关国标

    ### 2. FRAND（公平、合理、无歧视）原则
    - **核心要求**：SEP 权利人不得拒绝许可，许可条件需 FRAND
    - **核心判例**：
      - 美国：Ericsson v. D-Link（Fed. Cir. 2014）；TCL v. Ericsson（2018）；HTC v. Ericsson（2019）
      - 欧洲：Huawei v. ZTE（CJEU C-170/13, 2015）— 谈判通知、报价、反报价的程序框架
      - 中国：华为 v. 三星（2016）；OPPO v. 夏普（2020）；华为 v. VeriSolar/Conversant（2019-2021）
      - 日本：Apple v. Samsung（2014）；Intel v. Broadcom
    - **FRAND 许可费率方法**：
      - SSPPU（最小可销售单元）：以基带芯片而非整机计算费率（美国 Qualcomm 案例反向）
      - 整机费率（EMVR）：以整机售价为基数（Qualcomm 主张，争议大）
      - 自上而下法（Top-Down）：先确定标准总体费率，再按专利份额分配
    - **影响**：SEP 侵权主张需配套 FRAND 许可谈判，禁令救济受限

    ### 3. Claim Chart 映射到标准规范
    - 将权利要求技术特征**逐项映射**到标准文档条款号
    - 标准文档：
      - 3GPP TS 38.201-38.217（5G NR 物理层）、TS 38.300（5G NR 总体描述）
      - IEEE 802.11-2020（WiFi 标准）
      - Bluetooth Core Specification 5.x
    - 映射示例：
      | 权利要求特征 | 标准条款号 | 标准文本 | 被控产品对应实现 |
      |-------------|-----------|---------|----------------|
    - **意义**：完成 claim chart → standard mapping 即可证明 SEP 侵权核心
      - 被控产品通过标准一致性测试 → 推定实施标准 → 实施标准即实施 SEP

    ### 4. SEP 反垄断与禁令救济
    - 美国：eBay Inc. v. MercExchange 框架下 SEP 禁令难以获得
    - 欧洲：Huawei v. ZTE 程序框架下，被控方若善意谈判则难以获得禁令
    - 中国：最高法（2022）"禁令救济" + "全球费率裁判" 第一案（OPPO v. Nokia）
    - 应对：评估禁令救济可能性，影响谈判筹码与诉讼策略

    ## 网络通信中的分摊侵权（Divided Infringement）

    ### 核心问题
    网络/通信系统专利中，单一方法权利要求的各步骤通常由**不同网络节点**执行：
    - 发送端（UE/终端）执行编码、调制
    - 网络侧（gNB/基站）执行调度、转发
    - 核心网（AMF/UPF）执行移动性管理、数据转发
    - 接收端执行解调、解码
    - 多用户场景：多个 UE + 基站 + 核心网协同

    ### 各管辖地处理
    - **美国 Akamai 框架**：
      - 共同侵权（Joint Infringement）：一方指挥控制另一方（mastermind）
      - 代位侵权（Vicarious）：一方与另一方有代理关系
      - 2012 Akamai v. Limelight（en banc）后，分摊侵权可成立
    - **中国**：
      - 通常需单一主体实施全部步骤
      - 多方场景证明难度高，需证明"共同侵权"或"帮助/教唆侵权"（《民法典》1168-1169条）
      - 通信 SEP 多采用系统权利要求 + 终端/基站分别主张
    - **欧洲**：
      - 各国不同，部分国家接受 indirect/contributory infringement
      - 英国 Unwired Planet v. Huawei（2017）处理了系统权利要求

    ### 应对策略
    - 识别被控通信系统的架构，确定侵权步骤的实际执行方
    - 终端制造商（手机厂商）、基站制造商（华为/中兴/爱立信/诺基亚）、运营商分别承担的角色
    - 评估对终端厂商、基站厂商、运营商分别主张侵权的可行性
    - SEP 场景下，通常对终端厂商主张许可（最经济可行）

    ## 逐项特征对比矩阵
    对每个技术特征构建对比矩阵：

    | 权利要求特征 | 特征类型 | 被控产品对应特征 | 探测方法 | 字面侵权？ | 等同侵权？ | 证据强度 | 备注 |
    |-------------|---------|----------------|---------|-----------|-----------|---------|------|

    评分标准：
    - **确认匹配**：拆解报告/信号抓包/规格书直接显示该特征存在
    - **高度可能**：协议一致性测试通过 + 标准条款映射可合理推断
    - **可能匹配**：BOM 列出疑似芯片，部分参数支持，需进一步取证
    - **信息不足**：内部 DSP/固件无法观察，需法院证据保全或专业拆解
    - **不匹配**：公开信息显示该特征不存在

    ## 侵权概率评级
    | 等级 | 标准 | 建议行动 |
    |------|------|---------|
    | 高（>70%） | 所有特征确认匹配或高度可能 | 准备警告函/申请证据保全/启动 FRAND 谈判 |
    | 中（40-70%） | 部分特征可能匹配，存在等同可能 | 补充拆解分析/协议测试/规格书比对 |
    | 低（<40%） | 关键特征不匹配或内部黑盒无法穿透 | 持续监控/放弃 |

    ## 证据保全建议（电子/通信特有）

    ### 1. 公证购买电子产品
    - 公证员见证下从正规渠道购买被控产品（保留发票、销售记录）
    - 记录产品型号、批次、序列号、生产日期
    - 保留完整包装、说明书、配件
    - 多批次购买（证明持续性侵权）

    ### 2. 专业拆解报告
    - 委托 TechInsights、Chipworks、System Plus Consulting 等专业机构
    - 国内：微电子所、相关集成电路实验室、第三方检测机构
    - 报告内容：
      - die 显微照片、版图布局
      - 电路原理图重建（部分电路）
      - 工艺节点分析
      - 关键电路与权利要求技术特征比对
    - 法律效力：第三方专业报告证据力强
    - 成本：$10K-$100K+，需权衡成本与必要性

    ### 3. 实验室测量数据
    - 测试环境标准化：屏蔽室、标准天线、校准设备
    - 设备校准证书：频谱仪、信号源、网络分析仪定期校准
    - 多次重复测量，记录测量不确定度
    - 第三方检测机构出具报告（CNAS/CMA 资质）
    - 数据保存：原始测量数据、设备配置、测试人员签字

    ### 4. 一致性测试报告
    - GCF/PTCRB（北美）运营商认证测试报告（公开可查）
    - Wi-Fi Alliance 认证列表
    - Bluetooth SIG 完成认证列表（Launch Studio）
    - 这些报告公开，可作为有力辅助证据

    ### 5. 标准声明数据库检索
    - ETSI IPR Online Database 检索记录（带时间戳）
    - IEEE-SA Patent Declaration 数据库检索记录
    - 证明：被控产品涉及的条款对应 SEP 声明 → 推定使用相关技术

    ## 证据链构建
    - **直接证据**：专业拆解报告、实验室测量数据、一致性测试报告
    - **间接证据**：规格书/Datasheet、白皮书、技术论文、专利文件、BOM 列表
    - **时间线**：对方产品上市时间 vs 我方专利公开时间 vs 标准发布时间
    - **一致性证明**：规格书 → 拆解报告 → 实验室测量 → 一致性测试 的相互印证
    - **SEP 特殊链**：标准条款 → ETSI/IEEE 声明 → 我方专利 → 一致性测试通过 → 侵权成立

    ## 输入数据
    1. `input/task_params.json` — 专利号、权利要求重点、疑似产品、产品类别、探测方法、管辖地、SEP 相关性
    2. `input/inherited/` — 专利全文/权利要求（如有）
    3. `input/checklists/` — 侵权分析检查清单

