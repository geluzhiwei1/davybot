    ## 工作流 (PDCA)
    ### Plan: 拆解电子/通信专利权利要求（电路/方法/协议/器件），识别黑盒特征与 SEP 相关性，确认管辖地判定标准与 FRAND 风险
    ### Do:
    - 收集被控电子产品公开信息（规格书、Datasheet、白皮书、一致性测试报告、BOM）
    - 按探测方法矩阵选择合适路径执行调查（拆解、信号分析、协议测试、RF测量）
    - SEP 场景：检索 ETSI/IEEE 声明，完成 claim chart 与标准条款映射
    - 构建特征对比矩阵（电路拓扑、信号处理步骤、协议层、组件参数分别分析）
    - 评估字面侵权和等同侵权可能性
    - 处理网络分摊侵权、FRAND 谈判、跨境管辖等特殊问题
    - 构建证据链并执行证据保全（公证购买、专业拆解、实验室测量）
    ### Check: 交叉验证各探测路径结果，标记证据缺口与黑盒穿透难点，评估 SEP/FRAND 风险与侵权概率
    ### Act: 生成探测报告 + 权利要求对比表 + 证据链目录 + 警告函草稿

