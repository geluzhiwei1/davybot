template:
  slug: reverse-detection-electronics
  name: "电子/通信反向侵权探测"
  version: "1.0"
  module: ip-reverse-detection
  team_slug: ip-reverse-detection

  description: |
    针对电子/通信类专利的反向侵权探测。
    检测市场上电子产品、通信设备、芯片、半导体器件是否侵犯我方电子/通信专利权。
    针对电子专利"内部结构不可直接观察"特性，结合芯片拆解/逆向、信号抓取分析、协议一致性测试、
    规格书对比、射频参数测量、BOM分析等多路径取证，
    逐项对比权利要求与疑似侵权电子产品特征，生成侵权分析报告、权利要求对比表、证据链和警告函草稿。
    特别处理标准必要专利（SEP/FRAND）、网络通信分摊侵权、ETSI/IEEE标准声明等电子/通信专利特有问题。

  data_requirements:
    required:
      - key: patent_numbers
        label: "我方专利号"
        type: string
        placeholder: "如：CN1234567A, US9876543B2（逗号分隔，支持多件）"
        store: "input/task_params.json"
      - key: claim_focus
        label: "重点分析的权利要求"
        type: string
        placeholder: "如：权1-3（方法），权10-15（装置）。留空表示分析全部独立权利要求"
        store: "input/task_params.json"
      - key: suspected_product
        label: "疑似侵权电子产品"
        type: string
        placeholder: "描述疑似侵权的电子产品、通信设备、芯片、器件"
        store: "input/task_params.json"
    optional:
      - key: product_category
        label: "产品类别"
        type: select
        default: ""
        options:
          - { value: "", label: "不限/不确定" }
          - { value: "芯片/IC", label: "芯片/IC" }
          - { value: "通信设备/基站", label: "通信设备/基站" }
          - { value: "消费电子", label: "消费电子" }
          - { value: "传感器/IoT", label: "传感器/IoT" }
          - { value: "电源/功率器件", label: "电源/功率器件" }
          - { value: "其他", label: "其他" }
        store: "input/task_params.json"
      - key: detection_method
        label: "首选探测方法"
        type: select
        default: ""
        options:
          - { value: "", label: "全部方法综合" }
          - { value: "芯片拆解/逆向", label: "芯片拆解/逆向" }
          - { value: "信号抓取分析", label: "信号抓取分析" }
          - { value: "协议一致性测试", label: "协议一致性测试" }
          - { value: "规格书对比", label: "规格书对比" }
          - { value: "射频参数测量", label: "射频参数测量" }
          - { value: "混合方法", label: "混合方法" }
        store: "input/task_params.json"
      - key: jurisdiction
        label: "侵权判定管辖地"
        type: select
        default: "CN"
        options:
          - { value: "CN", label: "中国（全面覆盖+等同原则）" }
          - { value: "US", label: "美国（Literal+Doctrine of Equivalents）" }
          - { value: "EP", label: "欧洲（Article 69 + Protocol）" }
          - { value: "JP", label: "日本（均等论）" }
        store: "input/task_params.json"
      - key: evidence_available
        label: "已有证据"
        type: select
        default: ""
        options:
          - { value: "", label: "暂无" }
          - { value: "product", label: "已购买对方产品" }
          - { value: "marketing", label: "对方宣传资料/网站" }
          - { value: "patents", label: "对方专利/论文" }
          - { value: "mixed", label: "多种来源" }
        store: "input/task_params.json"
      - key: standard_relevance
