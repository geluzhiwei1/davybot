template:
  slug: ep-application
  name: "欧洲专利申请文件"
  version: "1.0"
  module: ip-application
  team_slug: ip-application
  target_country: EP

  description: |
    基于专利草案生成符合 EPO 要求的欧洲专利申请文件
    (Description + Claims + Abstract)。EPC Rule 42/43 格式。

  data_requirements:
    required:
      - key: applicant_name
        label: "申请人全称 (Applicant Name)"
        type: string
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人姓名 (Inventor Names)"
        type: string
        store: "input/task_params.json"
    optional:
      - key: designation_states
        label: "指定国 (Designation States)"
        type: string
        placeholder: "DE, FR, GB, NL 等"
        store: "input/task_params.json"
      - key: filing_language
        label: "申请语言"
        type: select
        options:
          - { value: "en", label: "English" }
          - { value: "de", label: "Deutsch" }
          - { value: "fr", label: "Francais" }
        default: "en"
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/us-patent-law

  checklists: []

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案继承的文件"
    - dir: output
      description: "EPO 各分册输出"
    - dir: drafts
      description: "完整申请文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令
    基于草案生成 EPO 欧洲专利申请文件。
    EPC Rule 42 格式：Description（五部分）+ Claims（两段式）+ Abstract（50-150 词）。
    注意：独立权利要求两段式（preamble + characterizing portion）。
    工作流：Plan → Do（Description → Claims → Abstract） → Check → Act

  deliverables:
    - file: "drafts/ep_patent_package.md"
      name: "欧洲专利申请文件"
      format: markdown

  phases:
    - name: plan
      label: "分析草案内容"
      progress: 10
    - name: do_description
      label: "生成 Description"
      progress: 30
    - name: do_claims
      label: "生成 Claims"
      progress: 25
    - name: do_abstract
      label: "生成 Abstract"
      progress: 15
    - name: check
      label: "EPC 格式审查"
      progress: 15
    - name: act
      label: "生成最终文件"
      progress: 5
