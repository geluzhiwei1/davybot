template:
  slug: cn-utility-model
  name: "中国实用新型专利申请文件"
  version: "1.0"
  module: ip-application
  team_slug: ip-application
  target_country: CN

  description: |
    基于专利草案生成符合 CNIPA 要求的实用新型专利申请文件。
    实用新型仅保护产品形状/构造，不保护方法。

  data_requirements:
    required:
      - key: applicant_name
        label: "申请人全称"
        type: string
        placeholder: "企业营业执照上的全称"
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人姓名"
        type: string
        store: "input/task_params.json"
    optional:
      - key: applicant_address
        label: "申请人地址"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists:
    - ref: "checklist/cn-invention-format"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游草案继承的文件"
    - dir: output
      description: "申请文件各分册"
    - dir: drafts
      description: "完整申请文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令
    基于草案生成中国实用新型专利申请文件。实用新型仅保护产品的形状、构造或其结合。
    工作流：Plan → Do（权利要求书 → 说明书 → 摘要） → Check → Act

  deliverables:
    - file: "drafts/cn_utility_model_package.md"
      name: "中国实用新型申请文件"
      format: markdown

  phases:
    - name: plan
      label: "分析草案内容"
      progress: 15
    - name: do_claims
      label: "生成权利要求书"
      progress: 30
    - name: do_description
      label: "生成说明书"
      progress: 30
    - name: check
      label: "格式审查"
      progress: 15
    - name: act
      label: "生成最终文件"
      progress: 10
