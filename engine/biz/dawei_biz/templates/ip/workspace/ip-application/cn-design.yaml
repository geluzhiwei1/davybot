template:
  slug: cn-design
  name: "中国外观设计专利申请文件"
  version: "1.0"
  module: ip-application
  team_slug: ip-application
  target_country: CN

  description: |
    基于产品图片/描述生成符合 CNIPA 要求的外观设计专利申请文件。
    外观设计保护产品的形状、图案、色彩或其结合。

  data_requirements:
    required:
      - key: applicant_name
        label: "申请人全称"
        type: string
        store: "input/task_params.json"
      - key: designer_names
        label: "设计人姓名"
        type: string
        store: "input/task_params.json"
      - key: product_name
        label: "产品名称"
        type: string
        placeholder: "如：手机、灯具、包装盒"
        store: "input/task_params.json"
    optional:
      - key: design_description
        label: "设计要点描述"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law

  checklists: []

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "产品图片/文件"
    - dir: output
      description: "申请文件"
    - dir: drafts
      description: "完整申请文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令
    基于产品描述生成中国外观设计专利申请文件。
    外观设计申请包含：请求书、图片/照片、简要说明。
    工作流：Plan → Do（简要说明 → 请求书） → Check → Act

  deliverables:
    - file: "drafts/cn_design_package.md"
      name: "中国外观设计申请文件"
      format: markdown

  phases:
    - name: plan
      label: "分析产品设计"
      progress: 20
    - name: do_brief
      label: "生成简要说明"
      progress: 35
    - name: check
      label: "格式审查"
      progress: 25
    - name: act
      label: "生成最终文件"
      progress: 20
