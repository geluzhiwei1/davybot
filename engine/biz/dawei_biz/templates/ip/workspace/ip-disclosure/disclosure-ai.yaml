template:
  slug: disclosure-ai
  name: "AI/软件技术交底书"
  version: "1.0"
  module: ip-disclosure
  team_slug: ip-disclosure

  description: |
    针对人工智能、算法、软件方法类创新的交底书撰写。
    重点关注算法流程描述、数据流向、模型架构、技术效果量化。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "如：基于注意力机制的多模态数据融合方法"
        store: "input/task_params.json"
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "描述算法原理、模型架构、数据处理流程（200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: select
        placeholder: "选择子领域"
        default: ""
        options:
          - value: ""
            label: "请选择"
          - value: "机器学习"
            label: "机器学习/深度学习"
          - value: "自然语言处理"
            label: "自然语言处理 (NLP)"
          - value: "计算机视觉"
            label: "计算机视觉"
          - value: "推荐系统"
            label: "推荐系统/搜索算法"
          - value: "系统软件"
            label: "操作系统/数据库/中间件"
          - value: "软件架构"
            label: "软件架构/微服务/分布式"
        store: "input/task_params.json"
      - key: algorithm_detail
        label: "算法细节"
        type: string
        placeholder: "核心算法公式、网络结构、训练策略等"
        store: "input/task_params.json"
      - key: data_pipeline
        label: "数据处理流程"
        type: string
        placeholder: "数据采集、预处理、特征工程、训练/推理流程"
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/patent-examination-guidelines

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游评估继承的文件"
    - dir: input/checklists
      description: "交底书检查清单"
    - dir: output
      description: "各章节输出"
    - dir: drafts
      description: "完整交底书文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入 AI/软件技术交底书撰写工作区，请按照 PDCA 工作流执行。

    ## 领域重点：AI/软件交底书
    AI/软件类交底书需特别关注以下方面：
    1. **算法与技术手段的结合**：描述算法如何通过技术手段解决技术问题，避免被认定为智力活动规则
    2. **数据流向**：清晰描述输入数据→预处理→模型推理→后处理→输出的完整链路
    3. **模型架构**：网络层结构、参数配置、训练策略的具体描述
    4. **技术效果量化**：准确率、推理速度、资源占用等可对比的量化指标
    5. **应用场景关联**：算法在实际应用中的部署方式和效果

    ## 交底书 8 章节
    1. 技术领域（明确AI子领域及应用场景）
    2. 背景技术（现有AI方法的局限性）
    3. 发明目的（要解决的技术问题）
    4. 技术方案（算法流程 + 数据流向 + 模型架构）
    5. 有益效果（量化对比：准确率/速度/资源）
    6. 具体实施方式（至少2个完整pipeline示例）
    7. 附图说明（流程图/网络结构图/数据流向图）
    8. 权利要求概要（方法+装置+设备+介质）

    ## 输入数据
    1. `input/task_params.json` — 发明名称、算法描述、技术领域
    2. `input/inherited/` — 可选的上游评估报告

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取输入，确认AI技术方案的核心创新点
    ### Do: 逐章节撰写，重点描述算法流程和数据流向
    ### Check: 核对交底书完整性清单（关注客体适格性）
    ### Act: 汇总输出完整交底书

  deliverables:
    - file: "drafts/disclosure_full.md"
      name: "AI技术交底书全文"
      format: markdown
    - file: "output/disclosure_sections.md"
      name: "各章节结构化数据"
      format: markdown

  phases:
    - name: plan
      label: "理解算法创意"
      progress: 10
    - name: do_core
      label: "撰写技术方案"
      progress: 25
    - name: do_embodiments
      label: "撰写实施方式"
      progress: 25
    - name: do_remaining
      label: "撰写其他章节"
      progress: 20
    - name: check
      label: "完整性审查"
      progress: 15
    - name: act
      label: "汇总输出"
      progress: 5
