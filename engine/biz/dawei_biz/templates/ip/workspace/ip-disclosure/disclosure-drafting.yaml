template:
  slug: disclosure-drafting
  name: "技术交底书撰写（通用）"
  version: "1.0"
  module: ip-disclosure
  team_slug: ip-disclosure

  description: |
    根据技术创意撰写完整专利技术交底书（8 章节）。
    交底书是发明人与专利代理人之间的核心沟通文件。

  data_requirements:
    required:
      - key: invention_title
        label: "发明名称"
        type: string
        placeholder: "请输入发明名称"
        store: "input/task_params.json"
      - key: description
        label: "技术创意描述"
        type: string
        placeholder: "描述您的技术方案（200字以上）"
        store: "input/task_params.json"
    optional:
      - key: tech_field
        label: "技术领域"
        type: string
        placeholder: "如：人工智能、新能源"
        store: "input/task_params.json"
      - key: inventor_names
        label: "发明人"
        type: string
        store: "input/task_params.json"

  knowledge_refs:
    - knowledge/patent-law
    - knowledge/patent-examination-guidelines

  checklists:
    - ref: "checklist/patentability-check"

  workspace_structure:
    - dir: input
      description: "用户输入数据"
    - dir: input/inherited
      description: "从上游评估继承的文件"
    - dir: input/checklists
      description: "交底书检查清单"
    - dir: output
      description: "各章节输出"
    - dir: drafts
      description: "完整交底书文件"
    - dir: references
      description: "法规知识参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入技术交底书撰写工作区，请按照 PDCA 工作流执行。

    ## 核心原则：忠于发明人意图
    交底书是发明人与专利代理人的沟通桥梁。保留发明人的原始意图，用专利语言规范表达。

    ## 交底书 8 章节
    1. 技术领域
    2. 背景技术（现有技术的问题）
    3. 发明目的（要解决的技术问题）
    4. 技术方案（核心 + 改进）
    5. 有益效果
    6. 具体实施方式（至少 2 个）
    7. 附图说明
    8. 权利要求概要

    ## 输入数据
    1. `input/task_params.json` — 发明名称、技术描述
    2. `input/inherited/` — 可选的上游评估报告

    ## IP 清单
    {checklist_table}

    ## 工作流 (PDCA)
    ### Plan: 读取输入，确认 8 章节框架
    ### Do: 逐章节撰写（技术方案 → 实施方式 → 权利要求概要）
    ### Check: 核对交底书完整性清单
    ### Act: 汇总输出完整交底书

  deliverables:
    - file: "drafts/disclosure_full.md"
      name: "技术交底书全文"
      format: markdown
    - file: "output/disclosure_sections.md"
      name: "各章节结构化数据"
      format: markdown

  phases:
    - name: plan
      label: "理解创意内容"
      progress: 10
    - name: do_core
      label: "撰写技术方案"
      progress: 25
    - name: do_embodiments
      label: "撰写实施方式"
      progress: 25
    - name: do_remaining
      label: "撰写其他章节"
      progress: 20
    - name: check
      label: "完整性审查"
      progress: 15
    - name: act
      label: "汇总输出"
      progress: 5
