# 合规工作区模板: 跨境技术许可合规
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: ip-cross-border-licensing
  name: "跨境技术许可合规"
  version: "1.0"
  team_slug: ip-compliance

  description: |
    对跨境技术许可交易进行合规审查，涵盖技术出口管制、
    许可费定价、转让定价和合同条款合规评估。

  applicable_scenarios:
    - "跨境技术许可协议审查"
    - "技术出口管制合规评估"
    - "许可费定价合理性分析"
    - "关联企业转让定价审查"

  estimated_time: "35-50 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入许可方企业全称"
        store: "input/company_info.json"

      - key: counterparty_name
        label: "对方企业名称"
        type: string
        placeholder: "请输入被许可方/转让方企业全称"
        store: "input/company_info.json"

      - key: tech_description
        label: "许可技术描述"
        type: text
        placeholder: "请描述许可涉及的技术内容和知识产权范围..."
        store: "input/task_parameters.json"

      - key: countries_involved
        label: "涉及国家/地区"
        type: multiselect
        options: ["中国", "美国", "欧盟", "日本", "韩国", "俄罗斯", "东南亚", "中东", "其他"]
        store: "input/task_parameters.json"

      - key: license_type
        label: "许可类型"
        type: select
        options:
          - { value: patent, label: "专利许可" }
          - { value: technology, label: "技术转让" }
          - { value: software, label: "软件许可" }
          - { value: mixed, label: "混合许可（专利+技术+商标）" }
          - { value: knowhow, label: "技术秘密/Know-how" }
        store: "input/task_parameters.json"

    optional:
      - key: license_agreement
        label: "许可协议文件（可选）"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: royalty_info
        label: "许可费/转让价格信息（可选）"
        type: text
        placeholder: "如有已商定的许可费率或转让价格可填入..."
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/ip-cross-border-licensing"

  workspace_structure:
    - dir: input
      description: "审查输入材料"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n许可合规审查参数和物料。"
    - dir: output
      description: "分析中间结果"
    - dir: reports
      description: "合规报告"
    - dir: references
      description: "法规与条约参考"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    1. `input/task_parameters.json`
    2. `input/company_info.json`
    3. `input/` 下所有上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan
    - 分析许可涉及的国别和技术类型
    - 确定适用的出口管制法域
    - 识别关联关系判断转让定价规则

    ### Do
    a. 技术出口管制交叉检查 → `output/export_control_check.md`
    b. 许可费合理性分析（可比非受控价格法）→ `output/royalty_analysis.md`
    c. 关联交易转让定价分析 → `output/transfer_pricing_analysis.md`
    d. 合同条款合规审查 → `output/agreement_compliance_review.md`

    ### Check
    - 验证出口管制分类准确
    - 确认转让定价方法适用性

    ### Act
    - 生成跨境许可合规分析报告 → `reports/cross_border_licensing_report.docx`

    ## 重要提示
    - 重点关注美国 EAR/ITAR、欧盟 Dual-Use Regulation、中国《技术进出口管理条例》
    - 转让定价需参照 OECD Transfer Pricing Guidelines
    - 本报告不替代专业律师和税务顾问意见

  report_template:
    format: docx
    sections:
      - executive_summary
      - export_control_analysis
      - royalty_assessment
      - transfer_pricing_analysis
      - agreement_compliance
      - risk_summary
      - legal_references

  phases:
    - name: plan
      label: "审查规划"
      progress: 10
    - name: do_export
      label: "出口管制检查"
      progress: 25
    - name: do_royalty
      label: "许可费分析"
      progress: 20
    - name: do_transfer
      label: "转让定价分析"
      progress: 20
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 5
