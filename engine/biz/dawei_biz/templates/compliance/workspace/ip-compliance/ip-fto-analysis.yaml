# 合规工作区模板: FTO 自由实施分析
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: ip-fto-analysis
  name: "FTO 自由实施分析"
  version: "1.0"
  team_slug: ip-compliance

  description: |
    对目标产品/技术进行专利自由实施 (Freedom to Operate)
    分析，识别潜在的专利侵权风险并制定规避策略。

  applicable_scenarios:
    - "新产品上市前 FTO 评估"
    - "进入新市场专利风险评估"
    - "OEM/ODM 产品专利审查"
    - "技术许可谈判前评估"

  estimated_time: "30-45 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: product_technology
        label: "目标产品/技术描述"
        type: text
        placeholder: "请详细描述产品/技术的功能、技术特征和创新点..."
        store: "input/task_parameters.json"

      - key: target_markets
        label: "目标市场"
        type: multiselect
        options: ["中国", "美国", "欧盟", "日本", "韩国", "东南亚", "其他"]
        store: "input/task_parameters.json"

      - key: tech_field
        label: "技术领域"
        type: select
        options:
          - { value: ai_ml, label: "人工智能/机器学习" }
          - { value: semiconductor, label: "半导体" }
          - { value: pharma, label: "医药/生物技术" }
          - { value: telecom, label: "通信/5G" }
          - { value: automotive, label: "汽车/自动驾驶" }
          - { value: consumer_electronics, label: "消费电子" }
          - { value: software, label: "软件/互联网" }
          - { value: new_energy, label: "新能源" }
          - { value: other, label: "其他" }
        store: "input/task_parameters.json"

    optional:
      - key: known_patents
        label: "已知相关专利号"
        type: text
        placeholder: "如：CN123456789A, US98765432B2..."
        store: "input/task_parameters.json"

      - key: technical_docs
        label: "技术文档/产品说明书"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：XX产品美国FTO分析"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/ip-fto-analysis"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的产品技术和专利信息文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解产品技术特征和目标市场
    - 根据合规清单制定 FTO 分析执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 技术特征分解 (Feature Decomposition) → `output/feature_decomposition.json`
    b. 各市场专利检索策略制定 → `output/search_strategy.md`
    c. 关键专利识别与风险评级 → `output/key_patents_analysis.csv`
    d. 权利要求比对分析 (Claim Chart) → `output/claim_comparison.md`
    e. 规避设计建议 → `output/design_around_suggestions.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证技术特征分解完整
    - 确认未遗漏关键专利族
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成 FTO 自由实施分析报告 → `reports/fto_analysis_report.docx`
    - 报告必须包含：执行摘要、产品技术概述、专利检索结果、关键专利风险分析（高/中/低）、权利要求比对详情、规避设计与替代方案、综合风险评级与建议

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - FTO 分析为专利侵权风险初步评估，不替代专业专利律师意见
    - 注意等同原则 (Doctrine of Equivalents) 扩大保护范围

  report_template:
    format: docx
    sections:
      - executive_summary
      - technology_overview
      - patent_search_results
      - key_patent_analysis
      - claim_comparison
      - design_around
      - risk_rating
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_feature
      label: "技术特征分解"
      progress: 15
    - name: do_search
      label: "专利检索分析"
      progress: 30
    - name: do_analysis
      label: "风险评级与规避"
      progress: 30
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 5
