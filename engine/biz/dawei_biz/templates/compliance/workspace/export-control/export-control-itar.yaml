# 合规工作区模板: ITAR 合规评估
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: export-control-itar
  name: "ITAR 合规评估"
  version: "1.0"
  team_slug: export-control

  description: |
    基于 ITAR (国际武器贸易条例) 和 USML (美国军品管制清单)，
    对涉及国防物品/服务的交易进行 ITAR 管制合规评估。

  applicable_scenarios:
    - "国防物品/服务出口"
    - "ITAR 注册要求判定"
    - "技术数据跨境传输"
    - "外国人员访问限制判定"

  estimated_time: "25-35 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: item_description
        label: "物品/服务/技术描述"
        type: text
        placeholder: "请详细描述物品/服务/技术的功能、性能参数、应用场景..."
        store: "input/task_parameters.json"

      - key: usml_category
        label: "可能涉及的 USML 类别"
        type: multiselect
        options:
          - { value: I, label: "I — 火器" }
          - { value: II, label: "II — 火炮" }
          - { value: III, label: "III — 弹药" }
          - { value: IV, label: "IV — 导弹" }
          - { value: V, label: "V — 爆炸物" }
          - { value: VI, label: "VI — 军舰" }
          - { value: VII, label: "VII — 坦克" }
          - { value: VIII, label: "VIII — 航空器" }
          - { value: XI, label: "XI — 电子设备" }
          - { value: XV, label: "XV — 航天器" }
          - { value: other, label: "其他/USML XXI" }
        store: "input/task_parameters.json"

      - key: end_user_type
        label: "最终用户类型"
        type: select
        options:
          - { value: foreign_gov, label: "外国政府/军队" }
          - { value: commercial, label: "商业实体" }
          - { value: research, label: "研究机构/大学" }
          - { value: individual, label: "个人" }
          - { value: other, label: "其他" }
        store: "input/task_parameters.json"

    optional:
      - key: technical_specs
        label: "技术规格/设计文档"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: existing_licenses
        label: "现有出口许可/授权文件"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: foreign_personnel
        label: "是否有外国人员接触技术数据"
        type: boolean
        default: false
        store: "input/company_info.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：XX项目ITAR管制判定"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/export-control-itar"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的国防物品信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解物品技术特征和出口场景
    - 根据合规清单制定 ITAR 管制评估执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. ITAR vs. EAR 管辖范围初步判定 → `output/itar_ear_jurisdiction.md`
    b. USML 具体类别匹配分析 → `output/usml_category_analysis.md`
    c. 国防物品/技术数据判定 → `output/defense_article_determination.md`
    d. DDTC 注册/许可要求评估 → `output/ddtc_requirements.md`
    e. 技术转移风险识别 (视同出口) → `output/deemed_export_risk.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证 USML 分类逻辑
    - 确认视同出口场景覆盖
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成 ITAR 合规评估报告 → `reports/itar_compliance_assessment.docx`
    - 报告必须包含：执行摘要、物品技术分析、ITAR管辖判定、USML分类结论、DDTC注册/许可建议、视同出口风险、合规行动计划

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - ITAR 违规可能导致严重刑事和行政处罚
    - 涉及国防物品的评估建议寻求 DDTC 注册律师/顾问意见

  report_template:
    format: docx
    sections:
      - executive_summary
      - item_analysis
      - itar_jurisdiction
      - usml_classification
      - ddtc_requirements
      - deemed_export_risk
      - compliance_action_plan
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_jurisdiction
      label: "管辖范围判定"
      progress: 15
    - name: do_usml
      label: "USML 分类匹配"
      progress: 30
    - name: do_requirements
      label: "注册许可评估"
      progress: 25
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 10
