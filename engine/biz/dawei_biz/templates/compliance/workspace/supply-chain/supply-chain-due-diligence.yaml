# 合规工作区模板: 供应链全面尽调
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: supply-chain-due-diligence
  name: "供应链全面尽调"
  version: "1.0"
  team_slug: supply-chain

  description: |
    基于欧盟 CSDDD (企业可持续发展尽职调查指令) 框架，对供应链
    进行人权、环境全面尽调，识别合规差距并制定整改方案。

  applicable_scenarios:
    - "欧盟 CSDDD 合规"
    - "供应链人权评估"
    - "环境尽职调查"
    - "新供应商准入审查"

  estimated_time: "45-60 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: eu_turnover
        label: "欧盟境内年营业额（欧元）"
        type: string
        placeholder: "如：500000000"
        store: "input/company_info.json"

      - key: supply_chain_regions
        label: "供应链覆盖区域"
        type: multiselect
        options: ["中国", "东南亚", "南亚", "非洲", "南美", "东欧", "中东", "其他"]
        store: "input/task_parameters.json"

      - key: risk_categories
        label: "关注的风险类别"
        type: multiselect
        options: ["强迫劳动", "童工", "环境损害", "职业安全", "工资工时", "歧视", "结社自由"]
        store: "input/task_parameters.json"

      - key: tier_count
        label: "供应链层级"
        type: select
        options:
          - { value: 1, label: "Tier 1 (仅直接供应商)" }
          - { value: 2, label: "Tier 1-2 (直接+次级)" }
          - { value: 3, label: "Tier 1-3 (全链路)" }
        store: "input/task_parameters.json"

    optional:
      - key: existing_policies
        label: "既有供应链政策/供应商行为守则"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: previous_audits
        label: "过往供应链审计报告"
        type: file
        accept: ".pdf,.docx,.xlsx"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：CSDDD 合规差距分析与整改计划"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/supply-chain-due-diligence"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的供应链数据和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解供应链结构和 CSDDD 适用范围
    - 根据合规清单制定分阶段尽调执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. CSDDD 适用范围判定 → `output/csddd_applicability.md`
    b. 供应链风险地图绘制 → `output/risk_heatmap.json`
    c. 政策差距分析 (Policy Gap Analysis) → `output/policy_gap_analysis.md`
    d. 人权风险深度评估 → `output/human_rights_assessment.md`
    e. 环境合规评估 → `output/environmental_assessment.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证尽调覆盖全链路
    - 确认风险评级方法论一致性
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成 CSDDD 合规尽调报告 → `reports/csddd_due_diligence_report.docx`
    - 报告必须包含：执行摘要、CSDDD适用范围分析、供应链风险地图、差距分析矩阵（人权+环境）、整改优先事项（含时间线和责任人）、持续监测机制建议

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - CSDDD 要求尽调是持续性义务，需建立监测机制
    - 人权风险标注严重程度和可能性

  report_template:
    format: docx
    sections:
      - executive_summary
      - csddd_applicability
      - risk_mapping
      - gap_analysis
      - remediation_plan
      - monitoring_framework
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_applicability
      label: "CSDDD 适用范围"
      progress: 15
    - name: do_risk_map
      label: "风险地图"
      progress: 20
    - name: do_gap
      label: "差距分析"
      progress: 25
    - name: do_assessment
      label: "深度评估"
      progress: 15
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 5
