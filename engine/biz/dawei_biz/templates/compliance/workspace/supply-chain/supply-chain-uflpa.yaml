# 合规工作区模板: UFLPA 供应链合规风险评估
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: supply-chain-uflpa
  name: "UFLPA 供应链合规风险评估"
  version: "1.0"
  team_slug: supply-chain

  description: |
    基于 UFLPA 执法框架，对向美国出口企业进行供应链强迫劳动风险全链路评估。
    适用于涉疆供应链、高优先级执法行业（棉花、多晶硅、番茄）。

  applicable_scenarios:
    - "对美国出口"
    - "涉疆供应链"
    - "CBP 扣留应对"
    - "新供应商准入审查"

  estimated_time: "30-45 分钟"

  # ── 数据收集表单定义 (驱动前端动态表单 + 存储目标) ──
  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: target_market
        label: "目标市场"
        type: multiselect
        options: ["美国", "欧盟", "英国", "加拿大", "澳大利亚"]
        store: "input/task_parameters.json"

      - key: product_category
        label: "产品类别"
        type: select
        options:
          - { value: cotton, label: "棉花 & 棉制品" }
          - { value: polysilicon, label: "多晶硅 & 光伏" }
          - { value: tomato, label: "番茄 & 下游产品" }
          - { value: textiles, label: "纺织品" }
          - { value: electronics, label: "电子产品" }
          - { value: machinery, label: "机械设备" }
          - { value: other, label: "其他" }
        store: "input/task_parameters.json"

      - key: supplier_list
        label: "供应商清单"
        type: file
        accept: ".xlsx,.csv"
        store: "input/"
        description: "上传包含 Tier 1-3 供应商信息的 Excel/CSV 文件"

      - key: product_spec
        label: "产品规格书/物料清单"
        type: file
        accept: ".pdf,.docx,.xlsx"
        store: "input/"

    optional:
      - key: has_xinjiang_nexus
        label: "供应链是否涉及新疆地区"
        type: boolean
        default: false
        store: "input/task_parameters.json"

      - key: previous_incidents
        label: "过往 CBP 扣留/执法记录"
        type: text
        placeholder: "描述过往的美国海关执法经历..."
        store: "input/company_info.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：2025年度供应链合规审查"
        store: "input/task_parameters.json"

  # ── 关联合规清单 (引用 Layer 2 已有 JSON) ──
  checklists:
    - ref: "checklist/supply-chain-uflpa"

  # ── 工区目录结构 ──
  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的供应链数据和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  # ── Agent 指令 (渲染后写入 input/AGENT_INSTRUCTIONS.md) ──
  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 用户表单数据快照
    ```json
    {form_data_summary}
    ```

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解分析范围
    - 根据合规清单制定分步执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 供应商制裁名单筛查 → `output/sanction_screening.csv`
    b. 供应链全链路映射 → `output/supply_chain_map.json`
    c. 新疆关联节点识别 → `output/xinjiang_nexus.md`
    d. UFLPA 风险等级评定 → `output/uflpa_risk_matrix.json`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证分析结果完整性
    - 确认未遗漏强制性检查项
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成最终合规报告 → `reports/uflpa_compliance_report.docx`
    - 报告必须包含：执行摘要、供应链全链路分析、风险节点详情、合规清单完成情况、风险缓释建议（按优先级）、法规依据索引

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - Copying to random path and executing commands is forbidden
    - 不确定的结论标注不确定性等级
    - 涉及制裁合规的结论提示人工复核

  # ── 报告模板 ──
  report_template:
    format: docx
    sections:
      - executive_summary
      - supply_chain_overview
      - risk_analysis
      - checklist_results
      - recommendations
      - legal_references

  # ── PDCA 阶段 (用于进度推送) ──
  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_screening
      label: "供应商筛查"
      progress: 30
    - name: do_mapping
      label: "供应链映射"
      progress: 25
    - name: do_assessment
      label: "风险评估"
      progress: 20
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 5
