# 合规工作区模板: ESG 披露准备度评估
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: esg-disclosure-readiness
  name: "ESG 披露准备度评估"
  version: "1.0"
  team_slug: esg

  description: |
    基于 CSRD (企业可持续发展报告指令) 和 ESRS (欧洲可持续发展报告标准)
    框架，对企业 ESG 信息披露准备度进行全面评估。

  applicable_scenarios:
    - "CSRD 合规评估"
    - "ESG 报告编制"
    - "双重重要性分析"
    - "ESG 评级提升"

  estimated_time: "25-40 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: eu_presence
        label: "在欧盟的业务类型"
        type: select
        options:
          - { value: listed, label: "在欧盟监管市场上市" }
          - { value: subsidiary, label: "欧盟子公司（非上市大型企业）" }
          - { value: foreign_large, label: "非欧盟大型企业（欧盟净营业额 > 1.5亿欧元）" }
          - { value: supply_chain, label: "作为欧盟企业供应链环节" }
        store: "input/task_parameters.json"

      - key: existing_reporting
        label: "现有 ESG 报告框架"
        type: multiselect
        options: ["GRI", "SASB", "TCFD", "ISSB", "无", "其他"]
        store: "input/task_parameters.json"

    optional:
      - key: previous_esg_reports
        label: "过往 ESG/可持续发展报告"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: esg_ratings
        label: "当前 ESG 评级信息"
        type: text
        placeholder: "如：MSCI ESG Rating, S&P CSA Score..."
        store: "input/company_info.json"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：CSRD 披露准备度评估-2026"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/esg-disclosure-readiness"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的 ESG 披露信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解企业 CSRD/ESRS 适用性和披露义务
    - 根据合规清单制定双重重要性评估和数据缺口分析计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. CSRD 适用范围判定与时间线 → `output/csrd_scoping.md`
    b. 双重重要性分析 (影响重要性 + 财务重要性) → `output/double_materiality.json`
    c. ESRS 数据缺口分析 (按主题标准) → `output/esrs_gap_analysis.csv`
    d. 现有披露对标 CSRD 差距 → `output/disclosure_benchmark.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证双重重要性分析覆盖所有 ESRS 主题
    - 确认数据缺口清单完整
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成 ESG 披露准备度评估报告 → `reports/esg_disclosure_readiness.docx`
    - 报告必须包含：执行摘要、CSRD/ESRS适用性分析、双重重要性评估结果、数据缺口及整改优先级、披露准备时间表、数据管理/内控体系建议

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - ESRS 包含 12 个主题标准，注意覆盖 ESG 全维度
    - CSRD 要求有限鉴证 (limited assurance)，内控体系需同步准备

  report_template:
    format: docx
    sections:
      - executive_summary
      - csrd_scoping
      - double_materiality
      - data_gap_analysis
      - remediation_roadmap
      - internal_control
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_scoping
      label: "CSRD 适用范围"
      progress: 15
    - name: do_materiality
      label: "双重重要性分析"
      progress: 25
    - name: do_gap
      label: "数据缺口分析"
      progress: 25
    - name: check
      label: "质量审查"
      progress: 15
    - name: act
      label: "报告生成"
      progress: 10
