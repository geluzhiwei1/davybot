# 合规工作区模板: PIPL 基础合规评估
# Layer 1: Workspace Template (YAML) — 定义 HOW

template:
  slug: data-pipl-basic
  name: "PIPL 基础合规评估"
  version: "1.0"
  team_slug: data

  description: |
    基于《个人信息保护法》(PIPL) 框架，对企业个人信息处理活动进行
    基础合规差距分析，识别高风险领域并制定整改建议。

  applicable_scenarios:
    - "PIPL 合规自查"
    - "个人信息处理合规审计"
    - "隐私政策更新"
    - "App/小程序个人信息合规"

  estimated_time: "25-35 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "企业名称"
        type: string
        placeholder: "请输入待评估企业全称"
        store: "input/company_info.json"

      - key: processing_activities
        label: "个人信息处理活动"
        type: multiselect
        options: ["收集", "存储", "使用", "加工", "传输", "提供", "公开", "删除"]
        store: "input/task_parameters.json"

      - key: data_subjects
        label: "涉及数据主体类型"
        type: multiselect
        options: ["员工", "客户/用户", "供应商", "访客", "未成年人"]
        store: "input/task_parameters.json"

      - key: has_privacy_policy
        label: "是否有公开的隐私政策"
        type: boolean
        default: false
        store: "input/company_info.json"

      - key: sensitive_data
        label: "是否涉及敏感个人信息"
        type: boolean
        default: false
        store: "input/task_parameters.json"

    optional:
      - key: current_policy
        label: "现有隐私政策/用户协议"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: data_processing_agreements
        label: "数据处理/委托处理协议"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: previous_audits
        label: "过往个人信息保护审计报告"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：PIPL 基础合规差距分析-2026"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/data-privacy-pipl-basic"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置需要分析的个人信息处理信息和文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 企业基本信息
    3. `input/` 目录下的所有用户上传文件

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 阅读所有输入文件，理解个人信息处理场景和 PIPL 适用性
    - 根据合规清单制定 PIPL 基础合规评估执行计划
    - 向用户展示计划，等待确认

    ### Do (执行)
    a. 个人信息处理活动映射 → `output/processing_activity_map.json`
    b. 合法性基础审查（同意/合同必需/法定义务等） → `output/lawful_basis_analysis.md`
    c. 隐私政策合规审查 → `output/privacy_policy_review.md`
    d. 数据主体权利实现评估 → `output/subject_rights_assessment.md`
    e. 安全措施与技术保障评估 → `output/security_assessment.md`

    每完成一项写入 output/ 对应文件。

    ### Check (验证)
    - 验证覆盖所有个人信息处理环节
    - 确认敏感个人信息的单独同意要求
    - 提交中间结果供用户审核

    ### Act (输出)
    - 生成 PIPL 基础合规评估报告 → `reports/pipl_compliance_assessment.docx`
    - 报告必须包含：执行摘要、数据处理全景图、合规差距矩阵（按章节约PIPL）、风险评估（高/中/低/合规）、整改优先级路线图、法规依据索引

    ## 重要提示
    - 所有文件操作限制在本工作区路径内
    - 关注 PIPL 第13-17条（告知-同意规则）、第28-32条（敏感个人信息）
    - 自动化决策 (PIPL 第24条) 需评估是否触发

  report_template:
    format: docx
    sections:
      - executive_summary
      - processing_overview
      - compliance_gap_matrix
      - risk_assessment
      - remediation_roadmap
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 10
    - name: do_mapping
      label: "处理活动映射"
      progress: 20
    - name: do_review
      label: "合规审查"
      progress: 35
    - name: do_security
      label: "安全评估"
      progress: 15
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 10
