# 合规工作区模板: 交易对手深度尽调（新增）
# Layer 1: Workspace Template (YAML) — 定义 HOW
# 覆盖维度：① KYC/UBO 穿透 + ② KYT 筛查
# 状态码：STATUS_403(SDN_OWNED) / STATUS_401(RESTRICTED_OFFICER) / STATUS_406(DE_FACTO_CONTROL) / STATUS_200

template:
  slug: sanctions-counterparty-deep-diligence
  name: "交易对手深度尽调"
  version: "1.0"
  team_slug: sanctions

  description: |
    签约前对交易对手做穿透式 KYC/UBO 尽调，含股权穿透图谱构建、
    OFAC 50% Rule 聚合计算、EU 实质控制权刺破、信托/代持拆解、
    全主体制裁名单匹配。

  applicable_scenarios:
    - "签约前尽职调查"
    - "并购交易尽调"
    - "年度合规复查"
    - "增强尽调 (EDD)"

  estimated_time: "45-60 分钟"

  data_requirements:
    required:
      - key: company_name
        label: "发起尽调的企业名称"
        type: string
        placeholder: "请输入贵司全称"
        store: "input/company_info.json"

      - key: counterparty_name
        label: "交易对手法定全称"
        type: string
        placeholder: "中英文全称（必须与银行开户证明一致）"
        store: "input/counterparty_info.json"

      - key: counterparty_aliases
        label: "交易对手曾用名/别称"
        type: text
        placeholder: "曾用名、商号、英文缩写、DBA，每行一个"
        store: "input/counterparty_info.json"

      - key: counterparty_registration
        label: "注册登记信息"
        type: string
        placeholder: "统一社会信用代码/商业登记证号/LEI/DUNS 等"
        store: "input/counterparty_info.json"

      - key: counterparty_registered_address
        label: "法定注册地址"
        type: string
        placeholder: "精确到邮编、物理街区"
        store: "input/counterparty_info.json"

      - key: counterparty_business_address
        label: "实际经营地址"
        type: string
        placeholder: "主要营业地/办公地址（如与注册地址不同）"
        store: "input/counterparty_info.json"

      - key: ownership_structure_file
        label: "股权架构图/股东名册"
        type: file
        accept: ".pdf,.xlsx,.png,.jpg"
        store: "input/"
        description: "上传股权穿透图或股东名册，需追溯至自然人/上市公司底层"

      - key: sanction_regimes
        label: "筛查覆盖的制裁体系"
        type: multiselect
        options:
          - "OFAC SDN (美国)"
          - "OFAC Sectoral (美国行业制裁)"
          - "EU Restrictive Measures (欧盟)"
          - "UN Security Council (联合国)"
          - "UK OFSI (英国)"
          - "BIS Entity List"
          - "中国反外国制裁清单"
        store: "input/task_parameters.json"

      - key: due_diligence_purpose
        label: "尽调目的"
        type: select
        options:
          - { value: "pre_contract", label: "签约前尽职调查" }
          - { value: "merger_acquisition", label: "并购交易尽调" }
          - { value: "annual_review", label: "年度合规复查" }
          - { value: "enhanced_dd", label: "增强尽调 (EDD)" }
        store: "input/task_parameters.json"

    optional:
      - key: board_of_directors
        label: "董事会/高管层名单"
        type: text
        placeholder: "董事长、CEO、CFO 等关键人员的姓名、国籍，每行一位"
        store: "input/counterparty_management.json"

      - key: ubo_threshold
        label: "UBO 穿透持股阈值"
        type: select
        options:
          - { value: "5pct", label: "5%（严格模式）" }
          - { value: "10pct", label: "10%（标准模式）" }
          - { value: "25pct", label: "25%（宽松模式）" }
        default: "5pct"
        description: "持股超过此阈值的股东将被穿透至最终受益人"
        store: "input/task_parameters.json"

      - key: trust_structure_details
        label: "信托/基金结构说明"
        type: text
        placeholder: "如果股东中包含信托结构，请描述委托人、受托人、受益人、保护人信息"
        store: "input/counterparty_trust.json"

      - key: nominee_arrangements
        label: "是否存在代持安排"
        type: boolean
        default: false
        description: "是否存在名义股东或代持股协议"
        store: "input/counterparty_info.json"

      - key: end_user_info
        label: "最终用户信息（如适用）"
        type: text
        placeholder: "货物/服务的最终真正物理使用者名称和背景"
        store: "input/end_user.json"

      - key: existing_kyc_report
        label: "既有 KYC/UBO 报告（如有）"
        type: file
        accept: ".pdf,.docx"
        store: "input/"

      - key: task_subject
        label: "分析主题"
        type: string
        placeholder: "如：XX公司签约前制裁尽调"
        store: "input/task_parameters.json"

  checklists:
    - ref: "checklist/sanctions-counterparty-dd"

  workspace_structure:
    - dir: input
      description: "用户输入数据和上传文件"
      initial_files:
        - path: "input/README.md"
          content: "# 输入数据目录\n\n请在此放置交易对手尽调相关文件。"
    - dir: output
      description: "Agent 分析中间结果"
      initial_files:
        - path: "output/README.md"
          content: "# 分析输出目录\n\nAgent 分析过程输出将保存在此目录。"
    - dir: reports
      description: "最终合规报告"
    - dir: references
      description: "法规参考材料"

  agent_instructions: |
    # {template_name} — Agent 工作指令

    你已加入合规工作区，请按照以下工作流执行分析。

    ## 你的角色
    当前模式：compliance-analyst
    执行权限：read + edit + command

    ## 状态码体系

    | 状态码 | 等级 | 含义 |
    |--------|------|------|
    | STATUS_403 (SDN_OWNED) | 🔴 全线阻断 | OFAC 50% Rule 聚合持股 ≥50%，实体被拟制为受制裁 |
    | STATUS_401 (RESTRICTED_OFFICER) | 🟠 限制 | 高管/签字人在 SDN 名单 |
    | STATUS_406 (DE_FACTO_CONTROL) | 🟡 增强尽调 | EU 实质控制权刺破命中 |
    | STATUS_200 (COMPLIANT_PASS) | 🟢 通过 | 主体层级通过 |

    ## 输入数据
    请首先读取以下文件：
    1. `input/task_parameters.json` — 用户提交的分析参数
    2. `input/company_info.json` — 发起企业信息
    3. `input/counterparty_info.json` — 交易对手基本信息
    4. `input/` 目录下的所有用户上传文件（股权图、KYC 报告等）

    ## 工作区路径
    {workspace_path}

    ## 关联合规清单
    以下合规清单已加载到 `input/checklists/` 目录，请逐项对照执行：
    {checklist_table}

    ## 工作流 (PDCA)

    ### Plan (规划)
    - 分析交易对手基本信息，制定穿透式尽调方案
    - 明确 OFAC 50% Rule 聚合计算、EU 实质控制权推定、中国反制裁法冲突三轨判定框架
    - 向用户展示计划，等待确认

    ### Do — 阶段一：KYC/UBO 穿透（维度①）

    a. 基础身份校验 → `output/identity_verification.md`
       - 名称与注册信息交叉验证
       - 地址与实际经营地一致性检查

    b. 股权穿透图谱构建 → `output/ownership_structure.json`
       - 标注每一层持股比例
       - 识别离岸法区实体（BVI/Cayman/Seychelles/Cyprus）
       - **OFAC 50% Rule 聚合计算**：逐级属性传递法
         规则：SDN A 持有 B ≥50% → B 被视为 SDN → B 持有 C ≥50% → C 也被视为 SDN
         **禁止使用全局相乘稀释算法**

    c. UBO 最终受益人识别 → `output/ubo_analysis.json`
       - 穿透至自然人/信托委托人
       - 标记政治公众人物 (PEP) 关联

    d. 核心管理层背景筛查 → `output/management_screening.json`
       - 高管/签字人 SDN 比对
       - 美国绿卡/欧盟国籍人身管辖标记

    e. 实质控制权 (De Facto Control) 审计 → `output/de_facto_control.md`
       - 表决权/AB股/股东协议
       - 财务纽带/债权控制
       - 技术授权依赖度

    ### Do — 阶段二：名单筛查（维度②子集）

    f. 全主体制裁名单匹配 → `output/screening_results.json`
       - 交易对手本体
       - 所有穿透出的股东/UBO/高管

    g. 状态码分类输出

    ### Check (验证)
    - 穿透深度是否达标（自然人层）
    - 50% Rule 聚合计算逻辑正确性（逐级传递 vs 相乘稀释）
    - EU 实质控制 vs OFAC 50% Rule 差异标注
    - 中国《反外国制裁法》双向合规冲突标注

    ### Act (输出)
    - 生成交易对手深度尽调报告 → `reports/counterparty_deep_diligence_report.docx`
    - 包含：股权穿透图、UBO 清单、OFAC 50% Rule 聚合计算表、制裁名单命中结果、
      实质控制权审计、管理层筛查、风险等级判定、缓释建议

    ## 重要提示
    - OFAC 50% Rule 必须使用逐级属性传递法，禁止全局相乘稀释
    - 中国《反外国制裁法》冲突情况必须显式标注"⚠️ 双向合规冲突"
    - 所有筛查结果必须记录时间戳和名单版本

  report_template:
    format: docx
    sections:
      - executive_summary
      - identity_verification
      - ownership_structure
      - ubo_analysis
      - 50pct_rule_calculation
      - de_facto_control
      - management_screening
      - sanctions_screening_results
      - risk_assessment
      - mitigation_recommendations
      - legal_references

  phases:
    - name: plan
      label: "分析规划"
      progress: 5
    - name: do_identity
      label: "身份校验"
      progress: 10
    - name: do_ownership
      label: "股权穿透"
      progress: 20
    - name: do_ubo
      label: "UBO 识别"
      progress: 15
    - name: do_management
      label: "管理层筛查"
      progress: 10
    - name: do_screening
      label: "名单筛查"
      progress: 15
    - name: check
      label: "质量审查"
      progress: 10
    - name: act
      label: "报告生成"
      progress: 15

  # ── 对话采集模式配置 ──
  chat_collection:
    opening: |
      你好！我是制裁合规分析顾问。接下来我会逐步引导你提供交易对手的尽调信息。

      我们将从基础的主体身份信息开始，然后逐步深入到股权结构、管理层背景和制裁筛查。
      你可以随时上传相关文件（股权图、KYC 报告等），我会自动提取其中的信息。

      整个过程大约需要 10-15 分钟。准备好了吗？
    groups:
      - name: "基础身份"
        intro: "首先，让我们确认交易对手的基本身份信息。"
        fields:
          - company_name
          - counterparty_name
          - counterparty_aliases
          - counterparty_registration
          - counterparty_registered_address
          - counterparty_business_address
      - name: "股权与控制权"
        intro: "接下来需要了解交易对手的股权结构。如果你有股权穿透图，可以直接上传，我会从中提取信息。"
        fields:
          - ownership_structure_file
          - ubo_threshold
          - nominee_arrangements
          - trust_structure_details
        follow_up: |
          我注意到股权结构中存在离岸法区实体。为了确保穿透尽调的完整性：
          - 该离岸实体的实际办公地址在哪里？
          - 本地是否有常驻员工？
          - 注册代理人是谁？
      - name: "管理层与签字人"
        intro: "现在让我们审查交易对手的关键管理人员。"
        fields:
          - board_of_directors
      - name: "制裁筛查范围"
        intro: "最后，请确认需要覆盖的制裁体系。"
        fields:
          - sanction_regimes
          - due_diligence_purpose
      - name: "补充材料（可选）"
        intro: "如果你有现成的 KYC 报告或其他尽调文件，可以在这里上传。"
        fields:
          - existing_kyc_report
          - end_user_info
          - task_subject
