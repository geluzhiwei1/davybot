# 阶段六（拆库方案 §18.3 双项目布局）：业务扩展后端独立成包。
# 核心项目 = ../agent（davybot）；本包 = davybot-biz（AGPL 开源，进程内装载）。
# 「业务不在场 = 不存在」在本形态下是物理事实：核心 CI 只装核心。

[project]
name = "davybot-biz"
dynamic = ["version"]
description = "DavyBot business extension backend — biz tools / routers / services / bridges / saas bucket (AGPL, loaded in engine process)"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
authors = [
    {name = "Dawei Team", email = "contact@dawei.com"}
]
keywords = ["ai", "agent", "llm", "davybot", "biz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
# 依赖：进程内依赖引擎核心 davybot（dawei.*）。开源仓双项目形态下核心总与本包
# 共同安装（uv pip install -e engine/agent -e engine/biz；saas 构建脚本同），
# 故不声明 PyPI 依赖名 —— 若缺核心被单独安装，import dawei 立即失败（FAST FAIL）。
dependencies = []

# ── 注册缝（§18.3 S1/S3/S4；统一语义：值 = 模块名，import 即注册）──────────
# 工具模块由 CustomToolProvider 扫描（S1）；路由/沙箱模块以 import 副作用向
# 核心注册表自注册（S3/S4）。缺席 = 零注册（引擎只装核心时本 group 为空）。
# 组内模块于 6b-2 git mv 后真实存在、于 6b-3 缝改造后被核心消费——
# 此前声明为惰性元数据（importlib.metadata 迭代不触发 import）。
[project.entry-points."dawei.tools"]
sanctions = "dawei_biz.tools.sanctions_tools"
normflow = "dawei_biz.tools.normflow_tools"
market = "dawei_biz.tools.market_tools"
research = "dawei_biz.tools.research_tools"
social_draft = "dawei_biz.tools.social_draft_tools"
legal_knowledge = "dawei_biz.tools.legal_knowledge_tools"

[project.entry-points."dawei.routers"]
# 单一聚合入口：dawei_biz.routers 暴露有序 routers: list[APIRouter]（ip 链有
# 依赖顺序：templates → workspace(+portfolio) → routes，catch-all 阴影问题见
# server_app 原 NOTE）。分模块多入口无法保证 importlib 迭代顺序，故不采用。
biz = "dawei_biz.routers"

[project.entry-points."dawei.sandbox_providers"]
e2b = "dawei_biz.saas.e2b_provider"
e2b_compat = "dawei_biz.saas.e2b_compat"
cubesandbox = "dawei_biz.saas.cubesandbox_provider"
agentenv = "dawei_biz.saas.agentenv_provider"
saas_gateway = "dawei_biz.saas.saas_gateway"
backend_selector = "dawei_biz.saas.backend_selector"
sandbox_admin = "dawei_biz.saas.sandbox_admin_methods"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 模板数据（S6）：三域模板随包分发，消费侧经 importlib.resources 读取
package-data = {dawei_biz = ["templates/**/*"]}
include-package-data = true

[tool.setuptools_scm]
write_to = "dawei_biz/_version.py"
version_scheme = "no-guess-dev"
fallback_version = "0.1.3"
# 与 engine/agent 同仓共享 git tags；向上搜索至仓库根
search_parent_directories = true
# Strip local version part (git hash) for PyPI compatibility
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["."]
include = ["dawei_biz*"]

# ========== Ruff Configuration（与 engine/agent 对齐） ==========
[tool.ruff]
target-version = "py312"
indent-width = 4
line-length = 320

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (requires running services)",
    "slow: Slow tests (large language model calls, network)",
]
testpaths = ["tests"]
# asyncio_mode=auto: 与 engine/agent 对齐 — 迁入的 fleet/bridge 测试含 async def。
asyncio_mode = "auto"
