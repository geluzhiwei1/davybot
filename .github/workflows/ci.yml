name: CI

# 拆库方案 §6 开源仓 CI 矩阵（engine × app × tui × server 零外呼冒烟）
# + §18.6 6c-4 双项目形态：engine-biz job（双装 G3 恒等门禁）。
# 门禁策略（沿 backend-ci.yml 惯例 + E5 收口 + §18.5 验收门）:
#   BLOCKING: 云默认守卫(E5/G4) / 工具系统门禁 / 拆库守卫 G1·G2·G6 / G3 双装恒等 /
#             app lint+typecheck+vitest+核心构建 / server 冒烟断言
#   NON-BLOCKING: 全量 unit（存量环境型失败未清零前只出报告）、biz 全量、ruff format / mypy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.19.0"
  PYTHON_VERSION: "3.12"

jobs:
  engine:
    name: Engine tests & guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: 1
        run: uv pip install --system -e ".[dev]"

      - name: Ruff format check (non-blocking)
        run: ruff format --check dawei/ || true

      - name: Mypy (non-blocking)
        run: mypy dawei/ || true

      # 拆库方案 §5.1 E5：代码字符串出现云端默认地址即 fail（docstring 豁免）
      - name: Cloud-default guard (BLOCKING)
        run: pytest tests/unit/test_no_cloud_defaults.py -v --tb=short

      - name: Tool system gate (BLOCKING)
        run: pytest tests/test_tool_contract.py tests/test_tool_system_health.py tests/test_smart_file_edit.py -v --tb=short

      # 拆库方案 §18.5 验收门（核心侧；只装核心即须全绿 —— 「业务不在场 = 不存在」）:
      #   G1 核心树 AST 零 dawei_biz import / G6 核心测试套件零 biz 残留
      #   G2 核心纯净冷启动：caps==["relay"]、catalog==核心 18 项、双装环境亦不得加载 biz
      - name: Split guards G1/G2/G6 (BLOCKING)
        run: pytest tests/test_biz_isolation.py tests/test_core_purity.py -v --tb=short

      - name: Unit tests (non-blocking until legacy env-dependent failures triaged)
        run: pytest -m unit -q --tb=short || true

  cli:
    name: CLI / TUI smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 注意：无 tui extra —— textual 是 base 依赖（pyproject [project.dependencies]），
      # 此前误写 ".[dev,tui]" 会在安装步直接红（uv: Extra 'tui' is not defined）。
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: 1
        run: uv pip install --system -e ".[dev]"

      - run: dawei --help
      - run: dawei server --help
      - run: dawei tui --help

      # E5 零外部服务矩阵 · tui 形态：无 TTY 无法交互启动 → 模式解析断言（BLOCKING）
      - name: TUI mode resolution assert (BLOCKING)
        env:
          DAWEI_RUNTIME_MODE: tui
        run: |
          python3 - <<'EOF'
          from dawei.runtime import validate_environment
          info = validate_environment()
          assert info["mode"] == "tui", info
          assert info["deployment_class"] == "local", info
          assert info["capabilities"] == [], info
          print("tui-mode OK:", info)
          EOF

  app:
    name: App lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run ci:lint

      - name: TypeScript type check
        run: npm run ci:typecheck

      # 核心形态 vitest（含 F7b biz 隔离守卫 biz-isolation.test.ts）
      - name: Unit tests
        run: npm run ci:test

      - name: Core server build
        run: npm run build:server

  # 拆库方案 §5.1 E5 / §9.5+§10.7 尾巴收口：无任何云 env 冷启 server + desktop 形态，
  # runtime-info 必须报 local + 各自合法 caps（零外部服务矩阵的 CI 化；
  # tui 形态在 cli job 以模式解析断言覆盖）。
  server-smoke:
    name: Server/desktop zero-cloud smoke (E5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build core web UI
        working-directory: app
        run: |
          npm ci
          npm run build:server

      - name: Stage frontend into engine
        run: rsync -a --delete app/dist/ engine/agent/dawei/frontend/

      - name: Install engine
        working-directory: engine/agent
        env:
          UV_SYSTEM_PYTHON: 1
        run: uv pip install --system -e ".[dev]"

      - name: Boot server with NO cloud env & assert local/relay
        run: |
          cd engine/agent
          dawei server start --host 127.0.0.1 --port 8931 > /tmp/dawei-smoke.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8931/api/runtime-info > /dev/null && break
            sleep 2
          done
          python3 - <<'EOF'
          import json, urllib.request
          info = json.load(urllib.request.urlopen("http://127.0.0.1:8931/api/runtime-info"))
          assert info.get("deployment_class") == "local", f"deployment_class: {info}"
          assert info.get("capabilities") == ["relay"], f"capabilities: {info}"
          print("runtime-info OK:", info)
          EOF
          UI_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8931/app-ui/)
          [ "$UI_CODE" = "200" ] || { echo "app-ui HTTP $UI_CODE"; tail -50 /tmp/dawei-smoke.log; exit 1; }
          kill $SRV || true

      # 零外部服务矩阵 · desktop 形态：与 Tauri sidecar 同一 DAWEI_RUNTIME_MODE 注入路径
      # （cli/commands/server.py setdefault → 显式 env 优先），断言全量本地 caps。
      - name: Boot desktop-mode server & assert full local caps
        run: |
          cd engine/agent
          DAWEI_RUNTIME_MODE=desktop dawei server start --host 127.0.0.1 --port 8932 > /tmp/dawei-desktop-smoke.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8932/api/runtime-info > /dev/null && break
            sleep 2
          done
          python3 - <<'EOF'
          import json, urllib.request
          info = json.load(urllib.request.urlopen("http://127.0.0.1:8932/api/runtime-info"))
          assert info.get("mode") == "desktop", info
          assert info.get("deployment_class") == "local", info
          assert info.get("capabilities") == ["auth", "sandbox", "local-mcp", "relay", "market"], info
          print("desktop runtime-info OK:", info)
          EOF
          UI_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8932/app-ui/)
          [ "$UI_CODE" = "200" ] || { echo "app-ui HTTP $UI_CODE"; tail -50 /tmp/dawei-desktop-smoke.log; exit 1; }
